<html lang="ru">
<head>

    <!-- Подключаем библиотеку для сенсорного джойстика -->

    <!-- Подключаем Firebase SDK -->

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            touch-action: none;
        }

        #auth-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            z-index: 999;
        }
        #auth-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 400px;
            background-color: #000000;
            border: 4px solid #111;
            box-sizing: border-box;
            padding: 20px;
            position: relative;
        }
        .auth-label {
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 8px;
            width: 100%;
            text-align: left;
            padding-left: 5px;
            letter-spacing: 1px;
        }
        .auth-input {
            width: 100%;
            height: 32px;
            background-color: #ffffff;
            border: none;
            color: #000000;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        .auth-input:focus {
            background-color: #f0f0f0;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }
        .auth-btn {
            flex: 1;
            height: 40px;
            background-color: #ffffff;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .auth-btn:hover {
            background-color: #e0e0e0;
        }
        .btn-login { color: #000000; }
        .btn-reg { color: #FF0000; }

        #app-wrapper {
            display: none;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a;
        }

        #sidebar {
            width: 220px;
            min-width: 220px;
            height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            background-color: #1a1a1a;
            position: relative;
            z-index: 10;
            padding-left: 5px;
            box-sizing: border-box;
        }
        #actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .action-btn {
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 16px;
            color: #ffffff;
            cursor: pointer;
            border: 4px solid #000;
            box-sizing: border-box;
            text-align: center;
            user-select: none;
            transition: transform 0.1s, filter 0.1s;
        }
        .action-btn:active {

            filter: brightness(0.8);
        }
        .action-btn.pink { background-color: #E54B8C; }
        .action-btn.gray { background-color: #666666; }

        #game-wrapper {
            flex: 1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #game-container {

        }
        @media (max-height: 500px) {

        }

    <script>
        // --- 0. ИНИЦИАЛИЗАЦИЯ FIREBASE ---
        const firebaseConfig = {
          apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
          authDomain: "steal-a-dushka.firebaseapp.com",
          databaseURL: "https://steal-a-dushka-default-rtdb.firebaseio.com",
          projectId: "steal-a-dushka",
          storageBucket: "steal-a-dushka.firebasestorage.app",
          messagingSenderId: "850469516444",
          appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
          measurementId: "G-WK4T3127ZX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 1. ОБРАБОТЧИК КНОПОК ---
        function doAction(action) {
            console.log('Нажата кнопка: ' + action);
            alert('Вы нажали: ' + action);
        }

        // --- 2. МАСШТАБИРОВАНИЕ ---
        function resizeGame() {
            const gameContainer = document.getElementById('game-container');
            const sidebar = document.getElementById('sidebar');
            if (!gameContainer || gameContainer.style.display === 'none') return;
            
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const baseSize = 400;
            
            const availWidth = windowWidth - sidebar.offsetWidth;
            const scaleX = availWidth / baseSize;
            const scaleY = windowHeight / baseSize;
            const scale = Math.min(scaleX, scaleY) * 0.95;
            
            gameContainer.style.transform = `scale(${scale})`;
        }
        window.addEventListener('resize', resizeGame);

        let touchDX = 0, touchDY = 0;
        let joystickManager = null;

        function initJoystick() {
            const zone = document.getElementById('joystick-zone');
            zone.style.display = 'block';
            if (typeof nipplejs === 'undefined') { return; }
            joystickManager = nipplejs.create({
                zone: zone, mode: 'static', position: { left: '50%', top: '50%' },
                color: 'white', size: 100, restOpacity: 0.5, fadeTime: 150
            });
            joystickManager.on('move', (evt, data) => {
                const force = Math.min(data.force, 1);
                const angle = data.angle.radian;
                touchDX = Math.cos(angle) * force;
                touchDY = -Math.sin(angle) * force;
            });
            joystickManager.on('end', () => { touchDX = 0; touchDY = 0; });
        }

        // --- 3. АВТОРИЗАЦИЯ И ЗАПУСК ИГРЫ ---
        function startGame() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-wrapper').style.display = 'flex';
            setTimeout(() => {
                resizeGame();
                initJoystick();
                initPlayer();
                requestAnimationFrame(updateGame);
            }, 50);
        }

        function handleRegister() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) { alert('Заполните НИК и ПАРОЛЬ!'); return; }
            
            // Сохраняем в Firebase Realtime Database
            const usersRef = db.ref('users/' + user);
            usersRef.once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    alert('Такой пользователь уже существует!');
                } else {
                    usersRef.set({
                        password: pass,
                        created_at: Date.now()
                    }).then(() => {
                        alert('Регистрация успешна! Добро пожаловать, ' + user + '!');
                        startGame();
                    });
                }
            });
        }

        function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            if (!user || !pass) { alert('Заполните НИК и ПАРОЛЬ!'); return; }
            
            const usersRef = db.ref('users/' + user);
            usersRef.once('value').then((snapshot) => {
                if (!snapshot.exists()) {
                    alert('Вы ещё не зарегистрированы. Нажмите "РЕГ"!');
                } else {
                    const data = snapshot.val();
                    if (data.password === pass) {
                        alert('Вход выполнен! С возвращением, ' + user + '!');
                        startGame();
                    } else {
                        alert('Неверный ПАРОЛЬ!');
                    }
                }
            });
        }

        // --- 4. ИГРА И КОЛЛИЗИИ ---
        const player = document.getElementById('player');

        const spawnPoints = [
            {x: 52, y: 22}, {x: 147, y: 22}, {x: 242, y: 22}, {x: 337, y: 22},
            {x: 52, y: 307}, {x: 147, y: 307}, {x: 242, y: 307}, {x: 337, y: 307}
        ];

        function initPlayer() {
            player.innerHTML = `<div class="pixel"></div><div class="pixel"></div>`;
            const pixels = player.querySelectorAll('.pixel');
            const BODY_COLORS = ['#26C64F', '#E81B23', '#E9A0D8', '#0D27A1', '#00DFF5', '#7A418F', '#FFFFFF', '#FB7817', '#000000'];
            const randomIndex = Math.floor(Math.random() * BODY_COLORS.length);
            const chosenColor = BODY_COLORS[randomIndex];
            pixels[0].style.backgroundColor = '#FFCC00'; 
            pixels[1].style.backgroundColor = chosenColor; 

            const spawn = spawnPoints[Math.floor(Math.random() * spawnPoints.length)];
            x = spawn.x;
            y = spawn.y;
            player.style.left = x + 'px';
            player.style.top = y + 'px';
        }

        const CELL_SIZE = 20; 
        const SPEED = 2 * CELL_SIZE; 
        let x = 195, y = 130;
        const MIN_X = 10, MAX_X = 400 - 10 - 10, MIN_Y = 10, MAX_Y = 400 - 20 - 10;
        
        const obstacles = [
            {x: 190, y: 137, w: 20, h: 20}, 
            {x: 150, y: 137, w: 20, h: 20}, 
            {x: 230, y: 137, w: 20, h: 24},
            {x: 150, y: 230, w: 20, h: 20},
            {x: 190, y: 230, w: 20, h: 20},
            {x: 230, y: 230, w: 20, h: 20}
        ];

        function rectCollide(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || 
                     r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        const keys = { arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            const key = e.key.toLowerCase();
            if(key in keys) { keys[key] = true; e.preventDefault(); }
        });
        document.addEventListener('keyup', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            const key = e.key.toLowerCase();
            if(key in keys) { keys[key] = false; e.preventDefault(); }
        });

        let previousTime = 0;
        function updateGame(currentTime) {
            if (document.getElementById('app-wrapper').style.display === 'none') return;
            requestAnimationFrame(updateGame);
            const dt = Math.min((currentTime - previousTime) / 1000, 0.1);
            previousTime = currentTime;
            let dx = 0, dy = 0;
            if (keys.arrowup) dy -= 1;
            if (keys.arrowdown) dy += 1;
            if (keys.arrowleft) dx -= 1;
            if (keys.arrowright) dx += 1;
            
            if (Math.abs(touchDX) > 0.05 || Math.abs(touchDY) > 0.05) {
                dx += touchDX;
                dy += touchDY;
            }
            
            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx*dx + dy*dy);
                const moveX = (dx / len) * SPEED * dt;
                const moveY = (dy / len) * SPEED * dt;

                const testX = x + moveX;
                const playerRectX = {x: testX, y: y, w: 10, h: 20};
                let blockedX = false;
                for (let obs of obstacles) {
                    if (rectCollide(playerRectX, obs)) { blockedX = true; break; }
                }
                if (!blockedX) x = testX;

                const testY = y + moveY;
                const playerRectY = {x: x, y: testY, w: 10, h: 20};
                let blockedY = false;
                for (let obs of obstacles) {
                    if (rectCollide(playerRectY, obs)) { blockedY = true; break; }
                }
                if (!blockedY) y = testY;
            }

            x = Math.max(MIN_X, Math.min(MAX_X, x));
            y = Math.max(MIN_Y, Math.min(MAX_Y, y));
            player.style.left = x + 'px';
            player.style.top = y + 'px';
        }
    </script>
</body>
