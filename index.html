<script>
// ========== СПИСОК БРЭИНРОТОВ ==========
const BRAINROTS_LIST=[

{file:'meme12.jpg',name:'Spider Pig',rarity:'mythic',income:500,price:50000},

{file:'meme25.jpg',name:'Неймар',rarity:'mythic',income:560,price:56000},

];
const RARITY_NAMES={common:'Обычный',horror:'Ужас',epic:'Эпический',legendary:'Легендарный',mythic:'Мифический',god:'Бог',secret:'Секретный',og:'ОГ'};
const RARITY_WEIGHTS={common:50,horror:25,epic:12,legendary:7,mythic:3,god:2,secret:0.9,og:0.1};
const TOTAL_WEIGHT=Object.values(RARITY_WEIGHTS).reduce((s,w)=>s+w,0);
function pickRarity(){let r=Math.random()*TOTAL_WEIGHT;for(let rar in RARITY_WEIGHTS){if(r<RARITY_WEIGHTS[rar])return rar;r-=RARITY_WEIGHTS[rar];}return 'common';}
function pickBrainrot(){const rar=pickRarity();const pool=BRAINROTS_LIST.filter(b=>b.rarity===rar);return pool[Math.floor(Math.random()*pool.length)];}

// ========== КООРДИНАТЫ ==========
const BASE_POSITIONS={1:{x:20,y:20},2:{x:110,y:20},3:{x:200,y:20},4:{x:290,y:20},5:{x:20,y:300},6:{x:110,y:300},7:{x:200,y:300},8:{x:290,y:300}};
const BASE_SPAWN={1:{x:52,y:81},2:{x:142,y:81},3:{x:232,y:81},4:{x:322,y:81},5:{x:52,y:300},6:{x:142,y:300},7:{x:232,y:300},8:{x:322,y:300}};
const GREEN_ZONE={1:{x:60,y:105},2:{x:150,y:105},3:{x:240,y:105},4:{x:330,y:105},5:{x:60,y:295},6:{x:150,y:295},7:{x:240,y:295},8:{x:330,y:295}};

// ========== ОБЪЕКТЫ (СТЕНЫ + ДЕКОР, ЧЕРЕЗ НИХ НЕЛЬЗЯ) ==========
const OBSTACLES=[
  // Стены центральной красной линии
  {x:0,y:170,w:16,h:60},
  {x:384,y:170,w:16,h:60},
  // RNG машина
  {x:190,y:137,w:20,h:20},
  // Синий магазин
  {x:150,y:137,w:20,h:20},
  // Пчела
  {x:230,y:137,w:20,h:24},
  // Красный магазин
  {x:150,y:230,w:20,h:20},
  // Круг RNG
  {x:190,y:230,w:20,h:20},
  // Белый магазин
  {x:230,y:230,w:20,h:20}
];

// ========== СОСТОЯНИЕ ==========
let x=200,y=200,coins=25,currentNickname=null,currentServerId=null,myBaseId=0,myBaseLocked=false;
let mySlots=new Array(10).fill(null);
let allBasesData={};
let otherPlayers={};
let otherPlayersData={};
let conveyorBrainrots=[];
let walkingBrainrots=[];
let lastConveyorSpawn=0;
let currentTarget=null;
const CONVEYOR_MAX=12, SPAWN_INTERVAL=2000, CONVEYOR_SPEED=0.5, BASE_MAX=10;

// ========== УТИЛ ==========
function formatNumber(num){if(num>=1e15)return(num/1e15).toFixed(2)+'Qa';if(num>=1e12)return(num/1e12).toFixed(2)+'T';if(num>=1e9)return(num/1e9).toFixed(2)+'B';if(num>=1e6)return(num/1e6).toFixed(2)+'M';if(num>=1e3)return(num/1e3).toFixed(2)+'K';return num.toString();}
function showModal(t,x){document.getElementById('modal-title').textContent=t;document.getElementById('modal-text').textContent=x;document.getElementById('custom-modal').style.display='block';}
function closeModal(){document.getElementById('custom-modal').style.display='none';}
function showNotif(t){const n=document.getElementById('notif');n.textContent=t;n.style.display='block';setTimeout(()=>{n.style.display='none';},4000);}
function resizeGame(){const g=document.getElementById('game-container');const w=window.innerWidth,h=window.innerHeight;let s=Math.min(w/500,h/500);s=Math.max(0.6,Math.min(1.2,s));g.style.transform=`scale(${s})`;}
window.addEventListener('resize',resizeGame);

// ========== COLLISION (AABB) ==========
function collide(r1,r2){
  return !(r2.x > r1.x+r1.w || r2.x+r2.w < r1.x || r2.y > r1.y+r1.h || r2.y+r2.h < r1.y);
}
// Проверка столкновения с объектами + другими игроками
function checkCollision(cx,cy){
  const rect={x:cx,y:cy,w:8,h:16};
  // Объекты (стены + декор)
  for(const o of OBSTACLES){ if(collide(rect,o)) return true; }
  // Другие игроки
  for(const k in otherPlayersData){
    const p=otherPlayersData[k];
    if(!p || p.x===undefined || p.y===undefined) continue;
    if(collide(rect,{x:p.x,y:p.y,w:8,h:16})) return true;
  }
  return false;
}

// ========== ДАННЫЕ ==========
async function readUserData(n){try{const s=await db.ref('users/'+n).once('value');return s.exists()?s.val():null}catch(e){return null}}
async function writeUserData(n,d){try{await db.ref('users/'+n).update(d)}catch(e){}}
async function handleRegister(){
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim();
  if(!u||!p){showModal('Ошибка','Заполните всё!');return;}
  const e=await readUserData(u);
  if(e){showModal('Ошибка','Ник занят!');return;}
  await writeUserData(u,{nickname:u,password:p,coins:25,dushka:0,baseId:0,baseLocked:false,baseSlots:new Array(10).fill(null),notifications:[],serverId:null,friends:[],friendRequests:[],avatar:'',background:''});
  currentNickname=u; showMainMenu();
}
async function handleLogin(){
  const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value.trim();
  if(!u||!p){showModal('Ошибка','Заполните всё!');return;}
  const e=await readUserData(u);
  if(!e){showModal('Ошибка','Ник не найден!');return;}
  if(e.password!==p){showModal('Ошибка','Неверный пароль!');return;}
  currentNickname=u; showMainMenu();
}
function showMainMenu(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='none';
  document.getElementById('exit-btn').style.display='none';
  document.getElementById('balance').style.display='none';
  document.getElementById('main-menu').style.display='flex';
}

// ========== СТАРТ ==========
async function playRandom(){
  const s=await db.ref('servers').once('value'); const servers=s.val()||{};
  let chosen=null;
  for(let id in servers){
    const p=await db.ref('servers/'+id+'/players').once('value');
    if(Object.keys(p.val()||{}).length<8){chosen=id;break;}
  }
  if(!chosen){const n=db.ref('servers').push();chosen=n.key;await n.set({name:'Тони Старк',access:'all'});}
  currentServerId=chosen;
  await db.ref('users/'+currentNickname).update({serverId:chosen});
  startGame();
}

async function startGame(){
  document.getElementById('main-menu').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('exit-btn').style.display='block';
  document.getElementById('balance').style.display='block';
  document.getElementById('version').style.display='block';
  const d=await readUserData(currentNickname);
  coins=d.coins||25; myBaseId=d.baseId||0; myBaseLocked=d.baseLocked||false; mySlots=d.baseSlots||new Array(10).fill(null);
  document.getElementById('balance-amount').textContent=formatNumber(coins);
  if(!myBaseId){myBaseId=await assignBase(); await db.ref('users/'+currentNickname).update({baseId:myBaseId});}
  await db.ref('servers/'+currentServerId+'/bases/'+myBaseId).set({owner:currentNickname,slots:mySlots,locked:myBaseLocked});
  await loadAllBases();
  const spawn=BASE_SPAWN[myBaseId]; x=spawn.x; y=spawn.y;
  renderPlayer(); renderAllBases();
  db.ref('servers/'+currentServerId+'/bases').on('value',snap=>{allBasesData=snap.val()||{};renderAllBases();});
  db.ref('servers/'+currentServerId+'/players').on('value',snap=>{renderOtherPlayers(snap.val()||{});});
  db.ref('users/'+currentNickname+'/notifications').on('value',snap=>{
    const n=snap.val()||[];
    if(n.length>0){const last=n[n.length-1];if(window._lastNotif!==last.ts){window._lastNotif=last.ts;showNotif(last.text);}}
  });
  await db.ref('servers/'+currentServerId+'/players/'+currentNickname).set({x:x,y:y,base:myBaseId});
  db.ref('servers/'+currentServerId+'/players/'+currentNickname).onDisconnect().remove();
  lastConveyorSpawn=Date.now();
  update(); window.focus(); resizeGame(); initJoystick();
}
async function assignBase(){
  const snap=await db.ref('servers/'+currentServerId+'/bases').once('value');
  const bases=snap.val()||{}; const taken=new Set();
  for(let b in bases){taken.add(parseInt(b));}
  for(let i=1;i<=8;i++){if(!taken.has(i))return i;}
  return 1;
}
async function loadAllBases(){
  const s=await db.ref('servers/'+currentServerId+'/bases').once('value');
  allBasesData=s.val()||{};
}

// ========== РЕНДЕР ==========
function renderPlayer(){
  const p=document.getElementById('player');
  p.innerHTML='<div class="pixel" style="background:#FFCC00"></div><div class="pixel" style="background:#FF0000"></div><div class="player-name">'+currentNickname+'</div>';
  p.style.left=x+'px'; p.style.top=y+'px';
}
function renderOtherPlayers(players){
  otherPlayersData=players;
  // Удаляем тех, кого нет
  for(const k in otherPlayers){
    if(!players[k]||k===currentNickname){otherPlayers[k].remove();delete otherPlayers[k];}
  }
  // Добавляем / обновляем
  for(const k in players){
    if(k===currentNickname)continue;
    const d=players[k]; if(!d)continue;
    if(!otherPlayers[k]){
      const div=document.createElement('div');
      div.className='other-player'; div.id='other-'+k;
      div.innerHTML='<div class="pixel" style="background:#00AAFF"></div><div class="pixel" style="background:#0088DD"></div><div class="player-name">'+k+'</div>';
      document.getElementById('game-container').appendChild(div);
      otherPlayers[k]=div;
    }
    if(d.x!==undefined) otherPlayers[k].style.left=d.x+'px';
    if(d.y!==undefined) otherPlayers[k].style.top=d.y+'px';
  }
}
function renderAllBases(){
  document.querySelectorAll('.base .nickname').forEach(e=>e.textContent='');
  for(const bid in allBasesData){
    const el=document.querySelector('.base[data-base="'+bid+'"]');
    if(el){const n=el.querySelector('.nickname');if(n)n.textContent=allBasesData[bid].owner||'';}
  }
  const myEl=document.querySelector('.base[data-base="'+myBaseId+'"]');
  if(myEl){const n=myEl.querySelector('.nickname');if(n)n.textContent=currentNickname;}
}

// ========== КОНВЕЙЕР ==========
function spawnConveyor(){
  if(conveyorBrainrots.length>=CONVEYOR_MAX)return;
  const br=pickBrainrot();
  const id='br_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  const dom=document.createElement('div');
  dom.className='brainrot-conveyor '+br.rarity;
  dom.style.backgroundImage='url(Картинки/'+br.file+')';
  dom.style.left='-30px'; dom.style.top='186px';
  const pt=document.createElement('div');
  pt.className='brainrot-price-tag';
  pt.textContent='$'+formatNumber(br.price);
  dom.appendChild(pt);
  document.getElementById('game-container').appendChild(dom);
  conveyorBrainrots.push({id,brainrot:br,x:-30,y:186,dom,locked:false});
}
function updateConveyor(dt){
  const now=Date.now();
  if(now-lastConveyorSpawn>SPAWN_INTERVAL){lastConveyorSpawn=now;spawnConveyor();}
  for(let i=conveyorBrainrots.length-1;i>=0;i--){
    const b=conveyorBrainrots[i];
    if(b.locked)continue;
    b.x+=CONVEYOR_SPEED*60*dt;
    b.dom.style.left=b.x+'px';
    if(b.x>=384){b.dom.remove();conveyorBrainrots.splice(i,1);}
  }
}

// ========== ХОДЯЩИЕ БРЭИНРОТЫ (в 4 раза медленнее игрока) ==========
function startWalking(br,startX,startY,targetX,targetY,onArrive){
  const dom=document.createElement('div');
  dom.className='brainrot-walker '+br.rarity;
  dom.style.backgroundImage='url(Картинки/'+br.file+')';
  dom.style.left=startX+'px'; dom.style.top=startY+'px';
  document.getElementById('game-container').appendChild(dom);
  walkingBrainrots.push({br,dom,x:startX,y:startY,targetX,targetY,onArrive});
}
function updateWalkers(dt){
  for(let i=walkingBrainrots.length-1;i>=0;i--){
    const w=walkingBrainrots[i];
    const dx=w.targetX-w.x, dy=w.targetY-w.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<3){
      w.dom.remove();
      if(w.onArrive)w.onArrive();
      walkingBrainrots.splice(i,1);
      continue;
    }
    // Игрок 2 px/frame, брэинрот в 4 раза медленнее = 0.5 px/frame
    const speed=0.5;
    const step=speed*(dt*60);
    w.x+=(dx/dist)*step;
    w.y+=(dy/dist)*step;
    w.dom.style.left=w.x+'px';
    w.dom.style.top=w.y+'px';
  }
}

// ========== ПОКУПКА ==========
async function buyConveyor(b){
  if(mySlots.filter(s=>s).length>=BASE_MAX){showModal('Ошибка','База полна (10/10)!');return;}
  if(coins<b.brainrot.price){showModal('Ошибка','Нужно $'+formatNumber(b.brainrot.price));return;}
  const free=mySlots.findIndex(s=>s===null);
  if(free<0){showModal('Ошибка','Нет свободного слота');return;}
  coins-=b.brainrot.price;
  document.getElementById('balance-amount').textContent=formatNumber(coins);
  const startX=b.x, startY=b.y;
  b.locked=true; b.dom.remove();
  const idx=conveyorBrainrots.indexOf(b); if(idx>-1) conveyorBrainrots.splice(idx,1);
  const bp=BASE_POSITIONS[myBaseId];
  const targetX=bp.x+20+(free%3)*15;
  const targetY=bp.y+25+Math.floor(free/3)*15;
  startWalking(b.brainrot,startX,startY,targetX,targetY,async()=>{
    mySlots[free]={file:b.brainrot.file,name:b.brainrot.name,rarity:b.brainrot.rarity,income:b.brainrot.income,price:b.brainrot.price,placedAt:Date.now()};
    await db.ref('users/'+currentNickname).update({coins:coins,baseSlots:mySlots});
    await db.ref('servers/'+currentServerId+'/bases/'+myBaseId+'/slots').set(mySlots);
    showNotif('✅ '+b.brainrot.name+' пришёл на базу!');
  });
}

// ========== ПРОДАЖА ==========
async function sellBrainrot(idx){
  const br=mySlots[idx]; if(!br)return;
  if(br.rarity==='god'||br.rarity==='secret'||br.rarity==='og'){
    window._pendingSell={idx,br};
    document.getElementById('confirm-text').textContent='Do you want to sell '+br.name+'?';
    document.getElementById('confirm-modal').style.display='flex';
    return;
  }
  await doSell(idx,br);
}
async function doSell(idx,br){
  const price=Math.floor(br.price*0.5);
  coins+=price; mySlots[idx]=null;
  document.getElementById('balance-amount').textContent=formatNumber(coins);
  await db.ref('users/'+currentNickname).update({coins:coins,baseSlots:mySlots});
  await db.ref('servers/'+currentServerId+'/bases/'+myBaseId+'/slots').set(mySlots);
  closeBaseMenu(); openBaseMenu();
  showNotif('💰 Продано: '+br.name+' +$'+formatNumber(price));
}
function confirmYes(){if(window._pendingSell){doSell(window._pendingSell.idx,window._pendingSell.br);window._pendingSell=null;}document.getElementById('confirm-modal').style.display='none';}
function confirmNo(){window._pendingSell=null;document.getElementById('confirm-modal').style.display='none';}

// ========== УПРАВЛЕНИЕ ==========
const keys={w:false,s:false,a:false,d:false};
let touchDX=0,touchDY=0,joystickManager=null;
function initJoystick(){
  const z=document.getElementById('joystick-zone'); z.style.display='block';
  if(typeof nipplejs==='undefined') return;
  joystickManager=nipplejs.create({zone:z,mode:'static',position:{left:'50%',top:'50%'},color:'white',size:100,restOpacity:0.5,fadeTime:150});
  joystickManager.on('move',(e,d)=>{const f=Math.min(d.force,1);touchDX=Math.cos(d.angle.radian)*f;touchDY=-Math.sin(d.angle.radian)*f;});
  joystickManager.on('end',()=>{touchDX=0;touchDY=0;});
}
document.addEventListener('keydown',e=>{
  const k=String(e.key||'').toLowerCase(); if(!k)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(k==='w'||k==='ц'||k==='arrowup'){keys.w=true;e.preventDefault()}
  if(k==='s'||k==='ы'||k==='arrowdown'){keys.s=true;e.preventDefault()}
  if(k==='a'||k==='ф'||k==='arrowleft'){keys.a=true;e.preventDefault()}
  if(k==='d'||k==='в'||k==='arrowright'){keys.d=true;e.preventDefault()}
  if(k==='e'||k==='у'){interact();e.preventDefault()}
});
document.addEventListener('keyup',e=>{
  const k=String(e.key||'').toLowerCase(); if(!k)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(k==='w'||k==='ц'||k==='arrowup'){keys.w=false;e.preventDefault()}
  if(k==='s'||k==='ы'||k==='arrowdown'){keys.s=false;e.preventDefault()}
  if(k==='a'||k==='ф'||k==='arrowleft'){keys.a=false;e.preventDefault()}
  if(k==='d'||k==='в'||k==='arrowright'){keys.d=false;e.preventDefault()}
});

// ========== ИГРОВОЙ ЦИКЛ ==========
let lastTime=0,lastSync=0;
function update(t=0){
  requestAnimationFrame(update);
  const dt=Math.min((t-lastTime)/1000,0.1); lastTime=t;
  let dx=0,dy=0;
  if(keys.w)dy-=1; if(keys.s)dy+=1; if(keys.a)dx-=1; if(keys.d)dx+=1;
  if(Math.abs(touchDX)>0.05||Math.abs(touchDY)>0.05){dx+=touchDX;dy+=touchDY;}
  if(dx!==0||dy!==0){
    const len=Math.sqrt(dx*dx+dy*dy);
    const stepX=(dx/len)*2; const stepY=(dy/len)*2;
    // Раздельная проверка по X и Y (split-axis)
    let nx=x+stepX;
    if(!checkCollision(nx,y)) x=nx;
    let ny=y+stepY;
    if(!checkCollision(x,ny)) y=ny;
    x=Math.max(10,Math.min(390,x));
    y=Math.max(10,Math.min(390,y));
    document.getElementById('player').style.left=x+'px';
    document.getElementById('player').style.top=y+'px';
  }
  if(Date.now()-lastSync>100){
    if(currentServerId) db.ref('servers/'+currentServerId+'/players/'+currentNickname).update({x:x,y:y});
    lastSync=Date.now();
  }
  updateConveyor(dt);
  updateWalkers(dt);
  updateTarget();
}
function updateTarget(){
  const pc={x:x+4,y:y+8}; currentTarget=null;
  // 1. Брэинроты на дорожке
  for(const b of conveyorBrainrots){
    if(b.locked)continue;
    const d=Math.hypot(pc.x-(b.x+14),pc.y-(b.y+14));
    if(d<25){currentTarget={type:'conveyor',target:b};showE();return;}
  }
  // 2. Декоративные объекты
  const objs=[
    {id:'rng-machine',x:190,y:137,w:20,h:20,action:'showModal',args:['RNG Машина','Здесь будет приз!']},
    {id:'shop-blue',x:150,y:137,w:20,h:20,action:'openShop'},
    {id:'queen-bee',x:230,y:137,w:20,h:24,action:'openBee'},
    {id:'shop-red',x:150,y:230,w:20,h:20,action:'openRedShop'},
    {id:'rng-circle',x:190,y:230,w:20,h:20,action:'openWheel'},
    {id:'shop-white',x:230,y:230,w:20,h:20,action:'showModal',args:['Trade','Скоро!']}
  ];
  for(const o of objs){
    const d=Math.hypot(pc.x-(o.x+10),pc.y-(o.y+o.h/2));
    if(d<28){currentTarget={type:'obj',obj:o};showE();return;}
  }
  // 3. Зелёная зона на своей базе
  const gz=GREEN_ZONE[myBaseId];
  if(gz){
    const d=Math.hypot(pc.x-gz.x,pc.y-gz.y);
    if(d<25){currentTarget={type:'base'};showE();return;}
  }
  hideE();
}
function showE(){const e=document.getElementById('interact');e.style.display='flex';e.style.left=(x-9)+'px';e.style.top=(y-42)+'px';}
function hideE(){document.getElementById('interact').style.display='none';}
function interact(){
  if(!currentTarget)return;
  if(currentTarget.type==='conveyor'){buyConveyor(currentTarget.target);}
  else if(currentTarget.type==='base'){openBaseMenu();}
  else if(currentTarget.type==='obj'){
    const o=currentTarget.obj;
    if(o.action==='openShop')openShop();
    else if(o.action==='openBee')openBee();
    else if(o.action==='openRedShop')openRedShop();
    else if(o.action==='openWheel')openWheel();
    else if(o.action==='showModal')showModal(o.args[0],o.args[1]);
  }
}
document.getElementById('interact').onclick=interact;

// ========== МЕНЮ БАЗЫ ==========
function openBaseMenu(){
  const c=document.getElementById('bm-list'); c.innerHTML='';
  const totalIncome=mySlots.reduce((s,br)=>s+(br?br.income:0),0);
  const info=document.createElement('div'); info.className='bm-info';
  info.textContent='Брэинротов: '+mySlots.filter(s=>s).length+'/10 | Доход: $'+formatNumber(totalIncome)+'/сек';
  c.appendChild(info);
  if(mySlots.filter(s=>s).length===0){
    const e=document.createElement('div'); e.className='bm-empty'; e.textContent='Пока нет брэинротов'; c.appendChild(e);
  } else {
    mySlots.forEach((br,i)=>{
      if(!br)return;
      const row=document.createElement('div'); row.className='bm-row';
      row.innerHTML=`<div class="icon" style="background-image:url('Картинки/${br.file}')"></div><div class="info"><div class="name">${br.name}</div><div class="line">${RARITY_NAMES[br.rarity]} · $${formatNumber(br.income)}/сек</div><div class="line">Цена: $${formatNumber(br.price)}</div></div><button class="sell-btn" onclick="sellBrainrot(${i})">Продать</button>`;
      c.appendChild(row);
    });
  }
  document.getElementById('base-menu').style.display='block';
}
function closeBaseMenu(){document.getElementById('base-menu').style.display='none';}

// ========== МАГАЗИНЫ ==========
const shopItems=[{name:'Slap',desc:'Slap thieves!',price:500},{name:'Speed Coil',desc:'Zoom around!',price:750},{name:'Trap',desc:'Freeze 10 sec',price:1000},{name:'Iron Slap',desc:'Heavy slap!',price:2500},{name:'Gravity Coil',desc:'Jump high!',price:3000}];
function openShop(){
  const c=document.getElementById('shop-list'); c.innerHTML='';
  shopItems.forEach(item=>{
    const d=document.createElement('div'); d.className='shop-item';
    d.innerHTML=`<div class="icon">🛒</div><div class="info"><div class="name">${item.name}</div><div class="desc">${item.desc}</div></div><button class="price-btn" onclick="buyShopItem('${item.name}',${item.price})">$${item.price}</button>`;
    c.appendChild(d);
  });
  document.getElementById('shop-menu').style.display='block';
}
function closeShop(){document.getElementById('shop-menu').style.display='none';}
async function buyShopItem(name,price){
  if(coins>=price){coins-=price;document.getElementById('balance-amount').textContent=formatNumber(coins);await db.ref('users/'+currentNickname).update({coins:coins});showModal('Покупка','Куплено: '+name);}
  else showModal('Ошибка','Нужно $'+price);
}

const beeItems=[{name:'Conetto Morsetto',emoji:'🦝',price:499},{name:'Honey Honey Bear',emoji:'🐻',price:999},{name:'Queen Bee',emoji:'🐝',price:2499},{name:"S'more Serat",emoji:'🍫',price:4999},{name:'Bumbatron',emoji:'🤖',price:9999}];
function openBee(){
  const c=document.getElementById('bee-list'); c.innerHTML='';
  beeItems.forEach(b=>{
    const d=document.createElement('div'); d.className='bee-card';
    d.innerHTML=`<div class="img">${b.emoji}</div><div class="info"><div class="name">${b.name}</div></div><button class="price-btn" onclick="showModal('Пчёлы','Куплено: ${b.name}')">D ${b.price}</button>`;
    c.appendChild(d);
  });
  document.getElementById('bee-menu').style.display='block';
}
function closeBee(){document.getElementById('bee-menu').style.display='none';}

function openRedShop(){
  const c=document.getElementById('red-list'); c.innerHTML='';
  [{name:'Blackhole Slap',price:199},{name:'Ban Hammer',price:1125},{name:'VIP',price:375}].forEach(item=>{
    const d=document.createElement('div'); d.className='shop-item';
    d.innerHTML=`<div class="icon">⭐</div><div class="info"><div class="name">${item.name}</div></div><button class="price-btn" onclick="showModal('Premium','Куплено: ${item.name}')">🪙 ${item.price}</button>`;
    c.appendChild(d);
  });
  document.getElementById('red-shop-menu').style.display='block';
}
function closeRedShop(){document.getElementById('red-shop-menu').style.display='none';}

function openWheel(){
  const c=document.getElementById('wheel-list');
  c.innerHTML='<div style="text-align:center;color:#fff;padding:20px"><div style="font-size:60px">🎡</div><button style="background:#f7b731;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px" onclick="doSpin()">Крутить</button></div>';
  document.getElementById('wheel-menu').style.display='block';
}
function closeWheel(){document.getElementById('wheel-menu').style.display='none';}
function doSpin(){
  const prizes=[12000,1000000,50000,250000];
  const win=prizes[Math.floor(Math.random()*prizes.length)];
  coins+=win; document.getElementById('balance-amount').textContent=formatNumber(coins);
  db.ref('users/'+currentNickname).update({coins:coins});
  showModal('Колесо','🎉 Выпало: $'+formatNumber(win));
}

// ========== СЕРВЕРЫ / ДРУЗЬЯ / ПРОФИЛЬ ==========
async function openServers(){
  document.getElementById('main-menu').style.display='none';
  document.getElementById('server-menu').style.display='block';
  const c=document.getElementById('server-list'); c.innerHTML='';
  const s=await db.ref('servers').once('value');
  const servers=s.val()||{};
  for(let id in servers){
    const div=document.createElement('div'); div.className='server-item';
    div.innerHTML='<div class="name">'+servers[id].name+'</div><button class="join-btn" onclick="joinServer(\''+id+'\')">Join</button>';
    c.appendChild(div);
  }
}
function closeServers(){document.getElementById('server-menu').style.display='none'; showMainMenu();}
async function joinServer(id){currentServerId=id; closeServers(); startGame();}
function openCreateServer(){document.getElementById('create-server-modal').style.display='block';}
function closeCreateServer(){document.getElementById('create-server-modal').style.display='none';}
async function createServer(){
  const n=document.getElementById('server-name').value.trim();
  if(!n){showModal('Ошибка','Введите название');return;}
  const r=db.ref('servers').push();
  await r.set({name:n,access:'all',owner:currentNickname});
  closeCreateServer(); openServers();
}

function openFriends(){document.getElementById('main-menu').style.display='none'; document.getElementById('friends-menu').style.display='block';}
function closeFriends(){document.getElementById('friends-menu').style.display='none'; showMainMenu();}
function openProfile(){document.getElementById('main-menu').style.display='none'; document.getElementById('profile-menu').style.display='block';}
function closeProfile(){document.getElementById('profile-menu').style.display='none'; showMainMenu();}

// ========== ВЫХОД ==========
async function exitToMenu(){
  if(currentServerId && currentNickname){
    try{ await db.ref('servers/'+currentServerId+'/players/'+currentNickname).remove(); }catch(e){}
  }
  conveyorBrainrots.forEach(b=>b.dom.remove()); conveyorBrainrots=[];
  walkingBrainrots.forEach(w=>w.dom.remove()); walkingBrainrots=[];
  for(const k in otherPlayers){otherPlayers[k].remove();}
  otherPlayers={}; otherPlayersData={};
  document.getElementById('app').style.display='none';
  document.getElementById('exit-btn').style.display='none';
  document.getElementById('balance').style.display='none';
  document.getElementById('main-menu').style.display='flex';
}
window.addEventListener('load',()=>{resizeGame();});
