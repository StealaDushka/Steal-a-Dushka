<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Укради Брэйнрот - Полная версия</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; overflow: hidden; }
        #app { width: 100%; height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #1a1f2b; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 520px; margin: 20px auto; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 15px; background: #252d3d; border: none; border-radius: 12px; color: #fff; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-primary { background: #4a7cf7; }
        .btn-primary:hover { background: #3a6be0; }
        .btn-secondary { background: #3a3f4e; }
        .btn-secondary:hover { background: #4a5060; }
        .menu-btn { display: block; width: 100%; padding: 20px; margin-bottom: 12px; background: #252d3d; text-align: center; font-size: 20px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { background: #2f3a50; }
        .profile-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #333; object-fit: cover; border: 3px solid #4a7cf7; }
        .nick { font-size: 24px; font-weight: bold; }
        .stat { color: #aaa; font-size: 14px; }
        .section-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .back-btn { background: #3a3f4e; margin-bottom: 20px; }
        .back-btn:hover { background: #4a5060; }
        .friend-item, .server-item { background: #252d3d; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .server-item .join-btn { width: auto; padding: 8px 25px; background: #4a7cf7; border-radius: 30px; font-size: 14px; }
        .badge-vip { background: #f7c948; color: #000; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: bold; }
        .badge-public { background: #4a7cf7; color: #fff; padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e14; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .progress-bar { width: 80%; height: 10px; background: #252d3d; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .progress-fill { height: 100%; width: 0%; background: #4a7cf7; transition: width 0.1s; }
        .progress-text { font-size: 20px; margin-top: 10px; }
        #gameContainer { position: relative; width: 100%; height: 100vh; }
        #gameUI { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .exit-btn { background: #ff6b6b; padding: 10px 20px; border-radius: 10px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        .exit-btn:hover { background: #e55a5a; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row input { flex: 1; margin-bottom: 0; }
        .flex-row button { width: auto; padding: 10px 20px; margin-bottom: 0; }
        .small-btn { width: auto; padding: 5px 15px; font-size: 14px; margin: 0 5px; }
        #serverList { max-height: 400px; overflow-y: auto; }
        .steal-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; color: #f7c948; text-shadow: 0 0 10px #f7c948; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        .steal-msg.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Авторизация -->
        <div id="authSection" class="card" style="margin-top: 50px;">
            <h2 style="margin-bottom:20px; text-align:center;">Вход / Регистрация</h2>
            <input type="text" id="authNick" placeholder="Ваш никнейм">
            <input type="password" id="authPass" placeholder="Пароль">
            <button id="registerBtn" class="btn-primary">Создать аккаунт</button>
            <button id="loginBtn" class="btn-secondary">Войти</button>
            <div id="authMsg" style="margin-top:15px; text-align:center; color:#ff6b6b; font-weight:bold;"></div>
        </div>

        <!-- Меню -->
        <div id="menuSection" class="hidden" style="max-width: 520px; margin: 50px auto;">
            <div class="profile-row">
                <img id="menuAvatar" class="avatar" src="https://ui-avatars.com/api/?name=Guest&background=random&color=fff&size=80" alt="avatar">
                <div>
                    <div class="nick" id="menuNick">Гость</div>
                    <div class="stat">ID: <span id="menuId">-</span></div>
                </div>
            </div>
            <div class="menu-btn" onclick="openProfile()">👤 Профиль</div>
            <div class="menu-btn" onclick="openFriends()">👥 Друзья</div>
            <div class="menu-btn" onclick="openServers()">🖥️ Серверы</div>
            <div class="menu-btn" onclick="quickPlay()">▶️ Играть (Укради мозг!)</div>
            <div style="margin-top:20px; text-align:center; color:#666; font-size:14px; cursor:pointer;" onclick="logout()">Выйти</div>
        </div>

        <!-- Профиль -->
        <div id="profileSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Профиль</div>
            <div class="profile-row">
                <img id="profileAvatar" class="avatar" src="https://ui-avatars.com/api/?name=Guest&background=random&color=fff&size=80" alt="avatar">
                <div>
                    <div class="nick" id="profileNick">Гость</div>
                    <div class="stat">ID: <span id="profileId">-</span></div>
                </div>
            </div>
            <label style="display:block; margin-bottom:5px;">Сменить аватарку (PNG/JPG)</label>
            <input type="file" id="avatarInput" accept="image/*">
            <label style="display:block; margin:15px 0 5px;">Сменить скин (для 3D-модели)</label>
            <input type="file" id="skinInput" accept="image/*">
            <label style="display:block; margin:15px 0 5px;">Сменить пароль</label>
            <input type="password" id="newPass" placeholder="Новый пароль">
            <button onclick="changePassword()" class="btn-primary">Сохранить пароль</button>
        </div>

        <!-- Друзья -->
        <div id="friendsSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Друзья</div>
            <div class="flex-row">
                <input type="text" id="friendSearch" placeholder="Ник друга">
                <button onclick="sendFriendRequest()" class="btn-primary" style="width:auto; padding:10px 20px;">➕</button>
            </div>
            <div id="friendRequests" style="margin-bottom:15px;">
                <div style="color:#aaa; font-size:14px;">📩 Запросы:</div>
                <div id="requestsList"></div>
            </div>
            <div id="friendsList">
                <div style="color:#aaa; font-size:14px;">👥 Мои друзья:</div>
                <div id="friendsListContainer"></div>
            </div>
        </div>

        <!-- Серверы -->
        <div id="serversSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Серверы</div>
            <div id="serverList"></div>
        </div>

        <!-- Загрузка -->
        <div id="loadingOverlay" class="hidden">
            <div style="font-size:30px;">⏳ Загрузка...</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- 3D Сцена -->
        <div id="gameContainer" class="hidden">
            <div id="gameUI">
                <button class="exit-btn" onclick="exitGame()">✕ Выйти</button>
            </div>
            <div id="stealMsg" class="steal-msg">🧠 КРАЖА!</div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <!-- Firebase SDK + Three.js -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js",
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        // ------------------------------------------------------------
        // ПОЛНЫЙ КОД: Друзья, Серверы, Мультиплеер, Модель человека, ПКМ, Карта
        // ------------------------------------------------------------
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, set, get, update, remove, push, onValue, onChildAdded, onChildChanged, onChildRemoved } from 'firebase/database';
        import * as THREE from 'three';

        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM
        const authSection = document.getElementById('authSection');
        const menuSection = document.getElementById('menuSection');
        const profileSection = document.getElementById('profileSection');
        const friendsSection = document.getElementById('friendsSection');
        const serversSection = document.getElementById('serversSection');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const gameContainer = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const serverList = document.getElementById('serverList');
        const requestsList = document.getElementById('requestsList');
        const friendsListContainer = document.getElementById('friendsListContainer');
        const friendSearch = document.getElementById('friendSearch');
        const stealMsg = document.getElementById('stealMsg');

        const authNick = document.getElementById('authNick');
        const authPass = document.getElementById('authPass');
        const registerBtn = document.getElementById('registerBtn');
        const loginBtn = document.getElementById('loginBtn');
        const authMsg = document.getElementById('authMsg');

        const menuNick = document.getElementById('menuNick');
        const menuId = document.getElementById('menuId');
        const menuAvatar = document.getElementById('menuAvatar');
        const profileNick = document.getElementById('profileNick');
        const profileId = document.getElementById('profileId');
        const profileAvatar = document.getElementById('profileAvatar');
        const newPass = document.getElementById('newPass');
        const avatarInput = document.getElementById('avatarInput');
        const skinInput = document.getElementById('skinInput');

        let currentNick = null;
        let currentUid = null;
        let currentUserData = null;
        let currentServerId = null;
        let currentBrain = 100;

        // -------------------- 3D Переменные --------------------
        let scene, camera, renderer, player;
        let keys = { w: false, a: false, s: false, d: false };
        let animationId = null;
        let playerPosRef = null;
        let updateInterval = null;
        let otherPlayers = {}; // { uid: THREE.Group }
        let otherPlayersData = {}; // { uid: { x, z, nick, skin } }

        let camTheta = 0; // Горизонтальный угол
        let camRadius = 15; // Расстояние до камеры
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;

        // -------------------- Утилиты --------------------
        function showLoading(callback) {
            loadingOverlay.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                        if (callback) callback();
                    }, 500);
                }
            }, 100);
        }

        async function loginUser(nick, pass) {
            const userRef = ref(db, 'users/' + nick);
            const snap = await get(userRef);
            if (!snap.exists()) { authMsg.textContent = '❌ Пользователь не найден!'; return false; }
            const data = snap.val();
            if (data.password !== pass) { authMsg.textContent = '❌ Неверный пароль!'; return false; }
            currentNick = nick; currentUid = nick; currentUserData = data;
            localStorage.setItem('stealSession', JSON.stringify({ nick, password: pass }));
            return true;
        }

        // -------------------- Регистрация --------------------
        registerBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim(); const pass = authPass.value.trim();
            if (!nick || !pass) { authMsg.textContent = 'Заполни все поля!'; return; }
            const userRef = ref(db, 'users/' + nick);
            if ((await get(userRef)).exists()) { authMsg.textContent = '❌ Этот ник уже занят!'; return; }
            await set(userRef, {
                nick: nick, password: pass,
                avatar: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(nick) + '&background=random&color=fff&size=80',
                skin: '', friends: {}, friendRequests: {}
            });
            if (!(await get(ref(db, 'admins/Dushka'))).exists()) {
                await set(ref(db, 'admins/Dushka'), { nick: 'Dushka', password: '16052014may' });
            }
            authMsg.textContent = '✅ Аккаунт создан! Теперь войди.'; authMsg.style.color = '#4a7cf7';
        });

        // -------------------- Вход --------------------
        loginBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim(); const pass = authPass.value.trim();
            if (!nick || !pass) { authMsg.textContent = 'Заполни все поля!'; return; }
            if (await loginUser(nick, pass)) { authMsg.textContent = ''; showMenu(); }
        });

        async function checkSession() {
            const session = localStorage.getItem('stealSession');
            if (session) {
                const { nick, password } = JSON.parse(session);
                if (await loginUser(nick, password)) { showMenu(); return; }
                localStorage.removeItem('stealSession');
            }
            authSection.classList.remove('hidden');
        }

        // -------------------- Навигация --------------------
        function showMenu() {
            authSection.classList.add('hidden'); menuSection.classList.remove('hidden');
            profileSection.classList.add('hidden'); friendsSection.classList.add('hidden'); serversSection.classList.add('hidden');
            gameContainer.classList.add('hidden');
            stopGame();

            menuNick.textContent = currentUserData.nick; menuId.textContent = currentUid.slice(0, 6);
            menuAvatar.src = currentUserData.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUserData.nick) + '&background=random&color=fff&size=80';
            profileNick.textContent = currentUserData.nick; profileId.textContent = currentUid.slice(0, 6);
            profileAvatar.src = currentUserData.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUserData.nick) + '&background=random&color=fff&size=80';

            loadFriends(); loadFriendRequests();
        }

        function stopGame() {
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            if (renderer) { renderer.dispose(); renderer = null; }
            if (updateInterval) { clearInterval(updateInterval); updateInterval = null; }
            if (playerPosRef) { remove(playerPosRef); playerPosRef = null; }
            if (currentServerId) { leaveServer(currentServerId); currentServerId = null; }
            
            // Убираем других игроков
            Object.keys(otherPlayers).forEach(uid => {
                scene.remove(otherPlayers[uid]);
                delete otherPlayers[uid];
            });
            otherPlayersData = {};
        }

        window.openProfile = function() { menuSection.classList.add('hidden'); profileSection.classList.remove('hidden'); };
        window.openFriends = function() { menuSection.classList.add('hidden'); friendsSection.classList.remove('hidden'); loadFriends(); loadFriendRequests(); };
        window.openServers = function() { menuSection.classList.add('hidden'); serversSection.classList.remove('hidden'); loadServers(); };
        window.openMenu = function() { profileSection.classList.add('hidden'); friendsSection.classList.add('hidden'); serversSection.classList.add('hidden'); menuSection.classList.remove('hidden'); };
        window.logout = function() {
            localStorage.removeItem('stealSession'); currentNick = null; currentUid = null; currentUserData = null;
            if (currentServerId) { leaveServer(currentServerId); currentServerId = null; }
            menuSection.classList.add('hidden'); profileSection.classList.add('hidden'); friendsSection.classList.add('hidden'); serversSection.classList.add('hidden');
            authSection.classList.remove('hidden'); authMsg.textContent = ''; authNick.value = ''; authPass.value = '';
        };

        // -------------------- Профиль --------------------
        window.changePassword = async function() {
            const newP = newPass.value.trim();
            if (!newP) return alert('Введи новый пароль');
            await update(ref(db, 'users/' + currentUid + '/password'), { password: newP });
            alert('Пароль обновлён!'); newPass.value = '';
        };

        avatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const dataUrl = ev.target.result;
                await update(ref(db, 'users/' + currentUid + '/avatar'), { avatar: dataUrl });
                menuAvatar.src = dataUrl; profileAvatar.src = dataUrl;
                alert('Аватарка обновлена!');
            };
            reader.readAsDataURL(file);
        });

        skinInput.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const dataUrl = ev.target.result;
                await update(ref(db, 'users/' + currentUid + '/skin'), { skin: dataUrl });
                currentUserData.skin = dataUrl;
                alert('Скин сохранён!');
            };
            reader.readAsDataURL(file);
        });

        // -------------------- Друзья --------------------
        window.sendFriendRequest = async function() {
            const targetNick = friendSearch.value.trim();
            if (!targetNick) return alert('Введи ник друга');
            if (targetNick === currentUserData.nick) return alert('Нельзя добавить себя');
            const snap = await get(ref(db, 'users'));
            if (!snap.exists()) return alert('Нет пользователей');
            let targetUid = null;
            snap.forEach((child) => { if (child.val().nick === targetNick) targetUid = child.key; });
            if (!targetUid) return alert('Пользователь не найден');
            if (targetUid === currentUid) return alert('Это ты');
            await set(ref(db, 'users/' + targetUid + '/friendRequests/' + currentUid), { from: currentUserData.nick, timestamp: Date.now() });
            alert('Запрос отправлен!'); friendSearch.value = '';
        };

        function loadFriendRequests() {
            if (!currentUid) return;
            onValue(ref(db, 'users/' + currentUid + '/friendRequests'), (snap) => {
                requestsList.innerHTML = '';
                if (!snap.exists()) { requestsList.innerHTML = '<div style="color:#666;">Нет запросов</div>'; return; }
                snap.forEach((child) => {
                    const data = child.val();
                    const div = document.createElement('div'); div.className = 'friend-item';
                    div.innerHTML = `<span>${data.from}</span><div><button class="small-btn" onclick="acceptRequest('${child.key}')" style="background:#4a7cf7;">✔</button><button class="small-btn" onclick="rejectRequest('${child.key}')" style="background:#6b6b6b;">✖</button></div>`;
                    requestsList.appendChild(div);
                });
            });
        }

        window.acceptRequest = async function(requesterUid) {
            const userSnap = await get(ref(db, 'users/' + requesterUid));
            const requesterNick = userSnap.exists() ? userSnap.val().nick : 'Неизвестный';
            await set(ref(db, 'users/' + currentUid + '/friends/' + requesterUid), { nick: requesterNick });
            await remove(ref(db, 'users/' + currentUid + '/friendRequests/' + requesterUid));
            await set(ref(db, 'users/' + requesterUid + '/friends/' + currentUid), { nick: currentUserData.nick });
            loadFriends(); loadFriendRequests();
        };
        window.rejectRequest = async function(requesterUid) {
            await remove(ref(db, 'users/' + currentUid + '/friendRequests/' + requesterUid));
            loadFriendRequests();
        };

        function loadFriends() {
            if (!currentUid) return;
            onValue(ref(db, 'users/' + currentUid + '/friends'), (snap) => {
                friendsListContainer.innerHTML = '';
                if (!snap.exists()) { friendsListContainer.innerHTML = '<div style="color:#666;">У тебя пока нет друзей</div>'; return; }
                snap.forEach((child) => {
                    const data = child.val();
                    const div = document.createElement('div'); div.className = 'friend-item';
                    div.innerHTML = `<span>${data.nick || 'Неизвестный'}</span>`;
                    friendsListContainer.appendChild(div);
                });
            });
        }

        // -------------------- Серверы --------------------
        async function createPublicServer() {
            const newRef = push(ref(db, 'publicServers'));
            await set(newRef, { players: 0, max: 8, createdAt: Date.now() });
            return newRef.key;
        }

        async function getAvailablePublicServer() {
            const snap = await get(ref(db, 'publicServers'));
            if (!snap.exists()) return await createPublicServer();
            let available = null;
            snap.forEach((child) => { const data = child.val(); if (data.players < data.max && !available) available = child.key; });
            if (!available) available = await createPublicServer();
            return available;
        }

        async function joinServer(serverId) {
            if (!currentUid) return alert('Сначала войди');
            if (currentServerId) await leaveServer(currentServerId);
            const path = 'publicServers/' + serverId;
            const snap = await get(ref(db, path));
            if (!snap.exists()) return alert('Сервер не найден');
            const data = snap.val();
            if (data.players >= data.max) return alert('Сервер заполнен!');
            await update(ref(db, path), { players: data.players + 1 });
            currentServerId = serverId;
            showLoading(() => { init3D(); });
        }

        async function leaveServer(serverId) {
            if (!serverId) return;
            const path = 'publicServers/' + serverId;
            const snap = await get(ref(db, path));
            if (snap.exists()) {
                const data = snap.val();
                await update(ref(db, path), { players: Math.max(0, data.players - 1) });
            }
            currentServerId = null;
        }

        window.quickPlay = async function() {
            if (!currentUid) return alert('Сначала войди');
            const serverId = await getAvailablePublicServer();
            await joinServer(serverId);
        };

        function loadServers() {
            onValue(ref(db, 'publicServers'), async (snap) => {
                let publicServers = [];
                if (snap.exists()) {
                    snap.forEach((child) => { publicServers.push({ id: child.key, ...child.val(), type: 'public', name: 'Публичный #' + child.key.slice(0, 4) }); });
                }
                serverList.innerHTML = '';
                if (publicServers.length === 0) { serverList.innerHTML = '<div style="color:#666;">Нет серверов</div>'; return; }
                publicServers.forEach(s => {
                    const div = document.createElement('div'); div.className = 'server-item';
                    div.innerHTML = `<div><strong>${s.name}</strong><span class="badge-public" style="background:#4a7cf7; color:#fff; padding:4px 12px; border-radius:30px; font-size:12px;">Публичный</span><div style="font-size:13px; color:#aaa;">${s.players || 0}/${s.max || 8} игроков</div></div><button class="join-btn" onclick="joinServer('${s.id}')">Join</button>`;
                    serverList.appendChild(div);
                });
            });
        }

        // -------------------- 3D Игра (МУЛЬТИПЛЕЕР, МОДЕЛЬ, УПРАВЛЕНИЕ) --------------------
        function createPlayerModel(skinUrl, isOther = false) {
            const group = new THREE.Group();
            const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
            const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.8, 8);

            let material;
            // Обработка ошибки загрузки текстуры, чтобы не было 404 в консоли
            const onTextureError = (err) => { console.warn("Ошибка скина", err); };
            
            if (skinUrl && typeof skinUrl === 'string' && skinUrl.startsWith('data:image')) {
                const loader = new THREE.TextureLoader();
                const texture = loader.load(skinUrl, undefined, undefined, onTextureError);
                texture.flipY = false; // Важно для роблоксовских скинов
                material = new THREE.MeshStandardMaterial({ map: texture });
            } else {
                material = new THREE.MeshStandardMaterial({ color: isOther ? 0xff6b6b : 0x4a7cf7 });
            }

            const head = new THREE.Mesh(headGeo, material);
            head.position.y = 0.7;
            const body = new THREE.Mesh(bodyGeo, material);
            body.position.y = 0.2;

            group.add(head);
            group.add(body);
            return group;
        }

        function init3D() {
            gameContainer.classList.remove('hidden');
            menuSection.classList.add('hidden');
            profileSection.classList.add('hidden');
            friendsSection.classList.add('hidden');
            serversSection.classList.add('hidden');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1f2b);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camTheta = 0.5;
            camRadius = 15;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // КАРТА (АРЕНА С ЗАБОРАМИ)
            const groundGeo = new THREE.PlaneGeometry(40, 40);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, side: THREE.DoubleSide });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const gridHelper = new THREE.GridHelper(40, 20, 0x555555, 0x444444);
            scene.add(gridHelper);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x333333, transparent: true, opacity: 0.5 });
            const walls = [
                { x: 0, z: -20, w: 40, h: 0.5 }, { x: 0, z: 20, w: 40, h: 0.5 },
                { x: -20, z: 0, w: 0.5, h: 40 }, { x: 20, z: 0, w: 0.5, h: 40 }
            ];
            walls.forEach(w => {
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, 1, w.h), wallMat);
                wallMesh.position.set(w.x, 0.5, w.z);
                scene.add(wallMesh);
            });

            // ИГРОК
            let skinUrl = currentUserData.skin || null;
            player = createPlayerModel(skinUrl, false);
            player.position.set(0, 0.1, 0);
            scene.add(player);

            // ОТПРАВКА ПОЗИЦИИ В FIREBASE
            if (currentServerId) {
                playerPosRef = ref(db, 'gameSessions/' + currentServerId + '/' + currentUid);
                // Отправляем 10 раз в секунду
                updateInterval = setInterval(async () => {
                    await set(playerPosRef, { 
                        x: player.position.x, z: player.position.z, 
                        nick: currentUserData.nick, 
                        skin: currentUserData.skin || '' 
                    });
                }, 100);

                // СЛУШАЕМ ДРУГИХ ИГРОКОВ
                const othersRef = ref(db, 'gameSessions/' + currentServerId);
                
                // При добавлении нового игрока
                onChildAdded(othersRef, (snap) => {
                    const uid = snap.key;
                    if (uid === currentUid) return;
                    const data = snap.val();
                    otherPlayersData[uid] = data;
                    const model = createPlayerModel(data.skin || null, true);
                    model.position.set(data.x || 0, 0.1, data.z || 0);
                    scene.add(model);
                    otherPlayers[uid] = model;
                });

                // При изменении позиции
                onChildChanged(othersRef, (snap) => {
                    const uid = snap.key;
                    if (uid === currentUid) return;
                    const data = snap.val();
                    otherPlayersData[uid] = data;
                    if (otherPlayers[uid]) {
                        otherPlayers[uid].position.x = data.x || 0;
                        otherPlayers[uid].position.z = data.z || 0;
                    }
                });

                // Когда игрок вышел
                onChildRemoved(othersRef, (snap) => {
                    const uid = snap.key;
                    if (uid === currentUid) return;
                    if (otherPlayers[uid]) {
                        scene.remove(otherPlayers[uid]);
                        delete otherPlayers[uid];
                        delete otherPlayersData[uid];
                    }
                });
            }

            // -------------------- УПРАВЛЕНИЕ --------------------
            window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = true; e.preventDefault(); } });
            window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = false; e.preventDefault(); } });
            window.addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'e') handleSteal(); });

            canvas.addEventListener('mousedown', (e) => { if (e.button === 2) { isDragging = true; previousMouseX = e.clientX; previousMouseY = e.clientY; } });
            window.addEventListener('mousemove', (e) => { if (isDragging) { const dx = e.clientX - previousMouseX; camTheta -= dx * 0.01; previousMouseX = e.clientX; previousMouseY = e.clientY; } });
            window.addEventListener('mouseup', (e) => { if (e.button === 2) isDragging = false; });
            canvas.addEventListener('wheel', (e) => { e.preventDefault(); camRadius += e.deltaY * 0.05; camRadius = Math.max(5, Math.min(30, camRadius)); });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            animate();
        }

        function handleSteal() {
            if (!player || !currentServerId) return;
            stealMsg.classList.add('show');
            setTimeout(() => stealMsg.classList.remove('show'), 500);
            // Здесь можно добавить логику кражи: найти ближайшего игрока в otherPlayersData, обновить мозг в Firebase
        }

        function animate() {
            if (!renderer || !player) return;
            const speed = 0.15;

            const forward = new THREE.Vector3(-Math.sin(camTheta), 0, -Math.cos(camTheta));
            const right = new THREE.Vector3(forward.z, 0, -forward.x);

            const moveX = (keys.w ? forward.x : 0) + (keys.s ? -forward.x : 0) + (keys.a ? -right.x : 0) + (keys.d ? right.x : 0);
            const moveZ = (keys.w ? forward.z : 0) + (keys.s ? -forward.z : 0) + (keys.a ? -right.z : 0) + (keys.d ? right.z : 0);
            const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
            if (len > 0) {
                player.position.x += (moveX / len) * speed;
                player.position.z += (moveZ / len) * speed;
                player.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Ограничение карты
            const limit = 19;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            // Обновляем камеру
            const heightOffset = 8;
            camera.position.x = player.position.x + camRadius * Math.sin(camTheta);
            camera.position.z = player.position.z + camRadius * Math.cos(camTheta);
            camera.position.y = player.position.y + heightOffset;
            camera.lookAt(player.position.x, player.position.y + 0.5, player.position.z);

            renderer.render(scene, camera);
            animationId = requestAnimationFrame(animate);
        }

        window.exitGame = function() { stopGame(); showMenu(); };

        // Resize
        window.addEventListener('resize', () => {
            if (renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        });

        // -------------------- Инициализация --------------------
        checkSession();
        console.log('🔥 ПОЛНАЯ мультиплеерная версия "Укради Брэйнрот" загружена!');
    </script>
</body>
</html>
