<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Steal A Dushka</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#1a1a1a;font-family:'Courier New',monospace;touch-action:none;user-select:none;-webkit-user-select:none}
#auth{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:#1a1a1a;z-index:999}
#auth-box{background:#000;border:4px solid #111;padding:30px;width:400px;display:flex;flex-direction:column;align-items:center}
.auth-label{color:#fff;font-size:14px;margin:10px 0 5px;width:100%;text-align:left}
.auth-input{width:100%;height:35px;background:#fff;border:none;color:#000;font-size:14px;padding:0 10px;margin-bottom:20px;outline:none}
.auth-btns{display:flex;gap:10px;width:100%}
.auth-btn{flex:1;height:40px;border:none;font-weight:bold;cursor:pointer;font-size:13px}
.btn-login{background:#fff;color:#000}.btn-reg{background:#fff;color:red}
.hint{color:#888;font-size:12px;margin-top:15px;text-align:center}
#app{display:none;flex-direction:row;width:100vw;height:100vh;justify-content:center;align-items:center}
#sidebar{width:140px;display:flex;justify-content:center;align-items:center;margin-right:12px}
#actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.action-btn{width:60px;height:60px;display:flex;justify-content:center;align-items:center;background:#666;border:4px solid #000;color:#fff;font-weight:bold;font-size:12px;cursor:pointer;transition:transform .1s,filter .1s}
.action-btn:active{transform:scale(.95);filter:brightness(.8)}
.action-btn.pink{background:#E54B8C}
#game-wrapper{flex:1;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
#game-container{width:400px;height:400px;background:#20b94d;border:4px solid black;position:relative;overflow:hidden;transform-origin:left center}
.center-line{position:absolute;top:180px;left:0;width:100%;height:40px;background:#e83e32;z-index:5}
.center-cap{position:absolute;top:-10px;width:16px;height:60px;background:black}.cap-left{left:0}.cap-right{right:0}
.base{position:absolute;width:75px;height:75px;background:#869292}.base .brown{position:absolute;width:calc(100% - 8px);left:4px;height:14px;background:#bf5b1a;bottom:4px}.base .green{position:absolute;width:34px;height:14px;background:#22e54c;left:50%;transform:translateX(-50%);bottom:-14px}.base .nickname{position:absolute;bottom:4px;left:0;width:100%;height:14px;line-height:14px;text-align:center;color:#fff;font-size:8px;font-weight:bold;text-shadow:1px 1px 1px #000;z-index:5;pointer-events:none}
.base-top-1{top:20px;left:20px}.base-top-2{top:20px;left:115px}.base-top-3{top:20px;left:210px}.base-top-4{top:20px;left:305px}.base-bottom-1{bottom:20px;left:20px}.base-bottom-2{bottom:20px;left:115px}.base-bottom-3{bottom:20px;left:210px}.base-bottom-4{bottom:20px;left:305px}.base-bottom .brown{top:4px;bottom:auto}.base-bottom .green{top:-14px;bottom:auto}.base-bottom .nickname{top:4px;bottom:auto}
#rng-machine,#shop-blue,#shop-red,#queen-bee,#rng-circle,#shop-white{position:absolute;width:20px;height:20px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);z-index:15}#queen-bee{height:24px;grid-template-rows:repeat(6,1fr)}#rng-machine{left:190px;top:137px}.c-cyan{background:#00F0FF}.c-gray{background:#808080}.c-empty{background:transparent}#shop-blue{left:150px;top:137px}.s-blue{background:#0000FF}.s-white{background:#FFFFFF}#shop-red{left:150px;top:230px}.r-red{background:#FF0000}.r-white{background:#FFFFFF}#queen-bee{left:230px;top:137px}.q-yellow{background:#FFD966}.q-red{background:#F44336}.q-brown{background:#8B4513}#rng-circle{left:190px;top:230px;background:#A454B4;border-radius:50%}#shop-white{left:230px;top:230px}.w-dark{background:#003366}.w-white{background:#FFFFFF}
#player{position:absolute;width:10px;height:20px;display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr;z-index:20}
#player .pixel{width:100%;height:100%}
#interact{position:absolute;display:none;z-index:1000;width:24px;height:24px;background:#777;border:1px solid #444;display:flex;justify-content:center;align-items:center;color:#fff;font-size:18px;cursor:pointer}
#balance{position:fixed;bottom:20px;right:20px;background:rgba(0,0,0,.8);padding:10px;border:2px solid #444;color:#fff;font-size:14px;display:none;flex-direction:column;gap:5px;border-radius:8px}
#balance .box{display:flex;justify-content:space-between;gap:10px}
#balance .icon{font-size:16px}#balance .label{color:#aaa}#balance .amount{color:#4caf50}
#custom-modal{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e2426;border:2px solid #0f1214;border-radius:12px;padding:20px;z-index:9999;max-width:400px;width:90%;box-shadow:0 0 30px rgba(0,0,0,.9);color:#fff;text-align:center}
#custom-modal .modal-title{font-size:18px;font-weight:bold;margin-bottom:10px;color:#4a90e2}
#custom-modal .modal-text{font-size:14px;margin-bottom:20px}
#custom-modal .modal-close{background:#c0392b;border:2px solid #922b21;color:#fff;padding:8px 20px;border-radius:4px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth">
  <div id="auth-box">
    <label class="auth-label">НИК</label>
    <input type="text" id="username" class="auth-input" autocomplete="off">
    <label class="auth-label">ПАРОЛЬ</label>
    <input type="password" id="password" class="auth-input">
    <div class="auth-btns">
      <button class="auth-btn btn-login" onclick="handleLogin()">ВОЙТИ</button>
      <button class="auth-btn btn-reg" onclick="handleRegister()">РЕГ</button>
    </div>
    <div class="hint">Нажми РЕГ, если входишь впервые</div>
  </div>
</div>

<!-- БАЛАНС -->
<div id="balance">
  <div class="box">
    <span class="icon">🪙</span>
    <span class="label">Монеты</span>
    <span class="amount" id="balance-amount">25</span>
  </div>
</div>

<!-- ИГРА -->
<div id="app">
  <div id="sidebar">
    <div id="actions">
      <div class="action-btn pink" onclick="openRedShop()">SHOP</div>
      <div class="action-btn" onclick="showModal('Ребирт','Скоро!')">REBIRTH</div>
      <div class="action-btn" onclick="showModal('Трейд','Скоро!')">TRADE</div>
      <div class="action-btn" onclick="showModal('Индекс','Твой индекс: 1')">INDEX</div>
    </div>
  </div>
  <div id="game-wrapper">
    <div id="game-container">
      <div class="center-line"><div class="center-cap cap-left"></div><div class="center-cap cap-right"></div></div>
      <div class="base base-top-1"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div class="base base-top-2"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div class="base base-top-3"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div class="base base-top-4"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div class="base base-bottom base-bottom-1"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div class="base base-bottom base-bottom-2"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div class="base base-bottom base-bottom-3"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div class="base base-bottom base-bottom-4"><div class="brown"></div><div class="green"></div><div class="nickname"></div></div>
      <div id="rng-machine"><div class="pixel c-cyan"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-cyan"></div><div class="pixel c-cyan"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-cyan"></div><div class="pixel c-cyan"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-empty"></div><div class="pixel c-cyan"></div><div class="pixel c-gray"></div><div class="pixel c-gray"></div><div class="pixel c-gray"></div><div class="pixel c-gray"></div><div class="pixel c-gray"></div></div>
      <div id="shop-blue"><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div><div class="pixel s-white"></div><div class="pixel s-blue"></div></div>
      <div id="shop-red"><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div><div class="pixel r-white"></div><div class="pixel r-red"></div></div>
      <div id="queen-bee"><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-red"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-red"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-red"></div><div class="pixel q-yellow"></div><div class="pixel q-yellow"></div><div class="pixel q-red"></div><div class="pixel q-red"></div><div class="pixel q-red"></div><div class="pixel q-red"></div><div class="pixel q-red"></div><div class="pixel q-yellow"></div><div class="pixel q-brown"></div><div class="pixel q-brown"></div><div class="pixel q-brown"></div><div class="pixel q-yellow"></div></div>
      <div id="rng-circle"></div>
      <div id="shop-white"><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-white"></div><div class="pixel w-white"></div><div class="pixel w-white"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-white"></div><div class="pixel w-white"></div><div class="pixel w-white"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-white"></div><div class="pixel w-white"></div><div class="pixel w-white"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div><div class="pixel w-dark"></div></div>
      <div id="interact" onclick="interact()">E</div>
      <div id="player"></div>
    </div>
  </div>
</div>

<!-- МОДАЛКА -->
<div id="custom-modal">
  <div class="modal-title" id="modal-title"></div>
  <div class="modal-text" id="modal-text"></div>
  <button class="modal-close" onclick="closeModal()">Закрыть</button>
</div>

<script>
// ========== МОДАЛКА ==========
function showModal(title, text) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  document.getElementById('custom-modal').style.display = 'block';
}
function closeModal() { document.getElementById('custom-modal').style.display = 'none'; }

// ========== ПЕРЕМЕННЫЕ ==========
let x = 52, y = 81;
let coins = 25;
const keys = { w: false, s: false, a: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };

// ========== ЛОГИКА ВХОДА (без Firebase, просто заглушка) ==========
function handleRegister() {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('balance').style.display = 'flex';
  document.getElementById('balance-amount').textContent = coins;
  initPlayer();
  update();
}

function handleLogin() {
  handleRegister(); // просто переходим в игру
}

// ========== ИНИЦИАЛИЗАЦИЯ ИГРОКА ==========
function initPlayer() {
  let pl = document.getElementById('player');
  pl.innerHTML = '<div class="pixel"></div><div class="pixel"></div>';
  let px = pl.querySelectorAll('.pixel');
  px[0].style.background = '#FFCC00';
  px[1].style.background = '#00DFF5';
  pl.style.left = x + 'px';
  pl.style.top = y + 'px';
}

// ========== УПРАВЛЕНИЕ (WASD + СТРЕЛКИ) ==========
document.addEventListener('keydown', function(e) {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || k === 'arrowup') { keys.w = true; keys.arrowup = true; e.preventDefault(); }
  if (k === 's' || k === 'ы' || k === 'arrowdown') { keys.s = true; keys.arrowdown = true; e.preventDefault(); }
  if (k === 'a' || k === 'ф' || k === 'arrowleft') { keys.a = true; keys.arrowleft = true; e.preventDefault(); }
  if (k === 'd' || k === 'в' || k === 'arrowright') { keys.d = true; keys.arrowright = true; e.preventDefault(); }
  if (k === 'e' || k === 'у') { interact(); e.preventDefault(); }
});
document.addEventListener('keyup', function(e) {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 'ц' || k === 'arrowup') { keys.w = false; keys.arrowup = false; e.preventDefault(); }
  if (k === 's' || k === 'ы' || k === 'arrowdown') { keys.s = false; keys.arrowdown = false; e.preventDefault(); }
  if (k === 'a' || k === 'ф' || k === 'arrowleft') { keys.a = false; keys.arrowleft = false; e.preventDefault(); }
  if (k === 'd' || k === 'в' || k === 'arrowright') { keys.d = false; keys.arrowright = false; e.preventDefault(); }
});

// ========== ДВИЖЕНИЕ ==========
const SPEED = 1;
const MAX_X = 380, MAX_Y = 380;
const obstacles = [
  { x: 0, y: 170, w: 16, h: 60 },
  { x: 384, y: 170, w: 16, h: 60 },
  { x: 150, y: 137, w: 20, h: 20 },
  { x: 190, y: 137, w: 20, h: 20 },
  { x: 230, y: 137, w: 20, h: 24 },
  { x: 150, y: 230, w: 20, h: 20 },
  { x: 190, y: 230, w: 20, h: 20 },
  { x: 230, y: 230, w: 20, h: 20 }
];

function collide(r1, r2) {
  return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}

let lastTime = 0;
function update(time = 0) {
  requestAnimationFrame(update);
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;
  let dx = 0, dy = 0;

  if (keys.w || keys.arrowup) dy -= 1;
  if (keys.s || keys.arrowdown) dy += 1;
  if (keys.a || keys.arrowleft) dx -= 1;
  if (keys.d || keys.arrowright) dx += 1;

  if (dx !== 0 || dy !== 0) {
    const len = Math.sqrt(dx * dx + dy * dy);
    let nx = x + (dx / len) * SPEED * dt * 60;
    let ny = y + (dy / len) * SPEED * dt * 60;

    let rX = { x: nx, y: y, w: 10, h: 20 };
    let bX = false;
    for (let o of obstacles) if (collide(rX, o)) { bX = true; break; }
    if (!bX) x = nx;

    let rY = { x: x, y: ny, w: 10, h: 20 };
    let bY = false;
    for (let o of obstacles) if (collide(rY, o)) { bY = true; break; }
    if (!bY) y = ny;

    x = Math.max(10, Math.min(MAX_X, x));
    y = Math.max(10, Math.min(MAX_Y, y));
    document.getElementById('player').style.left = x + 'px';
    document.getElementById('player').style.top = y + 'px';
  }

  // ========== КНОПКА E (расстояние между центрами) ==========
  const interactables = [
    { id: 'rng-machine', x: 190, y: 137 },
    { id: 'shop-blue', x: 150, y: 137 },
    { id: 'queen-bee', x: 230, y: 137 },
    { id: 'shop-red', x: 150, y: 230 },
    { id: 'rng-circle', x: 190, y: 230 },
    { id: 'shop-white', x: 230, y: 230 }
  ];

  let found = false;
  let playerCenter = { x: x + 5, y: y + 10 };
  for (let obj of interactables) {
    let objCenter = { x: obj.x + 10, y: obj.y + 10 };
    let dist = Math.sqrt(Math.pow(playerCenter.x - objCenter.x, 2) + Math.pow(playerCenter.y - objCenter.y, 2));
    if (dist < 20) {
      let btn = document.getElementById('interact');
      btn.style.display = 'flex';
      btn.style.left = (x - 7) + 'px';
      btn.style.top = (y - 25) + 'px';
      btn.dataset.obj = obj.id;
      found = true;
      break;
    }
  }
  if (!found) document.getElementById('interact').style.display = 'none';
}

// ========== ВЗАИМОДЕЙСТВИЕ ==========
function interact() {
  let btn = document.getElementById('interact');
  if (btn.style.display === 'none') return;
  let obj = btn.dataset.obj;

  if (obj === 'shop-red') showModal('Premium Shop', 'Здесь будут товары за Dushka Coins (заглушка)');
  else if (obj === 'shop-blue') showModal('Магазин', 'Здесь будут товары за монеты (заглушка)');
  else if (obj === 'shop-white') showModal('Trade Plaza', 'Ты хочешь вступить в Trade Plaza? (заглушка)');
  else if (obj === 'queen-bee') showModal('Пчелы', 'Здесь будут пчелы (заглушка)');
  else if (obj === 'rng-circle') showModal('Колесо', 'Здесь будет колесо фортуны (заглушка)');
  else if (obj === 'rng-machine') showModal('RNG', 'Здесь будет RNG машина (заглушка)');
  else showModal('Взаимодействие', 'Объект: ' + obj);
}

// ========== КНОПКИ МЕНЮ ==========
function openRedShop() { showModal('Premium Shop', 'Здесь будут товары за Dushka Coins (заглушка)'); }
</script>
</body>
</html>
