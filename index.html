<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Укради Брэйнрот - Тест 3D с серверами</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; overflow: hidden; }
        #app { width: 100%; height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #1a1f2b; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 520px; margin: 20px auto; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 15px; background: #252d3d; border: none; border-radius: 12px; color: #fff; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-primary { background: #4a7cf7; }
        .btn-primary:hover { background: #3a6be0; }
        .btn-secondary { background: #3a3f4e; }
        .btn-secondary:hover { background: #4a5060; }
        .menu-btn { display: block; width: 100%; padding: 20px; margin-bottom: 12px; background: #252d3d; text-align: center; font-size: 20px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { background: #2f3a50; }
        .profile-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #333; object-fit: cover; border: 3px solid #4a7cf7; }
        .nick { font-size: 24px; font-weight: bold; }
        .stat { color: #aaa; font-size: 14px; }
        .section-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .back-btn { background: #3a3f4e; margin-bottom: 20px; }
        .back-btn:hover { background: #4a5060; }
        .server-item { background: #252d3d; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .server-item .join-btn { width: auto; padding: 8px 25px; background: #4a7cf7; border-radius: 30px; font-size: 14px; }
        .badge-vip { background: #f7c948; color: #000; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: bold; }
        .badge-public { background: #4a7cf7; color: #fff; padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e14; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .progress-bar { width: 80%; height: 10px; background: #252d3d; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .progress-fill { height: 100%; width: 0%; background: #4a7cf7; transition: width 0.1s; }
        .progress-text { font-size: 20px; margin-top: 10px; }
        #gameContainer { position: relative; width: 100%; height: 100vh; }
        #gameUI { position: absolute; top: 20px; right: 20px; z-index: 10; }
        .exit-btn { background: #ff6b6b; padding: 10px 20px; border-radius: 10px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        .exit-btn:hover { background: #e55a5a; }
        #serverList { max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Авторизация -->
        <div id="authSection" class="card" style="margin-top: 50px;">
            <h2 style="margin-bottom:20px; text-align:center;">Вход / Регистрация</h2>
            <input type="text" id="authNick" placeholder="Ваш никнейм">
            <input type="password" id="authPass" placeholder="Пароль">
            <button id="registerBtn" class="btn-primary">Создать аккаунт</button>
            <button id="loginBtn" class="btn-secondary">Войти</button>
            <div id="authMsg" style="margin-top:15px; text-align:center; color:#ff6b6b; font-weight:bold;"></div>
        </div>

        <!-- Меню -->
        <div id="menuSection" class="hidden" style="max-width: 520px; margin: 50px auto;">
            <div class="profile-row">
                <img id="menuAvatar" class="avatar" src="https://ui-avatars.com/api/?name=Guest&background=random&color=fff&size=80" alt="avatar">
                <div>
                    <div class="nick" id="menuNick">Гость</div>
                    <div class="stat">ID: <span id="menuId">-</span></div>
                </div>
            </div>
            <div class="menu-btn" onclick="openProfile()">👤 Профиль</div>
            <div class="menu-btn" onclick="quickPlay()">▶️ Играть (быстрый старт)</div>
            <div class="menu-btn" onclick="openServers()">🖥️ Серверы</div>
            <div style="margin-top:20px; text-align:center; color:#666; font-size:14px; cursor:pointer;" onclick="logout()">Выйти</div>
        </div>

        <!-- Профиль -->
        <div id="profileSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Профиль</div>
            <div class="profile-row">
                <img id="profileAvatar" class="avatar" src="https://ui-avatars.com/api/?name=Guest&background=random&color=fff&size=80" alt="avatar">
                <div>
                    <div class="nick" id="profileNick">Гость</div>
                    <div class="stat">ID: <span id="profileId">-</span></div>
                </div>
            </div>
            <label style="display:block; margin-bottom:5px;">Сменить аватарку (PNG/JPG)</label>
            <input type="file" id="avatarInput" accept="image/*">
            <label style="display:block; margin:15px 0 5px;">Сменить скин (для 3D-модели)</label>
            <input type="file" id="skinInput" accept="image/*">
            <label style="display:block; margin:15px 0 5px;">Сменить пароль</label>
            <input type="password" id="newPass" placeholder="Новый пароль">
            <button onclick="changePassword()" class="btn-primary">Сохранить пароль</button>
        </div>

        <!-- Серверы -->
        <div id="serversSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Серверы</div>
            <div id="serverList"></div>
        </div>

        <!-- Загрузка -->
        <div id="loadingOverlay" class="hidden">
            <div style="font-size:30px;">⏳ Загрузка...</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- 3D Сцена -->
        <div id="gameContainer" class="hidden">
            <div id="gameUI">
                <button class="exit-btn" onclick="exitGame()">✕ Выйти</button>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <!-- Firebase SDK + Three.js -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js",
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        // ------------------------------------------------------------
        // ПОЛНЫЙ КОД: Авторизация, профиль, серверы (реальный онлайн), 3D с анимацией
        // ------------------------------------------------------------
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, set, get, update, remove, push, onValue, onChildAdded, onChildRemoved } from 'firebase/database';
        import * as THREE from 'three';

        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM
        const authSection = document.getElementById('authSection');
        const menuSection = document.getElementById('menuSection');
        const profileSection = document.getElementById('profileSection');
        const serversSection = document.getElementById('serversSection');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const gameContainer = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const serverList = document.getElementById('serverList');

        const authNick = document.getElementById('authNick');
        const authPass = document.getElementById('authPass');
        const registerBtn = document.getElementById('registerBtn');
        const loginBtn = document.getElementById('loginBtn');
        const authMsg = document.getElementById('authMsg');

        const menuNick = document.getElementById('menuNick');
        const menuId = document.getElementById('menuId');
        const menuAvatar = document.getElementById('menuAvatar');
        const profileNick = document.getElementById('profileNick');
        const profileId = document.getElementById('profileId');
        const profileAvatar = document.getElementById('profileAvatar');
        const newPass = document.getElementById('newPass');
        const avatarInput = document.getElementById('avatarInput');
        const skinInput = document.getElementById('skinInput');

        let currentNick = null;
        let currentUid = null;
        let currentUserData = null;
        let currentServerId = null; // сервер, на котором находится игрок

        // -------------------- 3D Переменные --------------------
        let scene, camera, renderer, player;
        let keys = { w: false, a: false, s: false, d: false };
        let animationId = null;
        let playerDirection = new THREE.Vector3(0, 0, -1);
        let isMoving = false;

        // -------------------- Утилиты --------------------
        function showLoading(callback) {
            loadingOverlay.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                        if (callback) callback();
                    }, 500);
                }
            }, 100);
        }

        async function loginUser(nick, pass) {
            const userRef = ref(db, 'users/' + nick);
            const snap = await get(userRef);
            if (!snap.exists()) {
                authMsg.textContent = '❌ Пользователь не найден!';
                return false;
            }
            const data = snap.val();
            if (data.password !== pass) {
                authMsg.textContent = '❌ Неверный пароль!';
                return false;
            }
            currentNick = nick;
            currentUid = nick;
            currentUserData = data;
            localStorage.setItem('stealSession', JSON.stringify({ nick, password: pass }));
            return true;
        }

        // -------------------- Регистрация --------------------
        registerBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim();
            const pass = authPass.value.trim();
            if (!nick || !pass) {
                authMsg.textContent = 'Заполни все поля!';
                return;
            }
            const userRef = ref(db, 'users/' + nick);
            const snap = await get(userRef);
            if (snap.exists()) {
                authMsg.textContent = '❌ Этот ник уже занят!';
                return;
            }
            await set(userRef, {
                nick: nick,
                password: pass,
                avatar: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(nick) + '&background=random&color=fff&size=80',
                skin: '',
                friends: {},
                friendRequests: {}
            });
            // Админ Dushka
            const adminRef = ref(db, 'admins/Dushka');
            const adminSnap = await get(adminRef);
            if (!adminSnap.exists()) {
                await set(adminRef, {
                    nick: 'Dushka',
                    password: '16052014may'
                });
            }
            authMsg.textContent = '✅ Аккаунт создан! Теперь войди.';
            authMsg.style.color = '#4a7cf7';
        });

        // -------------------- Вход --------------------
        loginBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim();
            const pass = authPass.value.trim();
            if (!nick || !pass) {
                authMsg.textContent = 'Заполни все поля!';
                return;
            }
            const success = await loginUser(nick, pass);
            if (success) {
                authMsg.textContent = '';
                showMenu();
            }
        });

        // Проверка сессии
        async function checkSession() {
            const session = localStorage.getItem('stealSession');
            if (session) {
                const { nick, password } = JSON.parse(session);
                const success = await loginUser(nick, password);
                if (success) {
                    showMenu();
                    return;
                } else {
                    localStorage.removeItem('stealSession');
                }
            }
            authSection.classList.remove('hidden');
        }

        // -------------------- Навигация --------------------
        function showMenu() {
            authSection.classList.add('hidden');
            menuSection.classList.remove('hidden');
            profileSection.classList.add('hidden');
            serversSection.classList.add('hidden');
            gameContainer.classList.add('hidden');
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
                if (renderer) { renderer.dispose(); renderer = null; }
            }

            menuNick.textContent = currentUserData.nick;
            menuId.textContent = currentUid.slice(0, 6);
            menuAvatar.src = currentUserData.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUserData.nick) + '&background=random&color=fff&size=80';
            profileNick.textContent = currentUserData.nick;
            profileId.textContent = currentUid.slice(0, 6);
            profileAvatar.src = currentUserData.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUserData.nick) + '&background=random&color=fff&size=80';

            // Если был на сервере, выходим
            if (currentServerId) {
                leaveServer(currentServerId);
                currentServerId = null;
            }
        }

        window.openProfile = function() {
            menuSection.classList.add('hidden');
            profileSection.classList.remove('hidden');
        };
        window.openServers = function() {
            menuSection.classList.add('hidden');
            serversSection.classList.remove('hidden');
            loadServers();
        };
        window.openMenu = function() {
            profileSection.classList.add('hidden');
            serversSection.classList.add('hidden');
            menuSection.classList.remove('hidden');
        };
        window.logout = function() {
            localStorage.removeItem('stealSession');
            currentNick = null;
            currentUid = null;
            currentUserData = null;
            if (currentServerId) {
                leaveServer(currentServerId);
                currentServerId = null;
            }
            menuSection.classList.add('hidden');
            profileSection.classList.add('hidden');
            serversSection.classList.add('hidden');
            authSection.classList.remove('hidden');
            authMsg.textContent = '';
            authNick.value = '';
            authPass.value = '';
        };

        // -------------------- Профиль --------------------
        window.changePassword = async function() {
            const newP = newPass.value.trim();
            if (!newP) return alert('Введи новый пароль');
            const userRef = ref(db, 'users/' + currentUid + '/password');
            await update(userRef, { password: newP });
            currentUserData.password = newP;
            alert('Пароль обновлён!');
            newPass.value = '';
        };

        avatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const dataUrl = ev.target.result;
                const userRef = ref(db, 'users/' + currentUid + '/avatar');
                await update(userRef, { avatar: dataUrl });
                menuAvatar.src = dataUrl;
                profileAvatar.src = dataUrl;
                alert('Аватарка обновлена!');
            };
            reader.readAsDataURL(file);
        });

        skinInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const dataUrl = ev.target.result;
                const userRef = ref(db, 'users/' + currentUid + '/skin');
                await update(userRef, { skin: dataUrl });
                currentUserData.skin = dataUrl;
                alert('Скин сохранён! Применится при следующем запуске игры.');
            };
            reader.readAsDataURL(file);
        });

        // -------------------- Серверы (реальный онлайн) --------------------
        // Узел в Firebase: publicServers/{serverId}: { players: число, max: 8 }
        // VIP серверы: vipServers/{serverId}: { name, owner, players, max, access }

        // Создать новый публичный сервер
        async function createPublicServer() {
            const refServers = ref(db, 'publicServers');
            const newRef = push(refServers);
            await set(newRef, {
                players: 0,
                max: 8,
                createdAt: Date.now()
            });
            return newRef.key;
        }

        // Получить первый свободный публичный сервер (с players < max)
        async function getAvailablePublicServer() {
            const refServers = ref(db, 'publicServers');
            const snap = await get(refServers);
            if (!snap.exists()) {
                // создаём первый
                return await createPublicServer();
            }
            let available = null;
            snap.forEach((child) => {
                const data = child.val();
                if (data.players < data.max && !available) {
                    available = child.key;
                }
            });
            if (!available) {
                // все заняты — создаём новый
                available = await createPublicServer();
            }
            return available;
        }

        // Присоединиться к серверу (увеличить счётчик)
        async function joinServer(serverId, isVip = false) {
            if (!currentUid) return alert('Сначала войди');
            if (currentServerId) {
                await leaveServer(currentServerId);
            }
            const path = isVip ? 'vipServers/' + serverId : 'publicServers/' + serverId;
            const serverRef = ref(db, path);
            const snap = await get(serverRef);
            if (!snap.exists()) {
                alert('Сервер не найден');
                return;
            }
            const data = snap.val();
            if (data.players >= data.max) {
                alert('Сервер заполнен!');
                return;
            }
            // Увеличиваем счётчик
            await update(serverRef, { players: data.players + 1 });
            // Запоминаем, что мы на сервере
            currentServerId = serverId;
            // Запускаем 3D
            showLoading(() => {
                init3D();
            });
        }

        // Покинуть сервер (уменьшить счётчик)
        async function leaveServer(serverId) {
            if (!serverId) return;
            const path = 'publicServers/' + serverId;
            const serverRef = ref(db, path);
            const snap = await get(serverRef);
            if (snap.exists()) {
                const data = snap.val();
                const newCount = Math.max(0, data.players - 1);
                await update(serverRef, { players: newCount });
                // Если сервер стал пустым, можно удалить (но оставим для истории)
            }
            currentServerId = null;
        }

        // Быстрая игра
        window.quickPlay = async function() {
            if (!currentUid) return alert('Сначала войди');
            const serverId = await getAvailablePublicServer();
            await joinServer(serverId, false);
        };

        // Загрузить список серверов и отобразить
        function loadServers() {
            // Слушаем публичные серверы
            const publicRef = ref(db, 'publicServers');
            onValue(publicRef, async (snap) => {
                const vipRef = ref(db, 'vipServers');
                const vipSnap = await get(vipRef);
                let vipServers = [];
                if (vipSnap.exists()) {
                    vipSnap.forEach((child) => {
                        vipServers.push({
                            id: child.key,
                            ...child.val(),
                            type: 'vip'
                        });
                    });
                }
                let publicServers = [];
                if (snap.exists()) {
                    snap.forEach((child) => {
                        publicServers.push({
                            id: child.key,
                            ...child.val(),
                            type: 'public',
                            name: 'Публичный #' + child.key.slice(0, 4)
                        });
                    });
                }
                // Объединяем: VIP сначала
                const all = [...vipServers, ...publicServers];
                serverList.innerHTML = '';
                if (all.length === 0) {
                    serverList.innerHTML = '<div style="color:#666;">Нет серверов</div>';
                    return;
                }
                all.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'server-item';
                    const isVip = s.type === 'vip';
                    div.innerHTML = `
                        <div>
                            <strong>${s.name || 'Сервер'}</strong>
                            <span class="${isVip ? 'badge-vip' : 'badge-public'}">${isVip ? 'VIP' : 'Публичный'}</span>
                            <div style="font-size:13px; color:#aaa;">${s.players || 0}/${s.max || 8} игроков</div>
                            ${isVip ? `<div style="font-size:12px; color:#f7c948;">Владелец: ${s.owner || 'Неизвестный'}</div>` : ''}
                        </div>
                        <button class="join-btn" onclick="joinServerUI('${s.id}', ${isVip})">Join</button>
                    `;
                    serverList.appendChild(div);
                });
            });
        }

        // Обёртка для кнопки Join (вызывается из HTML)
        window.joinServerUI = async function(serverId, isVip) {
            if (!currentUid) return alert('Сначала войди');
            await joinServer(serverId, isVip);
        };

        // -------------------- 3D Игра с анимацией --------------------
        function init3D() {
            gameContainer.classList.remove('hidden');
            menuSection.classList.add('hidden');
            profileSection.classList.add('hidden');
            serversSection.classList.add('hidden');

            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            // Камера
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 15, 15);
            camera.lookAt(0, 0, 0);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Свет
            const ambient = new THREE.AmbientLight(0x404060);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Пол
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, side: THREE.DoubleSide });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Сетка
            const gridHelper = new THREE.GridHelper(50, 20, 0x888888, 0x444444);
            scene.add(gridHelper);

            // Создаём игрока (куб со скином)
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            let material;
            if (currentUserData.skin) {
                const texture = new THREE.TextureLoader().load(currentUserData.skin);
                material = new THREE.MeshStandardMaterial({ map: texture });
            } else {
                material = new THREE.MeshStandardMaterial({ color: 0x4a7cf7 });
            }
            player = new THREE.Mesh(geometry, material);
            player.position.set(0, 0.5, 0);
            player.castShadow = true;
            scene.add(player);

            // Управление
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                    keys[key] = true;
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                    keys[key] = false;
                    e.preventDefault();
                }
            });

            // Анимация
            animate();
        }

        function animate() {
            if (!renderer || !player) return;
            const speed = 0.1;
            let dx = 0, dz = 0;
            if (keys.w) dz -= speed;
            if (keys.s) dz += speed;
            if (keys.a) dx -= speed;
            if (keys.d) dx += speed;

            const moving = (dx !== 0 || dz !== 0);
            if (moving) {
                // Поворачиваем куб в направлении движения
                const angle = Math.atan2(dx, dz);
                player.rotation.y = angle;
                // Анимация "ходьбы" - небольшое покачивание по оси Y
                const time = Date.now() * 0.01;
                player.position.y = 0.5 + Math.sin(time) * 0.05;
                // Слегка наклоняем вперёд
                player.rotation.x = Math.sin(time) * 0.1;
            } else {
                // Возвращаем в нейтральное положение
                player.position.y = 0.5;
                player.rotation.x = 0;
            }

            player.position.x += dx;
            player.position.z += dz;

            // Камера следит
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 15;
            camera.lookAt(player.position.x, 0, player.position.z);

            renderer.render(scene, camera);
            animationId = requestAnimationFrame(animate);
        }

        window.exitGame = function() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            if (renderer) {
                renderer.dispose();
                renderer = null;
            }
            gameContainer.classList.add('hidden');
            // Покидаем сервер
            if (currentServerId) {
                leaveServer(currentServerId);
                currentServerId = null;
            }
            window.removeEventListener('keydown', () => {});
            window.removeEventListener('keyup', () => {});
            showMenu();
        };

        // Resize
        window.addEventListener('resize', () => {
            if (renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // -------------------- Инициализация --------------------
        checkSession();
        console.log('🔥 Тест 3D с серверами и анимацией загружен!');
    </script>
</body>
</html>
