<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal Dushka</title>
    <!-- Пиксельный шрифт для логотипа -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Исправляем ошибку 404 с иконкой -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; overflow: hidden; user-select: none; }
        #app { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .hidden { display: none !important; }

        /* --- ЗАСТАВКА (ПИКСЕЛЬНЫЙ КВАДРАТ) --- */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0e14;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer;
        }
        .logo-box {
            background: #000000;
            border: 4px solid #ffffff;
            padding: 30px 25px;
            display: flex; flex-direction: column; align-items: center;
        }
        .logo-text {
            font-family: 'Press Start 2P', monospace;
            font-size: 28px;
            color: #00ffff;
            line-height: 1.6;
            text-shadow: 2px 2px 0 #0088ff;
        }
        .click-hint {
            color: #4a7cf7;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            margin-top: 30px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        /* --- ОКНО ВХОДА --- */
        #authContainer {
            background: #000000; padding: 30px 20px 20px 20px;
            border: 4px solid #ffffff; width: 320px;
            display: flex; flex-direction: column; gap: 10px; align-items: center;
        }
        .pixel-label { font-family: 'Press Start 2P', monospace; font-size: 16px; color: #fff; width: 100%; text-align: left; margin-top: 10px; }
        #authContainer input {
            width: 100%; background: #ffffff; border: none; padding: 8px 12px;
            font-size: 18px; font-family: monospace; color: #000; outline: none;
        }
        .auth-buttons { display: flex; justify-content: space-between; width: 100%; gap: 10px; margin-top: 20px; }
        .auth-buttons button {
            flex: 1; background: #ffffff; border: none; padding: 12px 0;
            font-family: 'Press Start 2P', monospace; font-size: 14px; cursor: pointer; transition: 0.2s;
        }
        .auth-buttons button:hover { background: #dddddd; }
        #loginBtn { color: #000000; }
        #registerBtn { color: #ff0000; }

        /* --- МЕНЮ --- */
        #menuSection { max-width: 400px; width: 90%; text-align: center; }
        #menuSection h2 { margin-bottom: 20px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 8px; }
        .btn-primary { background: #4a7cf7; }
        .btn-primary:hover { background: #3a6be0; }
        .btn-secondary { background: #3a3f4e; }
        .btn-secondary:hover { background: #4a5060; }

        /* --- ИГРА --- */
        #gameContainer { position: relative; width: 100vw; height: 100vh; background: #1a1f2b; }
        canvas { display: block; width: 100%; height: 100%; background: #2a2f3a; }
        #uiOverlay { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        #uiOverlay .money { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 20px; font-weight: bold; color: #f7c948; border: 1px solid #f7c948; }
        #uiOverlay .exit-btn { background: #ff4444; padding: 8px 20px; border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; }
        #shopModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .shop-window { background: #1a1f2b; padding: 20px; border-radius: 20px; max-width: 500px; width: 90%; border: 2px solid #4a7cf7; max-height: 80vh; overflow-y: auto; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #252d3d; border-radius: 10px; margin-bottom: 10px; }
        .shop-item button { width: auto; padding: 5px 15px; margin: 0; }
        .close-shop { background: #ff4444; padding: 10px; border: none; border-radius: 10px; color: #fff; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <!-- ================= ЗАСТАВКА ================= -->
        <div id="splashScreen" onclick="closeSplash()">
            <div class="logo-box">
                <div class="logo-text">STEAL</div>
                <div class="logo-text">DUSHKA</div>
            </div>
            <div class="click-hint">НАЖМИТЕ В ЛЮБОЕ МЕСТО</div>
        </div>

        <!-- ================= ОКНО ВХОДА ================= -->
        <div id="authContainer" class="hidden">
            <div class="pixel-label">НИК</div>
            <input type="text" id="authNick" placeholder="" value="Dushka">
            
            <div class="pixel-label">ПАРОЛЬ</div>
            <input type="password" id="authPass" placeholder="" value="16052014may">
            
            <div class="auth-buttons">
                <button id="loginBtn">ВОЙТИ</button>
                <button id="registerBtn">РЕГ</button>
            </div>
            <div id="authMsg" style="margin-top:10px; color:#ff6b6b; font-size:14px; font-family:monospace; text-align:center;"></div>
        </div>

        <!-- ================= МЕНЮ ================= -->
        <div id="menuSection" class="hidden">
            <h2>Привет, <span id="menuNick">Гость</span></h2>
            <p style="color:#aaa; margin-bottom:20px;">Баланс: <span id="menuMoney">0</span> монет</p>
            <button class="btn-primary" onclick="startGame()">▶️ Играть</button>
            <button class="btn-secondary" onclick="openShop()">🛒 Магазин</button>
            <button class="btn-secondary" onclick="logout()" style="margin-top:20px; background:#555;">Выйти</button>
        </div>

        <!-- ================= ИГРА ================= -->
        <div id="gameContainer" class="hidden">
            <canvas id="gameCanvas"></canvas>
            <div id="uiOverlay">
                <div class="money">💰 <span id="gameMoney">0</span></div>
                <button class="exit-btn" onclick="exitGame()">✕ Выйти</button>
            </div>
        </div>

        <!-- ================= МАГАЗИН ================= -->
        <div id="shopModal" class="hidden">
            <div class="shop-window">
                <h2 style="text-align:center; color:#4a7cf7; margin-bottom:15px;">🛒 Магазин</h2>
                <div id="shopList"></div>
                <button class="close-shop" onclick="closeShop()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- ================= FIREBASE SDK ================= -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, set, get, update, remove, onValue, onChildAdded, onChildChanged, onChildRemoved } from 'firebase/database';

        // Твой ключ
        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM
        const splashScreen = document.getElementById('splashScreen');
        const authContainer = document.getElementById('authContainer');
        const authNick = document.getElementById('authNick');
        const authPass = document.getElementById('authPass');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const authMsg = document.getElementById('authMsg');
        const menuSection = document.getElementById('menuSection');
        const menuNick = document.getElementById('menuNick');
        const menuMoney = document.getElementById('menuMoney');
        const gameContainer = document.getElementById('gameContainer');
        const gameCanvas = document.getElementById('gameCanvas');
        const ctx = gameCanvas.getContext('2d');
        const gameMoney = document.getElementById('gameMoney');
        const shopModal = document.getElementById('shopModal');
        const shopList = document.getElementById('shopList');

        let currentUid = null;
        let currentNick = null;
        let currentColor = '#000000'; // Чёрный персонаж
        let money = 25;

        // Игровые переменные
        const tileSize = 20;
        const baseWidth = 4 * tileSize;   // 80px
        const baseHeight = 4 * tileSize;  // 80px
        const panelHeight = 26; // 1/3 базы
        
        // Координаты спавна (первая верхняя зелёная зона слева)
        const spawnX = -14 * tileSize;
        const spawnY = -8 * tileSize + baseHeight + panelHeight / 2;

        let player = { x: spawnX, y: spawnY, color: currentColor };
        let keys = { w: false, a: false, s: false, d: false };
        let animationId = null;
        let updateInterval = null;
        let otherPlayers = {}; 
        let myPosRef = null;
        let lastTimestamp = 0;

        // Товары в магазине
        const shopItems = [
            { id: 'red', name: 'Красный', color: '#ff4444', price: 50 },
            { id: 'green', name: 'Зелёный', color: '#44ff44', price: 100 },
            { id: 'gold', name: 'Золотой', color: '#f7c948', price: 250 },
            { id: 'pink', name: 'Розовый', color: '#ff44ff', price: 500 },
        ];

        // ================= ЗАСТАВКА =================
        window.closeSplash = function() {
            splashScreen.classList.add('hidden');
            authContainer.classList.remove('hidden');
        };

        // ================= АВТОРИЗАЦИЯ =================
        async function loginUser(nick, pass) {
            const userRef = ref(db, 'users/' + nick);
            const snap = await get(userRef);
            if (!snap.exists()) { authMsg.textContent = '❌ Пользователь не найден!'; return false; }
            const data = snap.val();
            if (data.password !== pass) { authMsg.textContent = '❌ Неверный пароль!'; return false; }
            currentUid = nick; currentNick = nick;
            currentColor = data.color || '#000000';
            money = data.money || 25;
            localStorage.setItem('2d_session', JSON.stringify({ nick, password: pass }));
            return true;
        }

        registerBtn.addEventListener('click', async () => {
            const n = authNick.value.trim(); const p = authPass.value.trim();
            if (!n || !p) { authMsg.textContent = 'Заполни поля!'; return; }
            if ((await get(ref(db, 'users/' + n))).exists()) { authMsg.textContent = '❌ Ник занят!'; return; }
            await set(ref(db, 'users/' + n), { password: p, money: 25, color: '#000000' });
            if (!(await get(ref(db, 'admins/Dushka'))).exists()) {
                await set(ref(db, 'admins/Dushka'), { nick: 'Dushka', password: '16052014may' });
            }
            authMsg.textContent = '✅ Аккаунт создан! Войди.'; authMsg.style.color = '#4a7cf7';
        });

        loginBtn.addEventListener('click', async () => {
            const n = authNick.value.trim(); const p = authPass.value.trim();
            if (!n || !p) { authMsg.textContent = 'Заполни поля!'; return; }
            if (await loginUser(n, p)) { authMsg.textContent = ''; showMenu(); }
        });

        async function checkSession() {
            const session = localStorage.getItem('2d_session');
            if (session) {
                const { nick, password } = JSON.parse(session);
                if (await loginUser(nick, password)) { showMenu(); return; }
                localStorage.removeItem('2d_session');
            }
        }

        function showMenu() {
            authContainer.classList.add('hidden');
            menuSection.classList.remove('hidden');
            gameContainer.classList.add('hidden');
            shopModal.classList.add('hidden');
            stopGame();
            menuNick.textContent = currentNick;
            menuMoney.textContent = money;
        }

        window.logout = function() {
            localStorage.removeItem('2d_session'); currentUid = null;
            menuSection.classList.add('hidden'); authContainer.classList.remove('hidden');
            authMsg.textContent = ''; authNick.value = ''; authPass.value = '';
            stopGame();
        };

        // ================= МАГАЗИН =================
        window.openShop = function() { shopModal.classList.remove('hidden'); renderShop(); };
        window.closeShop = function() { shopModal.classList.add('hidden'); };

        function renderShop() {
            shopList.innerHTML = '';
            shopItems.forEach(item => {
                const div = document.createElement('div'); div.className = 'shop-item';
                div.innerHTML = `
                    <span>🎨 ${item.name}</span>
                    <div>
                        <span style="color:#aaa; margin-right:10px;">${item.price}💰</span>
                        <button onclick="buyColor('${item.id}')" class="btn-primary">Купить</button>
                    </div>
                `;
                shopList.appendChild(div);
            });
        }

        window.buyColor = async function(id) {
            const item = shopItems.find(i => i.id === id);
            if (!item) return;
            if (money < item.price) return alert('Недостаточно монет!');
            money -= item.price;
            currentColor = item.color;
            await update(ref(db, 'users/' + currentUid), { money: money, color: currentColor });
            menuMoney.textContent = money;
            alert(`Куплен скин: ${item.name}!`);
            renderShop();
        };

        // ================= ИГРА =================
        function resizeCanvas() {
            gameCanvas.width = gameContainer.clientWidth;
            gameCanvas.height = gameContainer.clientHeight;
        }

        window.startGame = function() {
            menuSection.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            resizeCanvas();
            initGameLoop();
        };

        function stopGame() {
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            if (updateInterval) { clearInterval(updateInterval); updateInterval = null; }
            if (myPosRef) { remove(myPosRef); myPosRef = null; }
            Object.keys(otherPlayers).forEach(uid => { delete otherPlayers[uid]; });
        }

        window.exitGame = function() { stopGame(); showMenu(); };

        function initGameLoop() {
            if (currentUid) {
                myPosRef = ref(db, 'game2d/' + currentUid);
                updateInterval = setInterval(async () => {
                    if (player) await set(myPosRef, { x: player.x, y: player.y, color: currentColor, nick: currentNick });
                }, 100);

                const othersRef = ref(db, 'game2d');
                onChildAdded(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    const data = snap.val();
                    otherPlayers[uid] = data;
                });
                onChildChanged(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    if (otherPlayers[uid]) otherPlayers[uid] = snap.val();
                });
                onChildRemoved(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    delete otherPlayers[uid];
                });
            }

            // ========== ИСПРАВЛЕНИЕ: WASD НЕ РАБОТАЕТ В ПОЛЯХ ВВОДА ==========
            window.addEventListener('keydown', (e) => {
                // Если фокус в поле ввода, не обрабатываем WASD
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    return;
                }
                if (e.key === 'w' || e.key === 'a' || e.key === 's' || e.key === 'd') {
                    keys[e.key] = true;
                    e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                    return;
                }
                if (e.key === 'w' || e.key === 'a' || e.key === 's' || e.key === 'd') {
                    keys[e.key] = false;
                    e.preventDefault();
                }
            });

            lastTimestamp = performance.now();
            gameLoop(lastTimestamp);
        }

        function gameLoop(timestamp) {
            const deltaTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            // Движение 2 клетки/сек
            const speed = 2 * tileSize; 
            let dx = 0, dy = 0;
            if (keys.w) dy -= speed;
            if (keys.s) dy += speed;
            if (keys.a) dx -= speed;
            if (keys.d) dx += speed;

            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx*dx + dy*dy);
                dx = (dx / len) * speed * deltaTime;
                dy = (dy / len) * speed * deltaTime;
                player.x += dx;
                player.y += dy;
            }

            const limitX = gameCanvas.width / 2 - tileSize/2;
            const limitY = gameCanvas.height / 2 - tileSize/2;
            player.x = Math.max(-limitX, Math.min(limitX, player.x));
            player.y = Math.max(-limitY, Math.min(limitY, player.y));

            // Рендер
            ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
            
            // Трава
            for (let row = 0; row < gameCanvas.height / tileSize + 1; row++) {
                for (let col = 0; col < gameCanvas.width / tileSize + 1; col++) {
                    const isEven = (row + col) % 2 === 0;
                    ctx.fillStyle = isEven ? '#4caf50' : '#43a047';
                    ctx.fillRect(col * tileSize, row * tileSize, tileSize, tileSize);
                }
            }

            // Красная дорожка (3 клетки = 60px)
            ctx.fillStyle = '#cc2233';
            const roadWidth = 3 * tileSize;
            ctx.fillRect(0, gameCanvas.height/2 - roadWidth/2, gameCanvas.width, roadWidth);

            // Базы 4x4 (4 сверху, 4 снизу)
            const basePositions = [-8 * tileSize, -4 * tileSize, 4 * tileSize, 8 * tileSize];
            const leftX = -15 * tileSize;
            const rightX = 15 * tileSize;

            function drawBase(cx, cy) {
                ctx.fillStyle = '#888888';
                const bx = cx - baseWidth/2;
                const by = cy - baseHeight/2;
                ctx.fillRect(bx, by, baseWidth, baseHeight);
                
                ctx.fillStyle = '#cc6600';
                const doorHeight = 10;
                if (cy < 0) {
                    ctx.fillRect(bx, by + baseHeight - doorHeight, baseWidth, doorHeight);
                } else {
                    ctx.fillRect(bx, by, baseWidth, doorHeight);
                }

                ctx.fillStyle = '#33ff33';
                if (cy < 0) {
                    ctx.fillRect(bx, by + baseHeight, baseWidth, panelHeight);
                } else {
                    ctx.fillRect(bx, by - panelHeight, baseWidth, panelHeight);
                }
            }

            basePositions.forEach(y => {
                if (y < 0) drawBase(leftX, y);
                if (y < 0) drawBase(rightX, y);
            });
            basePositions.forEach(y => {
                if (y > 0) drawBase(leftX, y);
                if (y > 0) drawBase(rightX, y);
            });

            // Объекты по центру
            ctx.fillStyle = '#4a7cf7';
            ctx.fillRect(-12 * tileSize, -3 * tileSize, 2 * tileSize, 2 * tileSize);
            ctx.fillStyle = '#2a6bb0';
            ctx.fillRect(-6 * tileSize, -3 * tileSize, 1.5 * tileSize, 2 * tileSize);
            ctx.fillRect(-6 * tileSize + 1.5 * tileSize, -3 * tileSize + 1 * tileSize, 1 * tileSize, 1 * tileSize);
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath(); ctx.arc(0, -2 * tileSize, tileSize, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#ff3333';
            ctx.fillRect(-12 * tileSize, 1 * tileSize, 2 * tileSize, 2 * tileSize);
            ctx.fillStyle = '#bf40bf';
            ctx.beginPath(); ctx.arc(-6 * tileSize, 2 * tileSize, 1.5 * tileSize, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#2a6bb0';
            ctx.fillRect(0, 1 * tileSize, 2 * tileSize, 2 * tileSize);

            // Чёрные квадраты по бокам дороги
            ctx.fillStyle = '#000000';
            ctx.fillRect(-16 * tileSize, gameCanvas.height/2 - tileSize/2, tileSize, tileSize);
            ctx.fillRect(16 * tileSize - tileSize, gameCanvas.height/2 - tileSize/2, tileSize, tileSize);

            // Другие игроки
            for (const uid in otherPlayers) {
                const p = otherPlayers[uid];
                ctx.fillStyle = p.color || '#ff6b6b';
                ctx.fillRect(p.x - tileSize/2, p.y - tileSize/2, tileSize, tileSize);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.nick || uid, p.x, p.y - 15);
            }

            // Я (чёрный квадрат с белым ником)
            ctx.fillStyle = '#000000';
            ctx.fillRect(player.x - tileSize/2, player.y - tileSize/2, tileSize, tileSize);
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(currentNick, player.x, player.y - 20);

            gameMoney.textContent = money;
            animationId = requestAnimationFrame(gameLoop);
        }

        // ================= СТАРТ =================
        checkSession();

        window.addEventListener('resize', () => {
            if (!gameContainer.classList.contains('hidden')) resizeCanvas();
        });
    </script>
</body>
</html>
