<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal A Dushka</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', monospace; }
        #auth { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a1a; z-index: 999; }
        #auth-box { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 350px; height: 350px; background: #000; border: 4px solid #111; padding: 20px; }
        .auth-label { color: #fff; font-size: 14px; margin-bottom: 8px; width: 100%; text-align: left; }
        .auth-input { width: 100%; height: 30px; background: #fff; border: none; color: #000; font-family: 'Courier New', monospace; font-size: 14px; padding: 0 10px; margin-bottom: 20px; }
        .btn-group { display: flex; justify-content: space-between; width: 100%; gap: 10px; }
        .auth-btn { flex: 1; height: 40px; background: #fff; border: none; font-family: 'Courier New', monospace; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-login { color: #000; }
        .btn-reg { color: #FF0000; }
        .hint { color: #888; font-size: 11px; text-align: center; margin-top: 10px; }
        #app { display: none; flex-direction: row; width: 100vw; height: 100vh; background: #1a1a1a; justify-content: center; align-items: center; }
        #sidebar { width: 140px; display: flex; justify-content: center; align-items: center; margin-right: 10px; }
        #actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .act { width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; font-family: 'Courier New', monospace; font-weight: bold; font-size: 12px; color: #fff; cursor: pointer; border: 4px solid #000; background: #666; }
        .act.pink { background: #E54B8C; }
        #game { width: 400px; height: 400px; background: #20b94d; border: 4px solid black; position: relative; overflow: hidden; }
        .base { position: absolute; width: 75px; height: 75px; background: #869292; }
        .base .brown { position: absolute; width: 100%; height: 14px; background: #bf5b1a; bottom: 4px; }
        .base .green { position: absolute; width: 34px; height: 14px; background: #22e54c; left: 50%; transform: translateX(-50%); bottom: -14px; }
        .base-top-1 { top: 20px; left: 20px; } .base-top-2 { top: 20px; left: 115px; } .base-top-3 { top: 20px; left: 210px; } .base-top-4 { top: 20px; left: 305px; }
        .base-bottom-1 { bottom: 20px; left: 20px; } .base-bottom-2 { bottom: 20px; left: 115px; } .base-bottom-3 { bottom: 20px; left: 210px; } .base-bottom-4 { bottom: 20px; left: 305px; }
        .base-bottom .brown { top: 4px; bottom: auto; }
        .base-bottom .green { top: -14px; bottom: auto; }
        #player { position: absolute; width: 10px; height: 20px; display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; z-index: 20; }
        #player .pixel { width: 100%; height: 100%; }
        #interact { position: absolute; display: none; z-index: 1000; width: 24px; height: 24px; background: #777; border: 1px solid #444; display: flex; justify-content: center; align-items: center; color: #fff; font-size: 18px; cursor: pointer; }
        #balance { position: fixed; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #444; color: #fff; font-size: 16px; display: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth">
        <div id="auth-box">
            <label class="auth-label">НИК</label>
            <input type="text" id="username" class="auth-input" autocomplete="off">
            <label class="auth-label">ПАРОЛЬ</label>
            <input type="password" id="password" class="auth-input">
            <div class="btn-group">
                <button class="auth-btn btn-login" onclick="login()">ВОЙТИ</button>
                <button class="auth-btn btn-reg" onclick="register()">РЕГ</button>
            </div>
            <div class="hint">Запишите ваш пароль. Спасибо за внимание</div>
        </div>
    </div>

    <!-- БАЛАНС -->
    <div id="balance">Dushka Coins: <span id="dushka">0</span> | Монеты: <span id="coins">25</span></div>

    <!-- ИГРА -->
    <div id="app">
        <div id="sidebar">
            <div id="actions">
                <div class="act pink" onclick="alert('Магазин скоро!')">SHOP</div>
                <div class="act" onclick="alert('Трейд скоро!')">TRADE</div>
                <div class="act" onclick="alert('Ребирт скоро!')">REBIRTH</div>
                <div class="act" onclick="alert('Дуэль скоро!')">DUEL</div>
            </div>
        </div>
        <div id="game">
            <div class="base base-top-1"><div class="brown"></div><div class="green"></div></div>
            <div class="base base-top-2"><div class="brown"></div><div class="green"></div></div>
            <div class="base base-top-3"><div class="brown"></div><div class="green"></div></div>
            <div class="base base-top-4"><div class="brown"></div><div class="green"></div></div>
            <div class="base base-bottom-1"><div class="brown"></div><div class="green"></div></div>
            <div class="base base-bottom-2"><div class="brown"></div><div class="green"></div></div>
            <div class="base base-bottom-3"><div class="brown"></div><div class="green"></div></div>
            <div class="base base-bottom-4"><div class="brown"></div><div class="green"></div></div>
            <div id="interact" onclick="interact()">E</div>
            <div id="player"></div>
        </div>
    </div>

    <script>
        // ==================== ПЕРЕМЕННЫЕ ====================
        let x = 52, y = 81;
        let coins = 25;
        let dushka = 0;
        let nick = null;
        const keys = { w:false, s:false, a:false, d:false, arrowup:false, arrowdown:false, arrowleft:false, arrowright:false };

        // ==================== ПРОСТОЙ ВХОД (БЕЗ FIREBASE) ====================
        function register() {
            let n = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            if (n && p) {
                // Просто запоминаем в localStorage для теста
                localStorage.setItem('nick', n);
                localStorage.setItem('pass', p);
                nick = n;
                startGame();
            } else alert('Заполни НИК и ПАРОЛЬ!');
        }

        function login() {
            let n = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();
            if (n && p) {
                let savedNick = localStorage.getItem('nick');
                let savedPass = localStorage.getItem('pass');
                if (savedNick === n && savedPass === p) {
                    nick = n;
                    startGame();
                } else if (!savedNick) {
                    alert('Ты не зарегался! Нажми РЕГ.');
                } else {
                    alert('Неверный ник или пароль!');
                }
            } else alert('Заполни НИК и ПАРОЛЬ!');
        }

        // ==================== СТАРТ ИГРЫ ====================
        function startGame() {
            document.getElementById('auth').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('balance').style.display = 'block';
            document.getElementById('dushka').textContent = dushka;
            document.getElementById('coins').textContent = coins;
            initPlayer();
            update();
        }

        // ==================== ПЕРСОНАЖ ====================
        function initPlayer() {
            let pl = document.getElementById('player');
            pl.innerHTML = '<div class="pixel"></div><div class="pixel"></div>';
            let px = pl.querySelectorAll('.pixel');
            px[0].style.background = '#FFCC00';
            px[1].style.background = '#00DFF5';
            pl.style.left = x + 'px';
            pl.style.top = y + 'px';
        }

        // ==================== УПРАВЛЕНИЕ (WASD + СТРЕЛКИ) ====================
        document.addEventListener('keydown', function(e) {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') { keys.w = true; keys.arrowup = true; e.preventDefault(); }
            if (k === 's' || k === 'arrowdown') { keys.s = true; keys.arrowdown = true; e.preventDefault(); }
            if (k === 'a' || k === 'arrowleft') { keys.a = true; keys.arrowleft = true; e.preventDefault(); }
            if (k === 'd' || k === 'arrowright') { keys.d = true; keys.arrowright = true; e.preventDefault(); }
            if (k === 'e') { interact(); e.preventDefault(); }
        });

        document.addEventListener('keyup', function(e) {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') { keys.w = false; keys.arrowup = false; e.preventDefault(); }
            if (k === 's' || k === 'arrowdown') { keys.s = false; keys.arrowdown = false; e.preventDefault(); }
            if (k === 'a' || k === 'arrowleft') { keys.a = false; keys.arrowleft = false; e.preventDefault(); }
            if (k === 'd' || k === 'arrowright') { keys.d = false; keys.arrowright = false; e.preventDefault(); }
        });

        // ==================== ДВИЖЕНИЕ (ЖЕЛЕЗНО) ====================
        const SPEED = 2;
        const MAX_X = 380, MAX_Y = 380;
        const obstacles = [{x:190,y:137,w:20,h:20},{x:150,y:137,w:20,h:20},{x:230,y:137,w:20,h:24},{x:150,y:230,w:20,h:20},{x:190,y:230,w:20,h:20},{x:230,y:230,w:20,h:20}];
        const interactables = [{x:190,y:137,name:'RNG'},{x:150,y:137,name:'Магазин'},{x:230,y:137,name:'Пчелы'},{x:150,y:230,name:'Красный магазин'},{x:190,y:230,name:'Колесо'},{x:230,y:230,name:'Белый магазин'}];

        function collide(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        let lastTime = 0;
        function update(time = 0) {
            requestAnimationFrame(update);
            const dt = Math.min((time - lastTime) / 1000, 0.1);
            lastTime = time;
            let dx = 0, dy = 0;

            if (keys.w || keys.arrowup) dy -= 1;
            if (keys.s || keys.arrowdown) dy += 1;
            if (keys.a || keys.arrowleft) dx -= 1;
            if (keys.d || keys.arrowright) dx += 1;

            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx*dx + dy*dy);
                let nx = x + (dx / len) * SPEED * dt * 60;
                let ny = y + (dy / len) * SPEED * dt * 60;

                // Проверка по X
                let tmpX = nx;
                let rX = {x: tmpX, y: y, w: 10, h: 20};
                let blockedX = false;
                for (let obs of obstacles) if (collide(rX, obs)) { blockedX = true; break; }
                if (!blockedX) x = tmpX;

                // Проверка по Y
                let tmpY = ny;
                let rY = {x: x, y: tmpY, w: 10, h: 20};
                let blockedY = false;
                for (let obs of obstacles) if (collide(rY, obs)) { blockedY = true; break; }
                if (!blockedY) y = tmpY;

                x = Math.max(10, Math.min(MAX_X, x));
                y = Math.max(10, Math.min(MAX_Y, y));

                document.getElementById('player').style.left = x + 'px';
                document.getElementById('player').style.top = y + 'px';
            }

            // Проверка взаимодействия
            let found = false;
            for (let obj of interactables) {
                let dist = Math.sqrt(Math.pow(x - obj.x, 2) + Math.pow(y - obj.y, 2));
                if (dist < 40) {
                    let btn = document.getElementById('interact');
                    btn.style.display = 'flex';
                    btn.style.left = (x - 25) + 'px';
                    btn.style.top = (y - 10) + 'px';
                    btn.dataset.obj = obj.name;
                    found = true;
                    break;
                }
            }
            if (!found) document.getElementById('interact').style.display = 'none';
        }

        // ==================== ВЗАИМОДЕЙСТВИЕ ====================
        function interact() {
            let btn = document.getElementById('interact');
            if (btn.style.display === 'none') return;
            let obj = btn.dataset.obj;
            if (obj) alert('Взаимодействие с: ' + obj);
        }
    </script>
</body>
</html>
