<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Укради Брэйнрот - Полный билд</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; overflow: hidden; }
        #app { width: 100%; height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #1a1f2b; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 520px; margin: 20px auto; }
        input[type="text"], input[type="password"], input[type="file"] { width: 100%; padding: 15px; background: #252d3d; border: none; border-radius: 12px; color: #fff; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-primary { background: #4a7cf7; }
        .btn-primary:hover { background: #3a6be0; }
        .btn-secondary { background: #3a3f4e; }
        .btn-secondary:hover { background: #4a5060; }
        .menu-btn { display: block; width: 100%; padding: 20px; margin-bottom: 12px; background: #252d3d; text-align: center; font-size: 20px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { background: #2f3a50; }
        .profile-row { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: #333; object-fit: cover; border: 3px solid #4a7cf7; }
        .nick { font-size: 24px; font-weight: bold; }
        .stat { color: #aaa; font-size: 14px; }
        .section-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .back-btn { background: #3a3f4e; margin-bottom: 20px; }
        .back-btn:hover { background: #4a5060; }
        .friend-item, .server-item { background: #252d3d; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .server-item .join-btn { width: auto; padding: 8px 25px; background: #4a7cf7; border-radius: 30px; font-size: 14px; }
        .badge-vip { background: #f7c948; color: #000; padding: 4px 12px; border-radius: 30px; font-size: 12px; font-weight: bold; }
        .badge-public { background: #4a7cf7; color: #fff; padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e14; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .progress-bar { width: 80%; height: 10px; background: #252d3d; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .progress-fill { height: 100%; width: 0%; background: #4a7cf7; transition: width 0.1s; }
        .progress-text { font-size: 20px; margin-top: 10px; }
        #gameContainer { position: relative; width: 100%; height: 100vh; }
        #gameUI { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
        .exit-btn { background: #ff6b6b; padding: 10px 20px; border-radius: 10px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        .exit-btn:hover { background: #e55a5a; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row input { flex: 1; margin-bottom: 0; }
        .flex-row button { width: auto; padding: 10px 20px; margin-bottom: 0; }
        .small-btn { width: auto; padding: 5px 15px; font-size: 14px; margin: 0 5px; }
        #serverList { max-height: 400px; overflow-y: auto; }
        .vip-settings { background: #1a1f2b; border-radius: 12px; padding: 15px; margin-top: 10px; border: 1px solid #f7c948; }
        #vipAccess { background: #252d3d; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin: 10px 0; }

        /* --- Стили для магазина --- */
        #shopModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .shop-window { background: #1e2432; width: 90%; max-width: 800px; max-height: 80vh; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; border: 2px solid #3a4a6b; }
        .shop-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .shop-header h2 { color: #4a7cf7; text-transform: uppercase; }
        .shop-close { background: #ff4444; padding: 5px 15px; border-radius: 8px; border: none; color: #fff; font-weight: bold; cursor: pointer; width: auto; margin: 0; }
        .shop-money { color: #f7c948; font-size: 18px; font-weight: bold; }
        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; overflow-y: auto; padding-right: 10px; }
        .shop-item { background: #2a3242; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; border: 1px solid #3f4a5f; }
        .shop-item h4 { font-size: 18px; margin-bottom: 5px; }
        .shop-item p { font-size: 13px; color: #aaa; margin-bottom: 10px; flex-grow: 1; }
        .shop-item .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .price-tag { background: #4caf50; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .auto-check { display: flex; align-items: center; gap: 5px; font-size: 14px; color: #aaa; cursor: pointer; }
        .auto-check input { width: auto; margin: 0; }
        .owned-btn { background: #4caf50; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: bold; border: none; width: auto; margin: 0; font-size: 14px; }
        .buy-btn { background: #4a7cf7; padding: 5px 15px; border-radius: 20px; border: none; color: #fff; font-weight: bold; width: auto; margin: 0; font-size: 14px; }
        .buy-btn:hover { background: #3a6be0; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Авторизация -->
        <div id="authSection" class="card" style="margin-top: 50px;">
            <h2 style="margin-bottom:20px; text-align:center;">Вход / Регистрация</h2>
            <input type="text" id="authNick" placeholder="Ваш никнейм">
            <input type="password" id="authPass" placeholder="Пароль">
            <button id="registerBtn" class="btn-primary">Создать аккаунт</button>
            <button id="loginBtn" class="btn-secondary">Войти</button>
            <div id="authMsg" style="margin-top:15px; text-align:center; color:#ff6b6b; font-weight:bold;"></div>
        </div>

        <!-- Меню -->
        <div id="menuSection" class="hidden" style="max-width: 520px; margin: 50px auto;">
            <div class="profile-row">
                <img id="menuAvatar" class="avatar" src="https://ui-avatars.com/api/?name=Guest&background=random&color=fff&size=80" alt="avatar">
                <div>
                    <div class="nick" id="menuNick">Гость</div>
                    <div class="stat">ID: <span id="menuId">-</span></div>
                </div>
            </div>
            <div class="menu-btn" onclick="openProfile()">👤 Профиль</div>
            <div class="menu-btn" onclick="openFriends()">👥 Друзья</div>
            <div class="menu-btn" onclick="openServers()">🖥️ Серверы</div>
            <div class="menu-btn" onclick="openShop()">🛒 Магазин (Снаряжение)</div>
            <div class="menu-btn" onclick="quickPlay()">▶️ Играть (Карта)</div>
            <div style="margin-top:20px; text-align:center; color:#666; font-size:14px; cursor:pointer;" onclick="logout()">Выйти</div>
        </div>

        <!-- Профиль -->
        <div id="profileSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Профиль</div>
            <div class="profile-row">
                <img id="profileAvatar" class="avatar" src="https://ui-avatars.com/api/?name=Guest&background=random&color=fff&size=80" alt="avatar">
                <div>
                    <div class="nick" id="profileNick">Гость</div>
                    <div class="stat">ID: <span id="profileId">-</span></div>
                </div>
            </div>
            <label style="display:block; margin-bottom:5px;">Сменить аватарку (PNG/JPG)</label>
            <input type="file" id="avatarInput" accept="image/*">
            <label style="display:block; margin:15px 0 5px;">Сменить скин (для 3D-модели)</label>
            <input type="file" id="skinInput" accept="image/*">
            <label style="display:block; margin:15px 0 5px;">Сменить пароль</label>
            <input type="password" id="newPass" placeholder="Новый пароль">
            <button onclick="changePassword()" class="btn-primary">Сохранить пароль</button>
        </div>

        <!-- Друзья -->
        <div id="friendsSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Друзья</div>
            <div class="flex-row">
                <input type="text" id="friendSearch" placeholder="Ник друга">
                <button onclick="sendFriendRequest()" class="btn-primary" style="width:auto; padding:10px 20px;">➕</button>
            </div>
            <div id="friendRequests" style="margin-bottom:15px;">
                <div style="color:#aaa; font-size:14px;">📩 Запросы:</div>
                <div id="requestsList"></div>
            </div>
            <div id="friendsList">
                <div style="color:#aaa; font-size:14px;">👥 Мои друзья:</div>
                <div id="friendsListContainer"></div>
            </div>
        </div>

        <!-- Серверы -->
        <div id="serversSection" class="hidden card" style="max-width: 520px; margin: 50px auto;">
            <button class="back-btn" onclick="openMenu()">← Назад</button>
            <div class="section-title">Серверы</div>
            <button class="create-vip-btn" onclick="toggleCreateVip()" style="background:#f7c948; color:#000; padding:10px; border:none; border-radius:10px; margin-bottom:10px; font-weight:bold; cursor:pointer;">✨ Создать VIP-сервер</button>
            <div id="createVipForm" class="vip-settings hidden">
                <label>Название VIP-сервера</label>
                <input type="text" id="vipName" placeholder="Мой VIP">
                <label>Кто может заходить?</label>
                <select id="vipAccess">
                    <option value="all">Все</option>
                    <option value="friends">Только друзья</option>
                </select>
                <button onclick="createVipServer()" class="btn-primary">Создать</button>
            </div>
            <div id="serverList"></div>
        </div>

        <!-- Магазин -->
        <div id="shopModal" class="hidden">
            <div class="shop-window">
                <div class="shop-header">
                    <h2>🛒 Shop</h2>
                    <div class="shop-money" id="shopMoneyDisplay">💰 $0</div>
                    <button class="shop-close" onclick="closeShop()">✕</button>
                </div>
                <div class="shop-grid" id="shopGrid"></div>
            </div>
        </div>

        <!-- Загрузка -->
        <div id="loadingOverlay" class="hidden">
            <div style="font-size:30px;">⏳ Загрузка...</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- 3D Сцена -->
        <div id="gameContainer" class="hidden">
            <div id="gameUI">
                <button class="exit-btn" onclick="exitGame()">✕ Выйти</button>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <!-- Firebase SDK + Three.js -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js",
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        // ------------------------------------------------------------
        // ПОЛНЫЙ КОД: ВСЁ! Карта, Магазин, Управление ПКМ
        // ------------------------------------------------------------
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, set, get, update, remove, push, onValue, onChildAdded, onChildChanged, onChildRemoved } from 'firebase/database';
        import * as THREE from 'three';

        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM
        const authSection = document.getElementById('authSection');
        const menuSection = document.getElementById('menuSection');
        const profileSection = document.getElementById('profileSection');
        const friendsSection = document.getElementById('friendsSection');
        const serversSection = document.getElementById('serversSection');
        const shopModal = document.getElementById('shopModal');
        const shopGrid = document.getElementById('shopGrid');
        const shopMoneyDisplay = document.getElementById('shopMoneyDisplay');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const gameContainer = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const serverList = document.getElementById('serverList');
        const requestsList = document.getElementById('requestsList');
        const friendsListContainer = document.getElementById('friendsListContainer');
        const friendSearch = document.getElementById('friendSearch');
        const vipName = document.getElementById('vipName');
        const vipAccess = document.getElementById('vipAccess');
        const createVipForm = document.getElementById('createVipForm');

        const authNick = document.getElementById('authNick');
        const authPass = document.getElementById('authPass');
        const registerBtn = document.getElementById('registerBtn');
        const loginBtn = document.getElementById('loginBtn');
        const authMsg = document.getElementById('authMsg');

        const menuNick = document.getElementById('menuNick');
        const menuId = document.getElementById('menuId');
        const menuAvatar = document.getElementById('menuAvatar');
        const profileNick = document.getElementById('profileNick');
        const profileId = document.getElementById('profileId');
        const profileAvatar = document.getElementById('profileAvatar');
        const newPass = document.getElementById('newPass');
        const avatarInput = document.getElementById('avatarInput');
        const skinInput = document.getElementById('skinInput');

        let currentNick = null;
        let currentUid = null;
        let currentUserData = null;
        let currentServerId = null;
        let playerMoney = 50000; // Стартовые деньги

        // -------------------- 3D Переменные --------------------
        let scene, camera, renderer, player;
        let keys = { w: false, a: false, s: false, d: false };
        let animationId = null;
        let playerPosRef = null;
        let updateInterval = null;
        let otherPlayers = {};

        let camTheta = 0.5;
        let camPhi = 0.4;
        let camRadius = 15;
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;

        // Данные магазина
        const shopItems = [
            { id: 'slap', name: 'Slap', desc: 'An average hand to slap thieves!', price: 500, emoji: '✋' },
            { id: 'speed_coil', name: 'Speed Coil', desc: 'Zoom around the map!', price: 750, emoji: '🌀' },
            { id: 'iron_slap', name: 'Iron Slap', desc: 'Heavy iron slap!', price: 2500, emoji: '🗿' },
            { id: 'gold_slap', name: 'Gold Slap', desc: 'Powerful golden slap!', price: 15000, emoji: '✨' },
            { id: 'diamond_slap', name: 'Diamond Slap', desc: 'Charge up a diamond slap!', price: 50000, emoji: '💎' },
            { id: 'emerald_slap', name: 'Emerald Slap', desc: 'Gem-infused slap!', price: 200000, emoji: '💚' },
            { id: 'ruby_slap', name: 'Ruby Slap', desc: 'Ultimate ruby-powered slap!', price: 1000000, emoji: '❤️' },
            { id: 'dark_slap', name: 'Dark Matter Slap', desc: 'Power of dark matter!', price: 1500000, emoji: '🖤' },
            { id: 'flame_slap', name: 'Flame Slap', desc: 'Burn your enemies!', price: 2500000, emoji: '🔥' },
            { id: 'nuclear_slap', name: 'Nuclear Slap', desc: 'Explodes with nuclear force!', price: 6000000, emoji: '☢️' },
            { id: 'galaxy_slap', name: 'Galaxy Slap', desc: 'Slap with star power!', price: 15000000, emoji: '🌌' },
            { id: 'glitched_slap', name: 'Glitched Slap', desc: 'Corrupt reality!', price: 25000000, emoji: '🌀' },
        ];

        // -------------------- Утилиты --------------------
        function showLoading(callback) {
            loadingOverlay.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                        if (callback) callback();
                    }, 500);
                }
            }, 100);
        }

        async function loginUser(nick, pass) {
            const userRef = ref(db, 'users/' + nick);
            const snap = await get(userRef);
            if (!snap.exists()) { authMsg.textContent = '❌ Пользователь не найден!'; return false; }
            const data = snap.val();
            if (data.password !== pass) { authMsg.textContent = '❌ Неверный пароль!'; return false; }
            currentNick = nick; currentUid = nick; currentUserData = data;
            playerMoney = data.money || 50000;
            localStorage.setItem('stealSession', JSON.stringify({ nick, password: pass }));
            return true;
        }

        // -------------------- Регистрация --------------------
        registerBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim(); const pass = authPass.value.trim();
            if (!nick || !pass) { authMsg.textContent = 'Заполни все поля!'; return; }
            const userRef = ref(db, 'users/' + nick);
            if ((await get(userRef)).exists()) { authMsg.textContent = '❌ Этот ник уже занят!'; return; }
            await set(userRef, {
                nick: nick, password: pass, money: 50000,
                avatar: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(nick) + '&background=random&color=fff&size=80',
                skin: '', friends: {}, friendRequests: {}, inventory: {}
            });
            if (!(await get(ref(db, 'admins/Dushka'))).exists()) {
                await set(ref(db, 'admins/Dushka'), { nick: 'Dushka', password: '16052014may' });
            }
            authMsg.textContent = '✅ Аккаунт создан! Теперь войди.'; authMsg.style.color = '#4a7cf7';
        });

        // -------------------- Вход --------------------
        loginBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim(); const pass = authPass.value.trim();
            if (!nick || !pass) { authMsg.textContent = 'Заполни все поля!'; return; }
            if (await loginUser(nick, pass)) { authMsg.textContent = ''; showMenu(); }
        });

        async function checkSession() {
            const session = localStorage.getItem('stealSession');
            if (session) {
                const { nick, password } = JSON.parse(session);
                if (await loginUser(nick, password)) { showMenu(); return; }
                localStorage.removeItem('stealSession');
            }
            authSection.classList.remove('hidden');
        }

        // -------------------- Навигация --------------------
        function showMenu() {
            authSection.classList.add('hidden'); menuSection.classList.remove('hidden');
            profileSection.classList.add('hidden'); friendsSection.classList.add('hidden'); serversSection.classList.add('hidden');
            shopModal.classList.add('hidden');
            gameContainer.classList.add('hidden');
            stopGame();

            menuNick.textContent = currentUserData.nick; menuId.textContent = currentUid.slice(0, 6);
            menuAvatar.src = currentUserData.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUserData.nick) + '&background=random&color=fff&size=80';
            profileNick.textContent = currentUserData.nick; profileId.textContent = currentUid.slice(0, 6);
            profileAvatar.src = currentUserData.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(currentUserData.nick) + '&background=random&color=fff&size=80';

            loadFriends(); loadFriendRequests(); loadServers(); renderShop();
        }

        function stopGame() {
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            if (renderer) { renderer.dispose(); renderer = null; }
            if (updateInterval) { clearInterval(updateInterval); updateInterval = null; }
            if (playerPosRef) { remove(playerPosRef); playerPosRef = null; }
            if (currentServerId) { leaveServer(currentServerId); currentServerId = null; }
            Object.keys(otherPlayers).forEach(uid => { scene.remove(otherPlayers[uid]); delete otherPlayers[uid]; });
        }

        window.openProfile = function() { menuSection.classList.add('hidden'); profileSection.classList.remove('hidden'); };
        window.openFriends = function() { menuSection.classList.add('hidden'); friendsSection.classList.remove('hidden'); loadFriends(); loadFriendRequests(); };
        window.openServers = function() { menuSection.classList.add('hidden'); serversSection.classList.remove('hidden'); loadServers(); };
        window.openMenu = function() { profileSection.classList.add('hidden'); friendsSection.classList.add('hidden'); serversSection.classList.add('hidden'); shopModal.classList.add('hidden'); menuSection.classList.remove('hidden'); };
        window.logout = function() {
            localStorage.removeItem('stealSession'); currentNick = null; currentUid = null; currentUserData = null;
            if (currentServerId) { leaveServer(currentServerId); currentServerId = null; }
            menuSection.classList.add('hidden'); profileSection.classList.add('hidden'); friendsSection.classList.add('hidden'); serversSection.classList.add('hidden');
            authSection.classList.remove('hidden'); authMsg.textContent = ''; authNick.value = ''; authPass.value = '';
            stopGame();
        };

        // -------------------- Профиль --------------------
        window.changePassword = async function() {
            const newP = newPass.value.trim();
            if (!newP) return alert('Введи новый пароль');
            await update(ref(db, 'users/' + currentUid + '/password'), { password: newP });
            alert('Пароль обновлён!'); newPass.value = '';
        };

        avatarInput.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const dataUrl = ev.target.result;
                await update(ref(db, 'users/' + currentUid + '/avatar'), { avatar: dataUrl });
                menuAvatar.src = dataUrl; profileAvatar.src = dataUrl;
                alert('Аватарка обновлена!');
            };
            reader.readAsDataURL(file);
        });

        skinInput.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                const dataUrl = ev.target.result;
                await update(ref(db, 'users/' + currentUid + '/skin'), { skin: dataUrl });
                currentUserData.skin = dataUrl;
                alert('Скин сохранён!');
            };
            reader.readAsDataURL(file);
        });

        // -------------------- Магазин (Кнопки и UI) --------------------
        window.openShop = function() { menuSection.classList.add('hidden'); shopModal.classList.remove('hidden'); renderShop(); };
        window.closeShop = function() { shopModal.classList.add('hidden'); menuSection.classList.remove('hidden'); };

        function renderShop() {
            shopMoneyDisplay.textContent = `💰 $${playerMoney.toLocaleString()}`;
            shopGrid.innerHTML = '';
            shopItems.forEach(item => {
                const owned = currentUserData.inventory && currentUserData.inventory[item.id];
                const div = document.createElement('div'); div.className = 'shop-item';
                div.innerHTML = `
                    <h4>${item.emoji} ${item.name}</h4>
                    <p>${item.desc}</p>
                    <div class="row">
                        <div>
                            ${owned ? `<span class="owned-btn">OWNED</span>` : `<span class="price-tag">$${item.price.toLocaleString()}</span>`}
                        </div>
                        <div class="auto-check">
                            <input type="checkbox" ${owned ? 'disabled' : ''} onchange="toggleAutoBuy('${item.id}')">
                            <label>Auto Buy</label>
                            ${!owned ? `<button class="buy-btn" onclick="buyItem('${item.id}')">Buy</button>` : ''}
                        </div>
                    </div>
                `;
                shopGrid.appendChild(div);
            });
        }

        // Глобальные функции для магазина
        window.buyItem = async function(itemId) {
            const item = shopItems.find(i => i.id === itemId);
            if (!item) return;
            if (currentUserData.inventory && currentUserData.inventory[itemId]) return alert('У тебя уже есть это!');
            if (playerMoney < item.price) return alert('Недостаточно денег!');
            
            playerMoney -= item.price;
            if (!currentUserData.inventory) currentUserData.inventory = {};
            currentUserData.inventory[itemId] = true;

            await update(ref(db, 'users/' + currentUid), { money: playerMoney, inventory: currentUserData.inventory });
            renderShop();
            alert(`Куплено: ${item.name}!`);
        };

        window.toggleAutoBuy = function(itemId) {
            alert('Функция Auto Buy пока в разработке, но галочка запомнена!');
        };

        // -------------------- Друзья --------------------
        window.sendFriendRequest = async function() {
            const targetNick = friendSearch.value.trim();
            if (!targetNick) return alert('Введи ник друга');
            if (targetNick === currentUserData.nick) return alert('Нельзя добавить себя');
            const snap = await get(ref(db, 'users'));
            if (!snap.exists()) return alert('Нет пользователей');
            let targetUid = null;
            snap.forEach((child) => { if (child.val().nick === targetNick) targetUid = child.key; });
            if (!targetUid) return alert('Пользователь не найден');
            if (targetUid === currentUid) return alert('Это ты');
            await set(ref(db, 'users/' + targetUid + '/friendRequests/' + currentUid), { from: currentUserData.nick, timestamp: Date.now() });
            alert('Запрос отправлен!'); friendSearch.value = '';
        };

        function loadFriendRequests() {
            if (!currentUid) return;
            onValue(ref(db, 'users/' + currentUid + '/friendRequests'), (snap) => {
                requestsList.innerHTML = '';
                if (!snap.exists()) { requestsList.innerHTML = '<div style="color:#666;">Нет запросов</div>'; return; }
                snap.forEach((child) => {
                    const data = child.val();
                    const div = document.createElement('div'); div.className = 'friend-item';
                    div.innerHTML = `<span>${data.from}</span><div><button class="small-btn" onclick="acceptRequest('${child.key}')" style="background:#4a7cf7;">✔</button><button class="small-btn" onclick="rejectRequest('${child.key}')" style="background:#6b6b6b;">✖</button></div>`;
                    requestsList.appendChild(div);
                });
            });
        }

        window.acceptRequest = async function(requesterUid) {
            const userSnap = await get(ref(db, 'users/' + requesterUid));
            const requesterNick = userSnap.exists() ? userSnap.val().nick : 'Неизвестный';
            await set(ref(db, 'users/' + currentUid + '/friends/' + requesterUid), { nick: requesterNick });
            await remove(ref(db, 'users/' + currentUid + '/friendRequests/' + requesterUid));
            await set(ref(db, 'users/' + requesterUid + '/friends/' + currentUid), { nick: currentUserData.nick });
            loadFriends(); loadFriendRequests();
        };
        window.rejectRequest = async function(requesterUid) {
            await remove(ref(db, 'users/' + currentUid + '/friendRequests/' + requesterUid));
            loadFriendRequests();
        };

        function loadFriends() {
            if (!currentUid) return;
            onValue(ref(db, 'users/' + currentUid + '/friends'), (snap) => {
                friendsListContainer.innerHTML = '';
                if (!snap.exists()) { friendsListContainer.innerHTML = '<div style="color:#666;">У тебя пока нет друзей</div>'; return; }
                snap.forEach((child) => {
                    const data = child.val();
                    const div = document.createElement('div'); div.className = 'friend-item';
                    div.innerHTML = `<span>${data.nick || 'Неизвестный'}</span>`;
                    friendsListContainer.appendChild(div);
                });
            });
        }

        // -------------------- Серверы --------------------
        window.toggleCreateVip = function() { createVipForm.classList.toggle('hidden'); };
        window.createVipServer = async function() {
            const name = vipName.value.trim();
            if (!name) return alert('Введи название VIP-сервера');
            if (!currentUid) return alert('Нет авторизации');
            const vipRef = ref(db, 'vipServers');
            const newVipRef = push(vipRef);
            await set(newVipRef, { name: name, owner: currentUserData.nick, ownerUid: currentUid, players: 0, max: 8, access: vipAccess.value });
            alert('VIP-сервер создан!'); vipName.value = ''; createVipForm.classList.add('hidden'); loadServers();
        };

        async function createPublicServer() {
            const newRef = push(ref(db, 'publicServers'));
            await set(newRef, { players: 0, max: 8, createdAt: Date.now() });
            return newRef.key;
        }

        async function getAvailablePublicServer() {
            const snap = await get(ref(db, 'publicServers'));
            if (!snap.exists()) return await createPublicServer();
            let available = null;
            snap.forEach((child) => { const data = child.val(); if (data.players < data.max && !available) available = child.key; });
            if (!available) available = await createPublicServer();
            return available;
        }

        async function leaveServer(serverId) {
            if (!serverId) return;
            const path = 'publicServers/' + serverId;
            const snap = await get(ref(db, path));
            if (snap.exists()) { const data = snap.val(); await update(ref(db, path), { players: Math.max(0, data.players - 1) }); }
            currentServerId = null;
        }

        window.quickPlay = async function() {
            if (!currentUid) return alert('Сначала войди');
            const serverId = await getAvailablePublicServer();
            await joinServerLogic(serverId, false);
        };

        window.joinServer = async function(serverId, isVip) {
            if (!currentUid) return alert('Сначала войди');
            await joinServerLogic(serverId, isVip);
        };

        async function joinServerLogic(serverId, isVip) {
            if (currentServerId) await leaveServer(currentServerId);
            const path = isVip ? 'vipServers/' + serverId : 'publicServers/' + serverId;
            const snap = await get(ref(db, path));
            if (!snap.exists()) return alert('Сервер не найден');
            const data = snap.val();
            if (data.players >= data.max) return alert('Сервер заполнен!');
            await update(ref(db, path), { players: data.players + 1 });
            currentServerId = serverId;
            showLoading(() => { init3D(); });
        }

        function loadServers() {
            onValue(ref(db, 'publicServers'), async (snap) => {
                let publicServers = [];
                if (snap.exists()) { snap.forEach((child) => { publicServers.push({ id: child.key, ...child.val(), type: 'public', name: 'Публичный #' + child.key.slice(0, 4) }); }); }
                const vipSnap = await get(ref(db, 'vipServers'));
                let vipServers = [];
                if (vipSnap.exists()) { vipSnap.forEach((child) => { vipServers.push({ id: child.key, ...child.val(), type: 'vip' }); }); }
                const all = [...vipServers, ...publicServers];
                serverList.innerHTML = '';
                if (all.length === 0) { serverList.innerHTML = '<div style="color:#666;">Нет серверов</div>'; return; }
                all.forEach(s => {
                    const isVip = s.type === 'vip';
                    const div = document.createElement('div'); div.className = 'server-item';
                    div.innerHTML = `
                        <div>
                            <strong>${s.name || 'Сервер'}</strong>
                            <span class="${isVip ? 'badge-vip' : 'badge-public'}">${isVip ? 'VIP' : 'Публичный'}</span>
                            <div style="font-size:13px; color:#aaa;">${s.players || 0}/${s.max || 8}</div>
                        </div>
                        <button class="join-btn" onclick="joinServer('${s.id}', ${isVip})">Join</button>
                    `;
                    serverList.appendChild(div);
                });
            });
        }

        // -------------------- 3D Игра (КАРТА, БАЗЫ, МАГАЗИНЫ) --------------------
        function makeLabel(text, color, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.font = 'Bold 50px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'black'; ctx.shadowBlur = 10;
            ctx.fillStyle = color; ctx.fillText(text, 256, 64);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(6, 1.5, 1);
            sprite.position.set(x, y, z);
            scene.add(sprite);
        }

        function createPlayerModel(skinUrl, isOther = false) {
            const group = new THREE.Group();
            const headGeo = new THREE.SphereGeometry(0.3, 12, 12);
            const bodyGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.8, 8);
            let material;
            if (skinUrl && typeof skinUrl === 'string' && skinUrl.startsWith('data:image')) {
                const loader = new THREE.TextureLoader();
                const texture = loader.load(skinUrl, undefined, undefined, () => {});
                texture.flipY = false;
                material = new THREE.MeshStandardMaterial({ map: texture });
            } else {
                material = new THREE.MeshStandardMaterial({ color: isOther ? 0xff6b6b : 0x4a7cf7 });
            }
            const head = new THREE.Mesh(headGeo, material); head.position.y = 0.7;
            const body = new THREE.Mesh(bodyGeo, material); body.position.y = 0.2;
            group.add(head); group.add(body);
            return group;
        }

        function init3D() {
            gameContainer.classList.remove('hidden');
            menuSection.classList.add('hidden');
            profileSection.classList.add('hidden');
            friendsSection.classList.add('hidden');
            serversSection.classList.add('hidden');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camTheta = 0.5; camPhi = 0.4; camRadius = 15;

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            const ambient = new THREE.AmbientLight(0x404060); scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1); dirLight.position.set(5, 20, 10); dirLight.castShadow = true; scene.add(dirLight);
            const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a7bd5, 0.6); scene.add(hemiLight);

            // --- КАРТА ---
            const groundGeo = new THREE.PlaneGeometry(70, 70);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x6dc85c, side: THREE.DoubleSide });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
            const walls = [
                { x: 0, z: -35, w: 70, h: 0.5 }, { x: 0, z: 35, w: 70, h: 0.5 },
                { x: -35, z: 0, w: 0.5, h: 70 }, { x: 35, z: 0, w: 0.5, h: 70 }
            ];
            walls.forEach(w => {
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, 1.2, w.h), wallMat);
                wallMesh.position.set(w.x, 0.6, w.z); scene.add(wallMesh);
            });

            const carpetMat = new THREE.MeshStandardMaterial({ color: 0xcc2233 });
            const carpet = new THREE.Mesh(new THREE.PlaneGeometry(6, 40), carpetMat);
            carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, 0.01, 0); scene.add(carpet);

            // --- БАЗЫ (1 ЭТАЖ) ---
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            const greenMat = new THREE.MeshStandardMaterial({ color: 0x33ff33 });
            const redMat = new THREE.MeshStandardMaterial({ color: 0xff3333 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xD2B48C });
            
            function createBase(x, z) {
                const group = new THREE.Group();
                const baseFloor = new THREE.Mesh(new THREE.BoxGeometry(6, 0.2, 6), new THREE.MeshStandardMaterial({color:0x444444}));
                baseFloor.position.set(0, 0.1, 0); group.add(baseFloor);
                const wallsBase = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 6), new THREE.MeshStandardMaterial({color:0x777777, transparent:true, opacity:0.5}));
                wallsBase.position.set(0, 0.7, 0); group.add(wallsBase);
                
                const stairMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
                const hole = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.1, 3), new THREE.MeshStandardMaterial({color:0x111111}));
                hole.position.set(0, 0.2, 0); group.add(hole);
                for(let i=0; i<6; i++) {
                    const step = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 0.3), stairMat);
                    step.position.set(0, -0.2 - i*0.3, -1.5 + i*0.6); group.add(step);
                }
                const redBar = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1.5), redMat);
                redBar.position.set(0, -0.8, -0.5); group.add(redBar);
                const redBar2 = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 1.5), redMat);
                redBar2.position.set(0, -1.5, -0.5); group.add(redBar2);
                for(let i=0; i<3; i++) {
                    const plat = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.8), greenMat);
                    plat.position.set(-1.5 + i*1.5, -0.8, 1.5); group.add(plat);
                }
                const doorMat = new THREE.MeshStandardMaterial({ color: 0xDD2222 });
                const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 1), doorMat);
                door.position.set(0, 0.2, 2.8); group.add(door);
                const sign = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 0.1), woodMat);
                sign.position.set(0, 0.9, 3.1); group.add(sign);
                group.position.set(x, 0, z); scene.add(group);
            }
            createBase(-15, -12); createBase(-15, 12); createBase(15, -12); createBase(15, 12);
            createBase(-25, -12); createBase(-25, 12); createBase(25, -12); createBase(25, 12);

            // --- ОБЪЕКТЫ ---
            const shopGroup = new THREE.Group();
            const shopBase = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 3), new THREE.MeshStandardMaterial({color:0x888888}));
            shopBase.position.y = 0.15; shopGroup.add(shopBase);
            const poleMat = new THREE.MeshStandardMaterial({color:0xaaaaaa});
            for(let i=-1; i<=1; i+=2) { for(let j=-1; j<=1; j+=2) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.5), poleMat); p.position.set(i*1.2, 1.3, j*1.2); shopGroup.add(p); } }
            const roof = new THREE.Mesh(new THREE.ConeGeometry(2.8, 0.8, 4), new THREE.MeshStandardMaterial({color: 0x4a7cf7}));
            roof.rotation.y = Math.PI/4; roof.position.y = 2.2; shopGroup.add(roof);
            shopGroup.position.set(-20, 0, -15); scene.add(shopGroup); makeLabel('Shop', '#4a7cf7', -20, 3.5, -15);

            const rngGroup = new THREE.Group();
            const rngBase = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 1.6), new THREE.MeshStandardMaterial({color:0x3a6be0}));
            rngBase.position.y = 0.6; rngGroup.add(rngBase);
            const rngFace = new THREE.Mesh(new THREE.BoxGeometry(1, 0.6, 0.1), new THREE.MeshStandardMaterial({color:0x111111}));
            rngFace.position.set(0, 0.8, 0.85); rngGroup.add(rngFace);
            rngGroup.position.set(-10, 0, -25); scene.add(rngGroup); makeLabel('RNG Machine', '#3a6be0', -10, 2.8, -25);

            const wheelGroup = new THREE.Group();
            const wheelBase = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.3, 2.5), new THREE.MeshStandardMaterial({color:0x444444}));
            wheelBase.position.y = 0.15; wheelGroup.add(wheelBase);
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, 0.3, 16), new THREE.MeshStandardMaterial({color:0xbf40bf}));
            wheel.position.y = 1.8; wheelGroup.add(wheel);
            wheelGroup.position.set(10, 0, -25); scene.add(wheelGroup); makeLabel('Crystal Wheel', '#bf40bf', 10, 3.2, -25);

            const robuxGroup = new THREE.Group();
            const rBase = new THREE.Mesh(new THREE.BoxGeometry(3, 0.3, 3), new THREE.MeshStandardMaterial({color:0x888888}));
            rBase.position.y = 0.15; robuxGroup.add(rBase);
            const rRoof = new THREE.Mesh(new THREE.ConeGeometry(2.8, 0.8, 4), new THREE.MeshStandardMaterial({color: 0xff3333}));
            rRoof.rotation.y = Math.PI/4; rRoof.position.y = 2.2; robuxGroup.add(rRoof);
            robuxGroup.position.set(20, 0, -15); scene.add(robuxGroup); makeLabel('Robux Shop', '#ff3333', 20, 3.5, -15);

            const plazaGroup = new THREE.Group();
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.5, 2.5, 0.5), new THREE.MeshStandardMaterial({color:0x2a6bb0}));
            pillar.position.set(-1.5, 1.25, 0); plazaGroup.add(pillar);
            const pillar2 = pillar.clone(); pillar2.position.set(1.5, 1.25, 0); plazaGroup.add(pillar2);
            const arch = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.4, 0.5), new THREE.MeshStandardMaterial({color:0x2a6bb0}));
            arch.position.set(0, 2.5, 0); plazaGroup.add(arch);
            plazaGroup.position.set(-10, 0, -8); scene.add(plazaGroup); makeLabel('Trade Plaza', '#2a6bb0', -10, 3.8, -8);

            const beeGroup = new THREE.Group();
            const beeBody = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 0.6, 6), new THREE.MeshStandardMaterial({color:0xffcc00}));
            beeBody.position.y = 0.8; beeGroup.add(beeBody);
            const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.1, 6), new THREE.MeshStandardMaterial({color:0x222222}));
            stripe.position.y = 0.9; beeGroup.add(stripe);
            const stripe2 = stripe.clone(); stripe2.position.y = 0.7; beeGroup.add(stripe2);
            beeGroup.position.set(20, 0, -15); scene.add(beeGroup); makeLabel('Queen Bee', '#ffcc00', 20, 2.5, -15);

            // --- ИГРОК ---
            const skinUrl = currentUserData.skin || null;
            player = createPlayerModel(skinUrl, false);
            player.position.set(0, 0.1, 0);
            scene.add(player);

            // --- МУЛЬТИПЛЕЕР ---
            if (currentServerId) {
                playerPosRef = ref(db, 'gameSessions/' + currentServerId + '/' + currentUid);
                updateInterval = setInterval(async () => {
                    if(player) await set(playerPosRef, { x: player.position.x, z: player.position.z, nick: currentUserData.nick, skin: currentUserData.skin || '' });
                }, 100);
                const othersRef = ref(db, 'gameSessions/' + currentServerId);
                onChildAdded(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    const data = snap.val();
                    const model = createPlayerModel(data.skin || null, true);
                    model.position.set(data.x || 0, 0.1, data.z || 0);
                    scene.add(model); otherPlayers[uid] = model;
                });
                onChildChanged(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid || !otherPlayers[uid]) return;
                    const data = snap.val();
                    otherPlayers[uid].position.x = data.x || 0;
                    otherPlayers[uid].position.z = data.z || 0;
                });
                onChildRemoved(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    if (otherPlayers[uid]) { scene.remove(otherPlayers[uid]); delete otherPlayers[uid]; }
                });
            }

            // --- УПРАВЛЕНИЕ ---
            window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = true; e.preventDefault(); } });
            window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k === 'w' || k === 'a' || k === 's' || k === 'd') { keys[k] = false; e.preventDefault(); } });

            canvas.addEventListener('mousedown', (e) => { if (e.button === 2) { isDragging = true; previousMouseX = e.clientX; previousMouseY = e.clientY; } });
            window.addEventListener('mousemove', (e) => { if (isDragging) {
                const deltaX = e.clientX - previousMouseX;
                const deltaY = e.clientY - previousMouseY;
                camTheta -= deltaX * 0.01;
                camPhi -= deltaY * 0.01;
                camPhi = Math.max(0.1, Math.min(1.5, camPhi));
                previousMouseX = e.clientX; previousMouseY = e.clientY;
            }});
            window.addEventListener('mouseup', (e) => { if (e.button === 2) isDragging = false; });
            canvas.addEventListener('wheel', (e) => { e.preventDefault(); camRadius += e.deltaY * 0.05; camRadius = Math.max(5, Math.min(35, camRadius)); });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            animate();
        }

        function animate() {
            if (!renderer || !player) return;
            const speed = 0.15;
            const forward = new THREE.Vector3(-Math.sin(camTheta), 0, -Math.cos(camTheta));
            const right = new THREE.Vector3(forward.z, 0, -forward.x);
            const moveX = (keys.w ? forward.x : 0) + (keys.s ? -forward.x : 0) + (keys.a ? -right.x : 0) + (keys.d ? right.x : 0);
            const moveZ = (keys.w ? forward.z : 0) + (keys.s ? -forward.z : 0) + (keys.a ? -right.z : 0) + (keys.d ? right.z : 0);
            const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
            if (len > 0) {
                player.position.x += (moveX / len) * speed;
                player.position.z += (moveZ / len) * speed;
                player.rotation.y = Math.atan2(moveX, moveZ);
            }
            const limit = 34;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            const xOffset = camRadius * Math.sin(camTheta) * Math.cos(camPhi);
            const zOffset = camRadius * Math.cos(camTheta) * Math.cos(camPhi);
            const yOffset = camRadius * Math.sin(camPhi);
            camera.position.x = player.position.x + xOffset;
            camera.position.z = player.position.z + zOffset;
            camera.position.y = player.position.y + yOffset;
            camera.lookAt(player.position.x, player.position.y + 0.5, player.position.z);

            renderer.render(scene, camera);
            animationId = requestAnimationFrame(animate);
        }

        window.exitGame = function() { stopGame(); showMenu(); };
        window.addEventListener('resize', () => {
            if (renderer) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        });

        // -------------------- Инициализация --------------------
        checkSession();
        console.log('🔥 Полный билд с магазином и картой загружен!');
