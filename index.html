<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal Dushka</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; overflow: hidden; user-select: none; }
        #app { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .hidden { display: none !important; }

        /* --- ЗАСТАВКА --- */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0e14;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer;
        }
        #splashCanvas { background: #000000; border: 4px solid #ffffff; }
        .click-hint {
            color: #4a7cf7; font-family: 'Press Start 2P', monospace;
            font-size: 14px; margin-top: 25px; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        /* --- ОКНО ВХОДА --- */
        #authContainer {
            background: #000000; padding: 25px 15px 15px 15px;
            border: 4px solid #ffffff; width: 280px;
            display: flex; flex-direction: column; gap: 8px; align-items: center;
        }
        .pixel-label { font-family: 'Press Start 2P', monospace; font-size: 14px; color: #fff; width: 100%; text-align: left; margin-top: 8px; }
        #authContainer input {
            width: 100%; background: #ffffff; border: none; padding: 6px 10px;
            font-size: 16px; font-family: monospace; color: #000; outline: none;
        }
        .auth-buttons { display: flex; justify-content: space-between; width: 100%; gap: 8px; margin-top: 15px; }
        .auth-buttons button {
            flex: 1; background: #ffffff; border: none; padding: 10px 0;
            font-family: 'Press Start 2P', monospace; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .auth-buttons button:hover { background: #dddddd; }
        #loginBtn { color: #000000; }
        #registerBtn { color: #ff0000; }

        /* --- ПИКСЕЛЬНОЕ МЕНЮ (БЕЗ МАГАЗИНА, МЕНЬШЕГО РАЗМЕРА) --- */
        #pixelMenu {
            background: #000000; padding: 15px;
            border: 4px solid #ffffff; width: 260px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .menu-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .menu-item { display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; }
        .menu-item:hover { opacity: 0.8; }
        .pixel-btn {
            background: #ffffff; width: 100%; aspect-ratio: 2/1;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Press Start 2P', monospace; font-size: 28px; color: #00ffff;
        }
        .logout-item { width: 100%; }
        .logout-btn { width: 60%; aspect-ratio: 2/1; }
        .logout-svg { width: 60%; height: 60%; stroke: #00ffff; stroke-width: 8; stroke-linecap: square; stroke-linejoin: square; }

        /* --- ИГРА --- */
        #gameContainer { position: relative; width: 100vw; height: 100vh; background: #1a1f2b; }
        canvas { display: block; width: 100%; height: 100%; }
        #uiOverlay { position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        #uiOverlay .money { background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; font-size: 20px; font-weight: bold; color: #f7c948; border: 1px solid #f7c948; }
        #uiOverlay .exit-btn { background: #ff4444; padding: 8px 20px; border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app">
        <!-- ЗАСТАВКА -->
        <div id="splashScreen" onclick="closeSplash()">
            <canvas id="splashCanvas" width="260" height="160"></canvas>
            <div class="click-hint">НАЖМИТЕ В ЛЮБОЕ МЕСТО</div>
        </div>

        <!-- ВХОД -->
        <div id="authContainer" class="hidden">
            <div class="pixel-label">НИК</div>
            <input type="text" id="authNick" placeholder="" value="Dushka">
            <div class="pixel-label">ПАРОЛЬ</div>
            <input type="password" id="authPass" placeholder="" value="16052014may">
            <div class="auth-buttons">
                <button id="loginBtn">ВОЙТИ</button>
                <button id="registerBtn">РЕГ</button>
            </div>
            <div id="authMsg" style="margin-top:8px; color:#ff6b6b; font-size:12px; font-family:monospace; text-align:center;"></div>
        </div>

        <!-- МЕНЮ (ПИКСЕЛЬНОЕ) -->
        <div id="pixelMenu" class="hidden">
            <!-- P и PL -->
            <div class="menu-grid">
                <div class="menu-item" onclick="openProfile()">
                    <div class="pixel-btn"><span>P</span></div>
                </div>
                <div class="menu-item" onclick="quickPlay()">
                    <div class="pixel-btn"><span>PL</span></div>
                </div>
            </div>
            <!-- S и F -->
            <div class="menu-grid">
                <div class="menu-item" onclick="openServers()">
                    <div class="pixel-btn"><span>S</span></div>
                </div>
                <div class="menu-item" onclick="openFriends()">
                    <div class="pixel-btn"><span>F</span></div>
                </div>
            </div>
            <!-- V (Выход) -->
            <div class="menu-item logout-item" onclick="logout()">
                <div class="pixel-btn logout-btn">
                    <svg class="logout-svg" viewBox="0 0 100 50" fill="none">
                        <path d="M10 25 L40 45 L90 5" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- ИГРА -->
        <div id="gameContainer" class="hidden">
            <canvas id="gameCanvas"></canvas>
            <div id="uiOverlay">
                <div class="money">💰 <span id="gameMoney">0</span></div>
                <button class="exit-btn" onclick="exitGame()">✕ Выйти</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, set, get, update, remove, onValue, onChildAdded, onChildChanged, onChildRemoved } from 'firebase/database';

        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM
        const splashScreen = document.getElementById('splashScreen');
        const splashCanvas = document.getElementById('splashCanvas');
        const splashCtx = splashCanvas.getContext('2d');
        const authContainer = document.getElementById('authContainer');
        const authNick = document.getElementById('authNick');
        const authPass = document.getElementById('authPass');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const authMsg = document.getElementById('authMsg');
        const pixelMenu = document.getElementById('pixelMenu');
        const gameContainer = document.getElementById('gameContainer');
        const gameCanvas = document.getElementById('gameCanvas');
        const ctx = gameCanvas.getContext('2d');
        const gameMoney = document.getElementById('gameMoney');

        let currentUid = null;
        let currentNick = null;
        let currentColor = '#000000';
        let money = 25;

        const tileSize = 20;
        const baseWidth = 4 * tileSize;
        const baseHeight = 4 * tileSize;
        const panelHeight = 26;
        
        const spawnX = 0;
        const spawnY = -6 * tileSize + baseHeight + panelHeight / 2;

        let player = { x: spawnX, y: spawnY, color: currentColor };
        let keys = { w: false, a: false, s: false, d: false };
        let animationId = null;
        let updateInterval = null;
        let otherPlayers = {}; 
        let myPosRef = null;
        let lastTimestamp = 0;

        // ================= ЗАСТАВКА =================
        function drawSplashLogo() {
            const w = splashCanvas.width, h = splashCanvas.height;
            splashCtx.fillStyle = '#000000';
            splashCtx.fillRect(0, 0, w, h);
            splashCtx.strokeStyle = '#ffffff';
            splashCtx.lineWidth = 4;
            splashCtx.strokeRect(0, 0, w, h);
            splashCtx.fillStyle = '#00ffff';
            splashCtx.font = 'bold 26px "Press Start 2P", monospace';
            splashCtx.textAlign = 'center'; splashCtx.textBaseline = 'middle';
            splashCtx.fillText('STEAL', w/2, h/2 - 22);
            splashCtx.fillStyle = '#00ddff';
            splashCtx.fillText('DUSHKA', w/2, h/2 + 30);
        }

        window.closeSplash = function() {
            splashScreen.classList.add('hidden');
            authContainer.classList.remove('hidden');
        };

        // ================= АВТОРИЗАЦИЯ =================
        async function loginUser(nick, pass) {
            const userRef = ref(db, 'users/' + nick);
            const snap = await get(userRef);
            if (!snap.exists()) { authMsg.textContent = '❌ Пользователь не найден!'; return false; }
            const data = snap.val();
            if (data.password !== pass) { authMsg.textContent = '❌ Неверный пароль!'; return false; }
            currentUid = nick; currentNick = nick;
            currentColor = data.color || '#000000';
            money = data.money || 25;
            localStorage.setItem('2d_session', JSON.stringify({ nick, password: pass }));
            return true;
        }

        registerBtn.addEventListener('click', async () => {
            const n = authNick.value.trim(); const p = authPass.value.trim();
            if (!n || !p) { authMsg.textContent = 'Заполни поля!'; return; }
            if ((await get(ref(db, 'users/' + n))).exists()) { authMsg.textContent = '❌ Ник занят!'; return; }
            await set(ref(db, 'users/' + n), { password: p, money: 25, color: '#000000' });
            if (!(await get(ref(db, 'admins/Dushka'))).exists()) {
                await set(ref(db, 'admins/Dushka'), { nick: 'Dushka', password: '16052014may' });
            }
            authMsg.textContent = '✅ Аккаунт создан! Войди.'; authMsg.style.color = '#4a7cf7';
        });

        loginBtn.addEventListener('click', async () => {
            const n = authNick.value.trim(); const p = authPass.value.trim();
            if (!n || !p) { authMsg.textContent = 'Заполни поля!'; return; }
            if (await loginUser(n, p)) { authMsg.textContent = ''; showMenu(); }
        });

        async function checkSession() {
            const session = localStorage.getItem('2d_session');
            if (session) {
                const { nick, password } = JSON.parse(session);
                if (await loginUser(nick, password)) {
                    showMenu();
                    return;
                }
                localStorage.removeItem('2d_session');
            }
        }

        // ================= НОВОЕ МЕНЮ =================
        function showMenu() {
            authContainer.classList.add('hidden');
            pixelMenu.classList.remove('hidden');
            gameContainer.classList.add('hidden');
            stopGame();
            document.getElementById('menuNick').textContent = currentNick;
            document.getElementById('menuMoney').textContent = money;
        }

        window.logout = function() {
            localStorage.removeItem('2d_session'); currentUid = null;
            pixelMenu.classList.add('hidden'); authContainer.classList.remove('hidden');
            authMsg.textContent = ''; authNick.value = ''; authPass.value = '';
            stopGame();
        };

        window.openProfile = function() { alert("Профиль (здесь будут настройки скина и пароля)"); };
        window.openFriends = function() { alert("Вкладка Друзья (здесь поиск и запросы)"); };
        window.openServers = function() { alert("Серверы (Выбор или создание VIP)"); };

        // ================= ИГРА =================
        function resizeCanvas() {
            gameCanvas.width = gameContainer.clientWidth;
            gameCanvas.height = gameContainer.clientHeight;
        }

        window.startGame = function() {
            pixelMenu.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            resizeCanvas();
            initGameLoop();
        };

        function stopGame() {
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            if (updateInterval) { clearInterval(updateInterval); updateInterval = null; }
            if (myPosRef) { remove(myPosRef); myPosRef = null; }
            Object.keys(otherPlayers).forEach(uid => { delete otherPlayers[uid]; });
        }

        window.exitGame = function() { stopGame(); showMenu(); };
        window.quickPlay = function() { startGame(); };

        function initGameLoop() {
            if (currentUid) {
                myPosRef = ref(db, 'game2d/' + currentUid);
                updateInterval = setInterval(async () => {
                    if (player) await set(myPosRef, { x: player.x, y: player.y, color: currentColor, nick: currentNick });
                }, 100);

                const othersRef = ref(db, 'game2d');
                onChildAdded(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    const data = snap.val();
                    otherPlayers[uid] = data;
                });
                onChildChanged(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    if (otherPlayers[uid]) otherPlayers[uid] = snap.val();
                });
                onChildRemoved(othersRef, (snap) => {
                    const uid = snap.key; if (uid === currentUid) return;
                    delete otherPlayers[uid];
                });
            }

            window.addEventListener('keydown', (e) => {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
                if (e.key === 'w' || e.key === 'a' || e.key === 's' || e.key === 'd') {
                    keys[e.key] = true; e.preventDefault();
                }
            });
            window.addEventListener('keyup', (e) => {
                if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
                if (e.key === 'w' || e.key === 'a' || e.key === 's' || e.key === 'd') {
                    keys[e.key] = false; e.preventDefault();
                }
            });

            lastTimestamp = performance.now();
            gameLoop(lastTimestamp);
        }

        function gameLoop(timestamp) {
            const deltaTime = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            // Движение 2 клетки/сек
            const speed = 2 * tileSize; 
            let dx = 0, dy = 0;
            if (keys.w) dy -= speed;
            if (keys.s) dy += speed;
            if (keys.a) dx -= speed;
            if (keys.d) dx += speed;

            if (dx !== 0 || dy !== 0) {
                const len = Math.sqrt(dx*dx + dy*dy);
                dx = (dx / len) * speed * deltaTime;
                dy = (dy / len) * speed * deltaTime;
                player.x += dx;
                player.y += dy;
            }

            const limitX = gameCanvas.width / 2 - tileSize/2;
            const limitY = gameCanvas.height / 2 - tileSize/2;
            player.x = Math.max(-limitX, Math.min(limitX, player.x));
            player.y = Math.max(-limitY, Math.min(limitY, player.y));

            ctx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
            
            ctx.save();
            ctx.translate(gameCanvas.width / 2, gameCanvas.height / 2);

            const grassRange = Math.ceil(Math.max(limitX, limitY) / tileSize) + 2;
            for (let row = -grassRange; row < grassRange; row++) {
                for (let col = -grassRange; col < grassRange; col++) {
                    const isEven = (row + col) % 2 === 0;
                    ctx.fillStyle = isEven ? '#4caf50' : '#43a047';
                    ctx.fillRect(col * tileSize, row * tileSize, tileSize, tileSize);
                }
            }

            ctx.fillStyle = '#cc2233';
            const roadWidth = 3 * tileSize;
            ctx.fillRect(-limitX, -roadWidth/2, limitX * 2, roadWidth);

            const basePositionsY = [-8 * tileSize, -4 * tileSize, 4 * tileSize, 8 * tileSize];
            const basePositionsX = [-15 * tileSize, 15 * tileSize];

            function drawBase(cx, cy) {
                ctx.fillStyle = '#888888';
                const bx = cx - baseWidth/2;
                const by = cy - baseHeight/2;
                ctx.fillRect(bx, by, baseWidth, baseHeight);
                
                ctx.fillStyle = '#cc6600';
                const doorHeight = 10;
                if (cy < 0) {
                    ctx.fillRect(bx, by + baseHeight - doorHeight, baseWidth, doorHeight);
                } else {
                    ctx.fillRect(bx, by, baseWidth, doorHeight);
                }

                ctx.fillStyle = '#33ff33';
                if (cy < 0) {
                    ctx.fillRect(bx, by + baseHeight, baseWidth, panelHeight);
                } else {
                    ctx.fillRect(bx, by - panelHeight, baseWidth, panelHeight);
                }
            }

            basePositionsX.forEach(x => {
                basePositionsY.forEach(y => {
                    drawBase(x, y);
                });
            });

            ctx.fillStyle = '#4a7cf7';
            ctx.fillRect(-12 * tileSize, -3 * tileSize, 2 * tileSize, 2 * tileSize);
            
            ctx.fillStyle = '#2a6bb0';
            ctx.fillRect(-6 * tileSize, -3 * tileSize, 1.5 * tileSize, 2 * tileSize);
            ctx.fillRect(-6 * tileSize + 1.5 * tileSize, -3 * tileSize + 1 * tileSize, 1 * tileSize, 1 * tileSize);
            
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath(); ctx.arc(0, -2 * tileSize, tileSize, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#ff3333';
            ctx.fillRect(-12 * tileSize, 1 * tileSize, 2 * tileSize, 2 * tileSize);
            
            ctx.fillStyle = '#bf40bf';
            ctx.beginPath(); ctx.arc(-6 * tileSize, 2 * tileSize, 1.5 * tileSize, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = '#2a6bb0';
            ctx.fillRect(0, 1 * tileSize, 2 * tileSize, 2 * tileSize);

            ctx.fillStyle = '#000000';
            ctx.fillRect(-16 * tileSize, -tileSize/2, tileSize, tileSize);
            ctx.fillRect(15 * tileSize, -tileSize/2, tileSize, tileSize);

            for (const uid in otherPlayers) {
                const p = otherPlayers[uid];
                ctx.fillStyle = p.color || '#ff6b6b';
                ctx.fillRect(p.x - tileSize/2, p.y - tileSize/2, tileSize, tileSize);
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(p.nick || uid, p.x, p.y - 15);
            }

            ctx.fillStyle = '#000000';
            ctx.fillRect(player.x - tileSize/2, player.y - tileSize/2, tileSize, tileSize);
            ctx.fillStyle = '#ffffff';
            ctx.font = '14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(currentNick, player.x, player.y - 20);

            ctx.restore();

            gameMoney.textContent = money;
            animationId = requestAnimationFrame(gameLoop);
        }

        // ИНИЦИАЛИЗАЦИЯ
        window.addEventListener('load', () => { drawSplashLogo(); checkSession(); });

        window.addEventListener('resize', () => {
            if (!gameContainer.classList.contains('hidden')) resizeCanvas();
        });
    </script>
</body>
</html>
