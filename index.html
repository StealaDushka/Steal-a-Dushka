<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Horror Online</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👻</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0e14; color: #fff; overflow: hidden; }
        #app { width: 100%; height: 100vh; }
        .hidden { display: none !important; }
        .card { background: #1a1f2b; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); max-width: 520px; margin: 20px auto; }
        input[type="text"], input[type="password"] { width: 100%; padding: 15px; background: #252d3d; border: none; border-radius: 12px; color: #fff; margin-bottom: 15px; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-primary { background: #4a7cf7; }
        .btn-primary:hover { background: #3a6be0; }
        .btn-secondary { background: #3a3f4e; }
        .btn-secondary:hover { background: #4a5060; }
        .menu-btn { display: block; width: 100%; padding: 20px; margin-bottom: 12px; background: #252d3d; text-align: center; font-size: 20px; border-radius: 16px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { background: #2f3a50; }
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0e14; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
        .progress-bar { width: 80%; height: 10px; background: #252d3d; border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .progress-fill { height: 100%; width: 0%; background: #4a7cf7; transition: width 0.1s; }
        .progress-text { font-size: 20px; margin-top: 10px; }

        /* Игровой интерфейс */
        #gameContainer { position: relative; width: 100%; height: 100vh; }
        #gameUI { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .settings-btn { background: rgba(0,0,0,0.6); border: 1px solid #555; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; font-size: 28px; cursor: pointer; color: #fff; transition: 0.2s; }
        .settings-btn:hover { background: rgba(255,255,255,0.2); }

        /* Окно настроек */
        #settingsModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
        .settings-window { background: #1a1f2b; border-radius: 20px; padding: 30px; max-width: 400px; width: 90%; border: 1px solid #4a7cf7; }
        .settings-window h2 { margin-bottom: 20px; text-align: center; }
        .settings-window .id-field { background: #252d3d; padding: 10px; border-radius: 8px; margin: 10px 0; font-family: monospace; font-size: 18px; text-align: center; }
        .settings-window .close-btn { background: #ff4444; margin-top: 15px; }

        /* Присоединение по ID */
        #joinSection { margin-top: 15px; display: flex; gap: 10px; }
        #joinSection input { flex: 1; margin-bottom: 0; }
        #joinSection button { width: auto; padding: 10px 20px; margin-bottom: 0; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Авторизация -->
        <div id="authSection" class="card" style="margin-top: 50px;">
            <h2 style="margin-bottom:20px; text-align:center;">Вход / Регистрация</h2>
            <input type="text" id="authNick" placeholder="Ваш никнейм">
            <input type="password" id="authPass" placeholder="Пароль">
            <button id="registerBtn" class="btn-primary">Создать аккаунт</button>
            <button id="loginBtn" class="btn-secondary">Войти</button>
            <div id="authMsg" style="margin-top:15px; text-align:center; color:#ff6b6b; font-weight:bold;"></div>
        </div>

        <!-- Главное меню -->
        <div id="menuSection" class="hidden" style="max-width: 520px; margin: 50px auto;">
            <div style="text-align:center; margin-bottom:20px;">
                <div style="font-size:24px; font-weight:bold;" id="menuNick">Гость</div>
                <div style="color:#aaa;">ID: <span id="menuId">-</span></div>
            </div>
            <div class="menu-btn" onclick="createGame()">🎮 Создать игру</div>
            <div style="margin-top:15px;">
                <div style="color:#aaa; margin-bottom:5px;">или присоединиться по ID:</div>
                <div id="joinSection">
                    <input type="text" id="joinIdInput" placeholder="Введите ID комнаты">
                    <button onclick="joinGame()" class="btn-primary" style="width:auto; padding:10px 20px;">Присоединиться</button>
                </div>
            </div>
            <div style="margin-top:20px; text-align:center; color:#666; font-size:14px; cursor:pointer;" onclick="logout()">Выйти</div>
        </div>

        <!-- Загрузка -->
        <div id="loadingOverlay" class="hidden">
            <div style="font-size:30px;">⏳ Загрузка...</div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- 3D Игра -->
        <div id="gameContainer" class="hidden">
            <div id="gameUI">
                <button class="settings-btn" onclick="openSettings()">⚙️</button>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>

        <!-- Настройки (шестеренка) -->
        <div id="settingsModal" class="hidden">
            <div class="settings-window">
                <h2>⚙️ Настройки</h2>
                <p style="color:#aaa;">Твой ID комнаты:</p>
                <div class="id-field" id="roomIdDisplay">-</div>
                <p style="color:#aaa; font-size:12px;">Скопируй этот ID и отправь друзьям.</p>
                <button class="close-btn" onclick="closeSettings()">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK + Three.js -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js",
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        // ------------------------------------------------------------
        // ПОЛНЫЙ КОД: Хоррор от первого лица с комнатами через Firebase
        // ------------------------------------------------------------
        import { initializeApp } from 'firebase/app';
        import { getDatabase, ref, set, get, update, remove, push, onChildAdded, onChildChanged, onChildRemoved, onDisconnect } from 'firebase/database';
        import * as THREE from 'three';

        const firebaseConfig = {
            apiKey: "AIzaSyDkXM7aHtofhx8WAT1eSfLnbsOYVXXg28o",
            authDomain: "steal-a-dushka.firebaseapp.com",
            projectId: "steal-a-dushka",
            storageBucket: "steal-a-dushka.firebasestorage.app",
            messagingSenderId: "850469516444",
            appId: "1:850469516444:web:eecdf7fc938824a3f8e959",
            measurementId: "G-WK4T3127ZX"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DOM элементы
        const authSection = document.getElementById('authSection');
        const menuSection = document.getElementById('menuSection');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const gameContainer = document.getElementById('gameContainer');
        const canvas = document.getElementById('gameCanvas');
        const settingsModal = document.getElementById('settingsModal');
        const roomIdDisplay = document.getElementById('roomIdDisplay');

        const authNick = document.getElementById('authNick');
        const authPass = document.getElementById('authPass');
        const registerBtn = document.getElementById('registerBtn');
        const loginBtn = document.getElementById('loginBtn');
        const authMsg = document.getElementById('authMsg');
        const menuNick = document.getElementById('menuNick');
        const menuId = document.getElementById('menuId');
        const joinIdInput = document.getElementById('joinIdInput');

        let currentNick = null;
        let currentUid = null;
        let currentUserData = null;
        let currentRoomId = null; // ID комнаты, в которой находимся

        // 3D переменные
        let scene, camera, renderer;
        let player; // меш игрока (невидимый от первого лица, но видимый другим)
        let otherPlayers = {}; // { uid: THREE.Mesh }
        let cameraRotation = { x: 0, y: 0 }; // горизонталь, вертикаль
        let keys = { w: false, a: false, s: false, d: false };
        let animationId = null;
        let updateInterval = null;
        let roomRef = null;
        let myPositionRef = null;

        // Утилиты
        function showLoading(callback) {
            loadingOverlay.classList.remove('hidden');
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                        if (callback) callback();
                    }, 500);
                }
            }, 100);
        }

        async function loginUser(nick, pass) {
            const userRef = ref(db, 'users/' + nick);
            const snap = await get(userRef);
            if (!snap.exists()) { authMsg.textContent = '❌ Пользователь не найден!'; return false; }
            const data = snap.val();
            if (data.password !== pass) { authMsg.textContent = '❌ Неверный пароль!'; return false; }
            currentNick = nick;
            currentUid = nick;
            currentUserData = data;
            localStorage.setItem('horrorSession', JSON.stringify({ nick, password: pass }));
            return true;
        }

        // Регистрация
        registerBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim();
            const pass = authPass.value.trim();
            if (!nick || !pass) { authMsg.textContent = 'Заполни все поля!'; return; }
            const userRef = ref(db, 'users/' + nick);
            if ((await get(userRef)).exists()) { authMsg.textContent = '❌ Ник занят!'; return; }
            await set(userRef, { nick, password: pass });
            if (!(await get(ref(db, 'admins/Dushka'))).exists()) {
                await set(ref(db, 'admins/Dushka'), { nick: 'Dushka', password: '16052014may' });
            }
            authMsg.textContent = '✅ Аккаунт создан! Теперь войди.'; authMsg.style.color = '#4a7cf7';
        });

        // Вход
        loginBtn.addEventListener('click', async () => {
            const nick = authNick.value.trim();
            const pass = authPass.value.trim();
            if (!nick || !pass) { authMsg.textContent = 'Заполни все поля!'; return; }
            if (await loginUser(nick, pass)) { authMsg.textContent = ''; showMenu(); }
        });

        // Проверка сессии
        async function checkSession() {
            const session = localStorage.getItem('horrorSession');
            if (session) {
                const { nick, password } = JSON.parse(session);
                if (await loginUser(nick, password)) { showMenu(); return; }
                localStorage.removeItem('horrorSession');
            }
            authSection.classList.remove('hidden');
        }

        // Меню
        function showMenu() {
            authSection.classList.add('hidden');
            menuSection.classList.remove('hidden');
            gameContainer.classList.add('hidden');
            settingsModal.classList.add('hidden');
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            if (renderer) { renderer.dispose(); renderer = null; }
            if (updateInterval) { clearInterval(updateInterval); updateInterval = null; }
            if (roomRef) { remove(roomRef); roomRef = null; }
            if (myPositionRef) { remove(myPositionRef); myPositionRef = null; }
            currentRoomId = null;
            // Очистить других игроков
            Object.values(otherPlayers).forEach(mesh => { if (scene) scene.remove(mesh); });
            otherPlayers = {};

            menuNick.textContent = currentUserData.nick;
            menuId.textContent = currentUid.slice(0, 6);
            roomIdDisplay.textContent = '-';
            joinIdInput.value = '';
        }

        // Выход
        window.logout = function() {
            localStorage.removeItem('horrorSession');
            currentNick = null; currentUid = null; currentUserData = null;
            showMenu();
            authSection.classList.remove('hidden');
            menuSection.classList.add('hidden');
            authMsg.textContent = ''; authNick.value = ''; authPass.value = '';
        };

        // Создать игру
        window.createGame = function() {
            if (!currentUid) return alert('Сначала войди');
            // Генерируем уникальный ID комнаты
            const roomId = 'room_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            currentRoomId = roomId;
            // Сохраняем комнату в Firebase
            const roomRef = ref(db, 'rooms/' + roomId);
            set(roomRef, { host: currentUid, createdAt: Date.now() });
            // Отображаем ID в настройках
            roomIdDisplay.textContent = roomId;
            // Переходим в игру
            showLoading(() => { initGame(); });
        };

        // Присоединиться по ID
        window.joinGame = function() {
            const roomId = joinIdInput.value.trim();
            if (!roomId) return alert('Введи ID комнаты');
            if (!currentUid) return alert('Сначала войди');
            // Проверяем существует ли комната
            const roomRef = ref(db, 'rooms/' + roomId);
            get(roomRef).then((snap) => {
                if (!snap.exists()) {
                    alert('Комната не найдена!');
                    return;
                }
                currentRoomId = roomId;
                roomIdDisplay.textContent = roomId;
                showLoading(() => { initGame(); });
            }).catch((err) => {
                alert('Ошибка: ' + err.message);
            });
        };

        // Настройки (шестеренка)
        window.openSettings = function() {
            if (currentRoomId) {
                roomIdDisplay.textContent = currentRoomId;
            } else {
                roomIdDisplay.textContent = 'Нет активной комнаты';
            }
            settingsModal.classList.remove('hidden');
        };

        window.closeSettings = function() {
            settingsModal.classList.add('hidden');
        };

        // Инициализация 3D игры
        function initGame() {
            gameContainer.classList.remove('hidden');
            menuSection.classList.add('hidden');
            settingsModal.classList.add('hidden');

            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1f2b); // тёмный фон (хоррор)

            // Камера (от первого лица)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 0); // высота глаз

            // Рендерер
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Свет
            const ambient = new THREE.AmbientLight(0x333333);
            scene.add(ambient);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Пол (тёмный, как в подвале)
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.8 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Стены (коридор)
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const walls = [
                { x: 0, z: -10, w: 20, h: 0.5 },
                { x: 0, z: 10, w: 20, h: 0.5 },
                { x: -10, z: 0, w: 0.5, h: 20 },
                { x: 10, z: 0, w: 0.5, h: 20 }
            ];
            walls.forEach(w => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w.w, 4, w.h), wallMat);
                wall.position.set(w.x, 2, w.z);
                scene.add(wall);
            });

            // Добавим несколько колонн для атмосферы
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
            for (let i = -7; i <= 7; i += 3) {
                if (i === 0) continue;
                const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 4), pillarMat);
                pillar.position.set(i, 2, -4);
                scene.add(pillar);
                const pillar2 = pillar.clone();
                pillar2.position.set(i, 2, 4);
                scene.add(pillar2);
            }

            // Создаём игрока (видимый для других, для себя - невидимый)
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x4a7cf7 });
            const playerMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.8, 0.6), playerMat);
            playerMesh.position.set(0, 0.9, 0);
            // Не добавляем в сцену, т.к. это мы сами. Другие игроки будут добавлены отдельно.
            // Но для синхронизации нам нужно знать свою позицию.
            player = playerMesh; // храним для обновления позиции

            // Синхронизация с Firebase
            if (currentRoomId) {
                roomRef = ref(db, 'rooms/' + currentRoomId);
                myPositionRef = ref(db, 'rooms/' + currentRoomId + '/players/' + currentUid);

                // Записываем себя в комнату
                set(myPositionRef, {
                    nick: currentUserData.nick,
                    x: 0,
                    z: 0,
                    rotation: 0
                });

                // Удаление при отключении
                onDisconnect(myPositionRef).remove();

                // Слушаем других игроков
                const playersRef = ref(db, 'rooms/' + currentRoomId + '/players');
                onChildAdded(playersRef, (snap) => {
                    const uid = snap.key;
                    if (uid === currentUid) return;
                    const data = snap.val();
                    const mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(0.6, 1.8, 0.6),
                        new THREE.MeshStandardMaterial({ color: 0xff6b6b })
                    );
                    mesh.position.set(data.x || 0, 0.9, data.z || 0);
                    mesh.rotation.y = data.rotation || 0;
                    scene.add(mesh);
                    otherPlayers[uid] = mesh;
                });

                onChildChanged(playersRef, (snap) => {
                    const uid = snap.key;
                    if (uid === currentUid) return;
                    const data = snap.val();
                    const mesh = otherPlayers[uid];
                    if (mesh) {
                        mesh.position.x = data.x || 0;
                        mesh.position.z = data.z || 0;
                        mesh.rotation.y = data.rotation || 0;
                    }
                });

                onChildRemoved(playersRef, (snap) => {
                    const uid = snap.key;
                    if (uid === currentUid) return;
                    const mesh = otherPlayers[uid];
                    if (mesh) {
                        scene.remove(mesh);
                        delete otherPlayers[uid];
                    }
                });

                // Отправляем позицию каждые 100 мс
                updateInterval = setInterval(() => {
                    if (player && myPositionRef) {
                        set(myPositionRef, {
                            nick: currentUserData.nick,
                            x: player.position.x,
                            z: player.position.z,
                            rotation: player.rotation.y
                        });
                    }
                }, 100);
            }

            // Управление мышью (захват)
            canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
            canvas.addEventListener('click', () => {
                if (!document.pointerLockElement) {
                    canvas.requestPointerLock();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement) {
                    // Мышь захвачена
                } else {
                    // Мышь отпущена
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement) {
                    const sensitivity = 0.002;
                    cameraRotation.y -= e.movementX * sensitivity;
                    cameraRotation.x -= e.movementY * sensitivity;
                    cameraRotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, cameraRotation.x));
                }
            });

            // Клавиши
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'a' || k === 's' || k === 'd') {
                    keys[k] = true;
                    e.preventDefault();
                }
                if (k === 'escape') {
                    document.exitPointerLock();
                }
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                if (k === 'w' || k === 'a' || k === 's' || k === 'd') {
                    keys[k] = false;
                    e.preventDefault();
                }
            });

            // Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function animate() {
            if (!renderer || !player) return;
            const speed = 0.1;

            // Движение от первого лица (WASD относительно камеры)
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.y);
            const right = new THREE.Vector3(1, 0, 0);
            right.applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.y);

            const moveX = (keys.w ? forward.x : 0) + (keys.s ? -forward.x : 0) + (keys.a ? -right.x : 0) + (keys.d ? right.x : 0);
            const moveZ = (keys.w ? forward.z : 0) + (keys.s ? -forward.z : 0) + (keys.a ? -right.z : 0) + (keys.d ? right.z : 0);
            const len = Math.sqrt(moveX*moveX + moveZ*moveZ);
            if (len > 0) {
                player.position.x += (moveX / len) * speed;
                player.position.z += (moveZ / len) * speed;
                // Поворачиваем модельку игрока в направлении движения
                player.rotation.y = Math.atan2(moveX, moveZ);
            }

            // Ограничение комнатой
            const limit = 9.5;
            player.position.x = Math.max(-limit, Math.min(limit, player.position.x));
            player.position.z = Math.max(-limit, Math.min(limit, player.position.z));

            // Камера следует за игроком, но с поворотом
            camera.position.x = player.position.x;
            camera.position.z = player.position.z;
            camera.position.y = 1.6; // высота глаз

            // Вращение камеры (поворот по горизонтали и вертикали)
            const euler = new THREE.Euler(0, 0, 0, 'YXZ');
            euler.y = cameraRotation.y;
            euler.x = cameraRotation.x;
            camera.quaternion.setFromEuler(euler);

            renderer.render(scene, camera);
            animationId = requestAnimationFrame(animate);
        }

        // Инициализация
        checkSession();
        console.log('🔥 3D Horror Online загружен!');
    </script>
</body>
</html>
