  });

async function assignBase(){
  const snap=await db.ref('servers/'+currentServerId+'/bases').once('value');
  const bases=snap.val()||{}; const taken=new Set();
  for(let b in bases){ taken.add(parseInt(b)); }
  for(let i=1;i<=8;i++){ if(!taken.has(i)) return i; } return 1;
}

function updateConveyor(dt){
  const now=Date.now();
  if(now-lastConveyorSpawn>SPAWN_INTERVAL){ lastConveyorSpawn=now; spawnConveyor(); }
  for(let i=conveyorBrainrots.length-1;i>=0;i--){
    const b=conveyorBrainrots[i]; if(b.locked) continue;
    b.x+=CONVEYOR_SPEED*60*dt; b.dom.style.left=b.x+'px';
    if(b.x>=384){ b.dom.remove(); conveyorBrainrots.splice(i,1); }
  }
}
async function buyConveyor(b){
  if(mySlots.filter(s=>s).length>=BASE_MAX){ showModal('Ошибка','База полна!'); return; }
  if(coins<b.brainrot.price){ showModal('Ошибка','Нужно $'+formatNumber(b.brainrot.price)); return; }

  coins-=b.brainrot.price; document.getElementById('balance-amount').textContent=formatNumber(coins);
  b.locked=true; b.dom.remove(); const idx=conveyorBrainrots.indexOf(b); if(idx>-1) conveyorBrainrots.splice(idx,1);
  mySlots[free]={file:b.brainrot.file,name:b.brainrot.name,rarity:b.brainrot.rarity,income:b.brainrot.income,price:b.brainrot.price,placedAt:Date.now()};
  await db.ref('users/'+currentNickname).update({coins:coins,baseSlots:mySlots});
  await db.ref('servers/'+currentServerId+'/bases/'+myBaseId+'/slots').set(mySlots);
  showModal('Куплено',b.brainrot.name+' -$'+formatNumber(b.brainrot.price));
}

const keys={w:false,s:false,a:false,d:false,arrowup:false,arrowdown:false,arrowleft:false,arrowright:false};
let touchDX=0,touchDY=0,joystickManager=null;
function initJoystick(){
  const z=document.getElementById('joystick-zone'); z.style.display='block';
  if(typeof nipplejs==='undefined') return;
  joystickManager=nipplejs.create({zone:z,mode:'static',position:{left:'50%',top:'50%'},color:'white',size:100,restOpacity:0.5,fadeTime:150});
  joystickManager.on('move',(e,d)=>{const f=Math.min(d.force,1);touchDX=Math.cos(d.angle.radian)*f;touchDY=-Math.sin(d.angle.radian)*f;});

}

function removeEHint(){ const e=document.querySelector('.e-hint'); if(e)e.remove(); }

async function executeHoldE(){
  if(!currentTarget) return;
  if(currentTarget.type==='slot_mine_full'){
    const idx=currentTarget.slot;
    const free=mySlots.findIndex(s=>s===null);
    if(free<0){ showModal('Ошибка','Нет свободных'); return; }
    const br=mySlots[idx]; mySlots[idx]=null; mySlots[free]=br;
    await db.ref('users/'+currentNickname).update({baseSlots:mySlots});
    await db.ref('servers/'+currentServerId+'/bases/'+myBaseId+'/slots').set(mySlots);
    showModal('Перенесено',br.name+' → слот '+(free+1));
  } else if(currentTarget.type==='slot_other_full'){
    const bid=currentTarget.baseId, idx=currentTarget.slot;
    const bdata=allBasesData[bid]; if(!bdata||bdata.locked){ showModal('Ошибка','База закрыта'); return; }
    const br=bdata.slots[idx]; if(!br) return;
    const free=mySlots.findIndex(s=>s===null); if(free<0){ showModal('Ошибка','Нет слота'); return; }
    const newSlots=bdata.slots.slice(); newSlots[idx]=null;
    await db.ref('servers/'+currentServerId+'/bases/'+bid+'/slots').set(newSlots);
    mySlots[free]={...br,placedAt:Date.now()};
    await db.ref('users/'+currentNickname).update({baseSlots:mySlots});
    await db.ref('servers/'+currentServerId+'/bases/'+myBaseId+'/slots').set(mySlots);
    await db.ref('users/'+bdata.owner+'/notifications').transaction(cur=>{ const arr=cur||[]; arr.push({text:'⚠️ У тебя украли '+br.name+'!',ts:Date.now()}); return arr; });
    showModal('Кража!','Украл: '+br.name);
  }
}
function startFHold(){

async function executeHoldF(){

document.addEventListener('keydown',e=>{
  const k=String(e.key||'').toLowerCase(); if(!k) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(k==='w'||k==='ц'||k==='arrowup'){keys.w=true;e.preventDefault()}
  if(k==='s'||k==='ы'||k==='arrowdown'){keys.s=true;e.preventDefault()}
  if(k==='a'||k==='ф'||k==='arrowleft'){keys.a=true;e.preventDefault()}
  if(k==='d'||k==='в'||k==='arrowright'){keys.d=true;e.preventDefault()}

  if(k==='f'||k==='а'){ if(!fHoldActive) startFHold(); }
});
document.addEventListener('keyup',e=>{
  const k=String(e.key||'').toLowerCase(); if(!k) return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(k==='w'||k==='ц'||k==='arrowup'){keys.w=false;e.preventDefault()}

  if(k==='f'||k==='а'){ removeFHold(); }
});
function quickE(){
  if(!currentTarget) return;

  else if(currentTarget.type==='green_mine') openFloor(myBaseId);
  else if(currentTarget.type==='green_other') openFloor(currentTarget.baseId);
  else if(currentTarget.type==='locked_other') showModal('База закрыта','Эта база закрыта владельцем');
  else if(currentTarget.type==='slot_mine_full') openBaseMenu();
}

async function toggleFloorLock(){

// ===== ИГРОВОЙ ЦИКЛ =====
let lastTime=0;
function update(t=0){
  requestAnimationFrame(update);
  const dt=Math.min((t-lastTime)/1000,0.1); lastTime=t;
  let dx=0,dy=0;
  if(keys.w)dy-=1; if(keys.s)dy+=1; if(keys.a)dx-=1; if(keys.d)dx+=1;
  if(Math.abs(touchDX)>0.05||Math.abs(touchDY)>0.05){dx+=touchDX;dy+=touchDY;}
  if(dx!==0||dy!==0){
    const len=Math.sqrt(dx*dx+dy*dy);
    if(inFloor){ fx+=(dx/len)*2; fy+=(dy/len)*2; fx=Math.max(20,Math.min(370,fx)); fy=Math.max(30,Math.min(370,fy)); renderFloorPlayer(); }
    else { x+=(dx/len)*2; y+=(dy/len)*2; x=Math.max(10,Math.min(390,x)); y=Math.max(10,Math.min(390,y)); document.getElementById('player').style.left=x+'px'; document.getElementById('player').style.top=y+'px'; if(currentServerId) db.ref('servers/'+currentServerId+'/players/'+currentNickname).update({x:x,y:y}); }
  }
  if(!inFloor){ updateConveyor(dt); updateTarget(); } else { updateFloorTarget(); }
}
function updateTarget(){
  const pc={x:x+4,y:y+8}; currentTarget=null; removeEHint();
  for(const b of conveyorBrainrots){ if(b.locked)continue; const d=Math.hypot(pc.x-(b.x+14),pc.y-(b.y+14)); if(d<25){ currentTarget={type:'conveyor',target:b}; showEHint(); return; } }
  const bp=BASE_POSITIONS[myBaseId];
  if(bp){
    const gx=bp.x+40, gy=bp.y+72;
    if(Math.hypot(pc.x-gx,pc.y-gy)<25){ currentTarget={type:'green_mine'}; showEHint(); return; }
    for(let i=0;i<10;i++){ const off=SLOT_OFFSETS[i]; const sx=bp.x+off.dx+7, sy=bp.y+off.dy+7; if(Math.hypot(pc.x-sx,pc.y-sy)<14){ currentTarget={type:mySlots[i]?'slot_mine_full':'slot_empty_mine',slot:i,baseId:myBaseId}; showEHint(); return; } }
  }
  for(let bid in allBasesData){
    const id=parseInt(bid); if(id===myBaseId) continue;
    const bdata=allBasesData[bid]; const obp=BASE_POSITIONS[id]; if(!obp) continue;
    const gx=obp.x+40, gy=obp.y+72;
    if(Math.hypot(pc.x-gx,pc.y-gy)<25){ currentTarget={type:bdata.locked?'locked_other':'green_other',baseId:id}; showEHint(); return; }
    for(let i=0;i<10;i++){ const off=SLOT_OFFSETS[i]; const sx=obp.x+off.dx+7, sy=obp.y+off.dy+7; if(Math.hypot(pc.x-sx,pc.y-sy)<14){ if(bdata.locked) currentTarget={type:'locked_other',baseId:id}; else if(bdata.slots&&bdata.slots[i]) currentTarget={type:'slot_other_full',slot:i,baseId:id}; else currentTarget={type:'slot_empty_other',slot:i,baseId:id}; showEHint(); return; } }
  }
}
function updateFloorTarget(){
  const pc={x:fx+4,y:fy+8}; currentTarget=null; removeEHint();
  for(let i=0;i<10;i++){
    const off=FLOOR_SLOT_OFFSETS[i]; const sx=off.dx+15, sy=off.dy+15;
    if(Math.hypot(pc.x-sx,pc.y-sy)<25){
      if(floorSlots[i]) currentTarget={type:'floor_slot_full',slot:i};
      else currentTarget={type:'floor_slot_empty',slot:i};
      showEHint(); return;
    }
  }
}

// ===== МЕНЮ БАЗЫ =====
function openBaseMenu(){
  const c=document.getElementById('bm-list'); c.innerHTML='';
  const totalIncome=mySlots.reduce((s,br)=>s+(br?br.income:0),0);
  const info=document.createElement('div'); info.className='bm-info';
  info.textContent='Брэинротов: '+mySlots.filter(s=>s).length+'/10 | Доход: $'+formatNumber(totalIncome)+'/сек';
  c.appendChild(info);
  if(mySlots.filter(s=>s).length===0){
    const e=document.createElement('div'); e.className='bm-empty'; e.textContent='Пока нет брэинротов'; c.appendChild(e);
  } else {
    mySlots.forEach((br,i)=>{
      if(!br) return;
      const t=Math.floor((Date.now()-(br.placedAt||Date.now()))/1000);
      const earned=Math.floor(t*br.income);
      const row=document.createElement('div'); row.className='bm-row';
      row.innerHTML=`<div class="icon" style="background-image:url('Картинки/${br.file}')"></div><div class="info"><div class="name">${br.name}</div><div class="line">${RARITY_NAMES[br.rarity]} · $${formatNumber(br.income)}/сек</div><div class="line">На базе: ${t} сек</div><div class="earned">+$${formatNumber(earned)}</div></div><button class="collect" onclick="collectFrom(${i})">Забрать</button>`;
      c.appendChild(row);
    });
  }
  document.getElementById('base-menu').style.display='block';
}
function closeBaseMenu(){ document.getElementById('base-menu').style.display='none'; }
async function collectFrom(i){
  const br=mySlots[i]; if(!br) return;
  const t=Math.floor((Date.now()-(br.placedAt||Date.now()))/1000);
  const earned=Math.floor(t*br.income);
  if(earned<=0){ showModal('Пусто','Ещё не заработал'); return; }
  coins+=earned; br.placedAt=Date.now();
  document.getElementById('balance-amount').textContent=formatNumber(coins);
  await db.ref('users/'+currentNickname).update({coins:coins,baseSlots:mySlots});
  await db.ref('servers/'+currentServerId+'/bases/'+myBaseId+'/slots').set(mySlots);
  openBaseMenu(); showModal('Собрано','+$'+formatNumber(earned));
}

async function exitToMenu(){
  if(currentServerId && currentNickname){ try{ await db.ref('servers/'+currentServerId+'/players/'+currentNickname).remove(); }catch(e){} }
  conveyorBrainrots.forEach(b=>b.dom.remove()); conveyorBrainrots=[];
  for(let k in otherPlayers){ otherPlayers[k].remove(); } otherPlayers={};
  removeEHint(); removeHHold(); removeFHold(); closeFloorCleanup();
  document.getElementById('app').style.display='none';
  document.getElementById('exit-btn').style.display='none';
  document.getElementById('balance').style.display='none';
  document.getElementById('main-menu').style.display='flex';
}
window.addEventListener('load',()=>{ resizeGame(); });
</script>
