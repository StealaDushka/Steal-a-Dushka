async function playRandom(){

  let chosen=null;
  for(let id in servers){const p=await db.ref('servers/'+id+'/players').once('value');if(Object.keys(p.val()||{}).length<8){chosen=id;break;}}
  if(!chosen){const n=db.ref('servers').push();chosen=n.key;await n.set({name:'Тони Старк',access:'all'});}
  currentServerId=chosen;
  await db.ref('users/'+currentNickname).update({serverId:chosen});
  startGame();
}

async function startGame(){
  document.getElementById('main-menu').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('exit-btn').style.display='block';
  document.getElementById('balance').style.display='flex';
  document.getElementById('version').style.display='block';
  const d=await readUserData(currentNickname);
  coins=d.coins||25; dushka=d.dushka||0; myBaseId=d.baseId||0; myBaseLocked=d.baseLocked||false; mySlots=d.baseSlots||new Array(10).fill(null);
  ownedItems=d.ownedItems||[];
  autoBuyShopItems=d.autoBuyShopItems||[];
  ownedRedItems=d.ownedRedItems||[];
  document.getElementById('balance-amount').textContent=formatNumber(coins);
  document.getElementById('dushka-coins').textContent=formatNumber(dushka);
  if(!myBaseId){myBaseId=await assignBase();await db.ref('users/'+currentNickname).update({baseId:myBaseId});}
  await db.ref('servers/'+currentServerId+'/bases/'+myBaseId).set({owner:currentNickname,slots:mySlots,locked:myBaseLocked});
  await loadAllBases();
  const spawn=BASE_SPAWN[myBaseId]; x=spawn.x; y=spawn.y;
  renderPlayer(); renderAllBases(); renderBaseSlots();
  db.ref('servers/'+currentServerId+'/bases').on('value',snap=>{allBasesData=snap.val()||{};renderAllBases();});
  db.ref('servers/'+currentServerId+'/players').on('value',snap=>{renderOtherPlayers(snap.val()||{});});
  db.ref('users/'+currentNickname+'/baseSlots').on('value',snap=>{mySlots=snap.val()||mySlots;renderBaseSlots();});
  db.ref('users/'+currentNickname+'/coins').on('value',snap=>{const c=snap.val()||0;if(c>coins)coins=c;document.getElementById('balance-amount').textContent=formatNumber(coins);tryAutoBuy();});
  db.ref('users/'+currentNickname+'/dushka').on('value',snap=>{const c=snap.val()||0;if(c>dushka)dushka=c;document.getElementById('dushka-coins').textContent=formatNumber(dushka);});
  await db.ref('servers/'+currentServerId+'/players/'+currentNickname).set({x:x,y:y,base:myBaseId});
  db.ref('servers/'+currentServerId+'/players/'+currentNickname).onDisconnect().remove();
  lastConveyorSpawn=Date.now(); lastIncomeTick=Date.now();
  update(); window.focus(); resizeGame(); initJoystick();
}
async function assignBase(){
  const snap=await db.ref('servers/'+currentServerId+'/bases').once('value');
  const bases=snap.val()||{}; const taken=new Set();
  for(let b in bases){taken.add(parseInt(b));}
  for(let i=1;i<=8;i++){if(!taken.has(i))return i;} return 1;
}
async function loadAllBases(){const s=await db.ref('servers/'+currentServerId+'/bases').once('value');allBasesData=s.val()||{};}

function updateConveyor(dt){
  const now=Date.now();
  if(now-lastConveyorSpawn>SPAWN_INTERVAL){lastConveyorSpawn=now;spawnConveyor();}
  for(let i=conveyorBrainrots.length-1;i>=0;i--){
    const b=conveyorBrainrots[i];
    if(b.locked)continue;
    b.x+=CONVEYOR_SPEED*60*dt;
    b.dom.style.left=b.x+'px';
    if(b.x>=384){b.dom.remove();conveyorBrainrots.splice(i,1);}
  }
}
function updateIncome(){
  const now=Date.now();
  if(now-lastIncomeTick>1000){
    lastIncomeTick=now;
    const total=mySlots.reduce((s,b)=>s+(b?b.income:0),0);
    if(total>0){
      coins+=total;
      document.getElementById('balance-amount').textContent=formatNumber(coins);
      if(!window._saveCounter) window._saveCounter=0;
      window._saveCounter++;
      if(window._saveCounter>=5){window._saveCounter=0;db.ref('users/'+currentNickname+'/coins').set(coins);}
    }
  }
}

function startWalking(br,startX,startY,targetX,targetY,onArrive){
  const dom=document.createElement('div');
  dom.className='brainrot-walker '+br.rarity;
  dom.style.backgroundImage='url(Картинки/'+br.file+')';
  dom.style.left=startX+'px'; dom.style.top=startY+'px';
  document.getElementById('game-container').appendChild(dom);
  walkingBrainrots.push({br,dom,x:startX,y:startY,targetX,targetY,onArrive});
}
function updateWalkers(dt){
  for(let i=walkingBrainrots.length-1;i>=0;i--){
    const w=walkingBrainrots[i];
    const dx=w.targetX-w.x, dy=w.targetY-w.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<3){w.dom.remove();if(w.onArrive)w.onArrive();walkingBrainrots.splice(i,1);continue;}
    const step=WALKER_SPEED*(dt*60);
    w.x+=(dx/dist)*step; w.y+=(dy/dist)*step;
    w.dom.style.left=w.x+'px'; w.dom.style.top=w.y+'px';
  }
}

async function buyConveyor(b){
  if(mySlots.filter(s=>s).length>=BASE_MAX){showModal('Ошибка','База полна (10/10)!');return;}
  if(coins<b.brainrot.price){showModal('Ошибка','Нужно $'+formatNumber(b.brainrot.price)+'\nУ тебя: $'+formatNumber(coins));return;}
  const free=mySlots.findIndex(s=>s===null);
  if(free<0){showModal('Ошибка','Нет свободного слота');return;}
  coins-=b.brainrot.price;
  document.getElementById('balance-amount').textContent=formatNumber(coins);
  const startX=b.x, startY=b.y;
  b.locked=true; b.dom.remove();
  const idx=conveyorBrainrots.indexOf(b);if(idx>-1)conveyorBrainrots.splice(idx,1);
  const bp=BASE_POSITIONS[myBaseId];
  const off=SLOT_OFFSETS[free];
  const targetX=bp.x+off.dx; const targetY=bp.y+off.dy;
  startWalking(b.brainrot,startX,startY,targetX,targetY,async()=>{
    mySlots[free]={file:b.brainrot.file,name:b.brainrot.name,rarity:b.brainrot.rarity,income:b.brainrot.income,price:b.brainrot.price,placedAt:Date.now()};
    await db.ref('users/'+currentNickname).update({coins:coins,baseSlots:mySlots});
    await db.ref('servers/'+currentServerId+'/bases/'+myBaseId+'/slots').set(mySlots);
    renderBaseSlots();
    showNotif('✅ '+b.brainrot.name+' пришёл!');
  });
}
async function sellBrainrot(idx){
  const br=mySlots[idx]; if(!br)return;
  if(br.rarity==='god'||br.rarity==='secret'||br.rarity==='og'){
    window._pendingSell={idx,br};
    document.getElementById('confirm-text').textContent='Do you want to sell '+br.name+'?';

    return;

  await doSell(idx,br);

const keys={w:false,s:false,a:false,d:false,arrowup:false,arrowdown:false,arrowleft:false,arrowright:false};
let touchDX=0,touchDY=0,joystickManager=null;
function initJoystick(){
  const z=document.getElementById('joystick-zone'); z.style.display='block';
  if(typeof nipplejs==='undefined') return;
  joystickManager=nipplejs.create({zone:z,mode:'static',position:{left:'50%',top:'50%'},color:'white',size:100,restOpacity:0.5,fadeTime:150});
  joystickManager.on('move',(e,d)=>{const f=Math.min(d.force,1);touchDX=Math.cos(d.angle.radian)*f;touchDY=-Math.sin(d.angle.radian)*f;});
  joystickManager.on('end',()=>{touchDX=0;touchDY=0;});
}
document.addEventListener('keydown',e=>{
  const k=String(e.key||'').toLowerCase(); if(!k)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(k==='w'||k==='ц'||k==='arrowup'){keys.w=true;keys.arrowup=true;e.preventDefault()}
  if(k==='s'||k==='ы'||k==='arrowdown'){keys.s=true;keys.arrowdown=true;e.preventDefault()}
  if(k==='a'||k==='ф'||k==='arrowleft'){keys.a=true;keys.arrowleft=true;e.preventDefault()}
  if(k==='d'||k==='в'||k==='arrowright'){keys.d=true;keys.arrowright=true;e.preventDefault()}
  if(k==='e'||k==='у'){interact();e.preventDefault()}
});
document.addEventListener('keyup',e=>{
  const k=String(e.key||'').toLowerCase(); if(!k)return;
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if(k==='w'||k==='ц'||k==='arrowup'){keys.w=false;keys.arrowup=false;e.preventDefault()}
  if(k==='s'||k==='ы'||k==='arrowdown'){keys.s=false;keys.arrowdown=false;e.preventDefault()}
  if(k==='a'||k==='ф'||k==='arrowleft'){keys.a=false;keys.arrowleft=false;e.preventDefault()}
  if(k==='d'||k==='в'||k==='arrowright'){keys.d=false;keys.arrowright=false;e.preventDefault()}
});

// ========== ИГРОВОЙ ЦИКЛ ==========
let lastTime=0,lastSync=0;
function update(t=0){
  requestAnimationFrame(update);
  const dt=Math.min((t-lastTime)/1000,0.1); lastTime=t;
  if(!inMenu && currentServerId){
    let dx=0,dy=0;
    if(keys.w||keys.arrowup)dy-=1;
    if(keys.s||keys.arrowdown)dy+=1;
    if(keys.a||keys.arrowleft)dx-=1;
    if(keys.d||keys.arrowright)dx+=1;
    if(Math.abs(touchDX)>0.05||Math.abs(touchDY)>0.05){dx+=touchDX;dy+=touchDY;}
    if(dx!==0||dy!==0){
      const len=Math.sqrt(dx*dx+dy*dy);
      const stepX=(dx/len)*PLAYER_SPEED*dt*60;
      const stepY=(dy/len)*PLAYER_SPEED*dt*60;
      const wasStuck=checkCollision(x,y);
      let nx=x+stepX;
      if(wasStuck||!checkCollision(nx,y)) x=nx;
      let ny=y+stepY;
      if(wasStuck||!checkCollision(x,ny)) y=ny;
      x=Math.max(8,Math.min(384,x));
      y=Math.max(8,Math.min(384,y));
      document.getElementById('player').style.left=x+'px';
      document.getElementById('player').style.top=y+'px';
    }
    if(Date.now()-lastSync>100){db.ref('servers/'+currentServerId+'/players/'+currentNickname).update({x:x,y:y});lastSync=Date.now();}
    updateConveyor(dt); updateWalkers(dt); updateIncome(); updateTarget();
  }
}
function checkCollision(cx,cy){
  const rect={x:cx,y:cy,w:8,h:16};
  for(const o of OBSTACLES) if(collide(rect,o)) return true;
  for(const k in otherPlayersData){
    const p=otherPlayersData[k];
    if(!p||p.x===undefined||p.y===undefined) continue;
    if(collide(rect,{x:p.x,y:p.y,w:8,h:16})) return true;
  }
  return false;
}
function updateTarget(){
  if(inMenu){currentTarget=null;document.getElementById('interact').style.display='none';return;}
  const pc={x:x+4,y:y+8}; currentTarget=null;
  for(const b of conveyorBrainrots){
    if(b.locked)continue;
    const d=Math.hypot(pc.x-(b.x+14),pc.y-(b.y+14));
    if(d<26){currentTarget={type:'conveyor',target:b};break;}
  }
  if(!currentTarget){
    const bp=BASE_POSITIONS[myBaseId];
    for(let i=0;i<10;i++){
      if(!mySlots[i]) continue;
      const off=SLOT_OFFSETS[i];
      const d=Math.hypot(pc.x-(bp.x+off.dx+8),pc.y-(bp.y+off.dy+8));
      if(d<18){currentTarget={type:'myBrainrot',slot:i};break;}
    }
  }
  if(!currentTarget){
    const objs=[
      {id:'rng-machine',x:190,y:137,w:20,h:20,action:'showModal',args:['RNG Машина','Скоро!']},
      {id:'shop-blue',x:150,y:137,w:20,h:20,action:'openShop'},
      {id:'queen-bee',x:230,y:137,w:20,h:24,action:'openBee'},
      {id:'shop-red',x:150,y:230,w:20,h:20,action:'openRedShop'},
      {id:'rng-circle',x:190,y:230,w:20,h:20,action:'openWheel'},
      {id:'shop-white',x:230,y:230,w:20,h:20,action:'showModal',args:['Trade','Скоро!']}
    ];
    for(const o of objs){
      const d=Math.hypot(pc.x-(o.x+10),pc.y-(o.y+o.h/2));
      if(d<28){currentTarget={type:'obj',obj:o};break;}
    }
  }
  if(!currentTarget){
    const gz=GREEN_ZONE[myBaseId];
    if(gz){
      const d=Math.hypot(pc.x-gz.x,pc.y-gz.y);
      if(d<25){currentTarget={type:'base'};}
    }
  }
  const btn=document.getElementById('interact');
  if(currentTarget){
    btn.style.display='flex';
    btn.style.left=(x-7)+'px';
    btn.style.top=(y-24)+'px';
  } else btn.style.display='none';
}
function interact(){
  if(!currentTarget) return;
  if(currentTarget.type==='conveyor'){buyConveyor(currentTarget.target);}
  else if(currentTarget.type==='base'){openBaseMenu();}
  else if(currentTarget.type==='myBrainrot'){sellBrainrot(currentTarget.slot);}
  else if(currentTarget.type==='obj'){
    const o=currentTarget.obj;
    if(o.action==='openShop')openShop();
    else if(o.action==='openBee')openBee();
    else if(o.action==='openRedShop')openRedShop();
    else if(o.action==='openWheel')openWheel();
    else if(o.action==='showModal')showModal(o.args[0],o.args[1]);
  }
}

// ========== СЕРВЕРЫ / ДРУЗЬЯ / ПРОФИЛЬ ==========
async function openServers(){
  document.getElementById('main-menu').style.display='none';
  document.getElementById('server-menu').style.display='block';
  await loadServers();
}
async function loadServers(){
  const c=document.getElementById('server-list'); c.innerHTML='';
  const s=await db.ref('servers').once('value'); const servers=s.val()||{};
  const isAdmin=currentNickname==='MrDushka';
  for(let id in servers){
    const sv=servers[id];
    const pSnap=await db.ref('servers/'+id+'/players').once('value');
    const count=Object.keys(pSnap.val()||{}).length;
    const full=count>=8;
    const div=document.createElement('div'); div.className='server-item';
    div.innerHTML='<div class="name">'+sv.name+'</div>'+
      '<div class="players">'+count+'/8</div>'+
      (full?'<span class="full">Полный</span>':'<button class="join-btn" onclick="joinServer(\''+id+'\')">Join</button>');
    c.appendChild(div);
  }
  if(c.innerHTML==='') c.innerHTML='<div style="color:#aaa;text-align:center;padding:20px">Нет серверов</div>';
}
function closeServers(){document.getElementById('server-menu').style.display='none';showMainMenu();}
async function joinServer(id){await db.ref('users/'+currentNickname).update({serverId:id});currentServerId=id;closeServers();startGame();}
function openCreateServer(){document.getElementById('create-server-modal').style.display='block';}
function closeCreateServer(){document.getElementById('create-server-modal').style.display='none';}
async function createServer(){
  const n=document.getElementById('server-name').value.trim(); if(!n){showModal('Ошибка','Введите название');return;}
  const d=await readUserData(currentNickname); if(!d||d.dushka<100){showModal('Ошибка','Нужно 100 Dushka!');return;}
  await db.ref('users/'+currentNickname).update({dushka:d.dushka-100});
  const r=db.ref('servers').push();
  await r.set({name:n,access:'all',owner:currentNickname});
  closeCreateServer(); openServers();
}
async function openFriends(){document.getElementById('main-menu').style.display='none';document.getElementById('friends-menu').style.display='block';await loadFriendRequests();await loadFriends();}
async function searchFriend(){
  const n=document.getElementById('friend-search').value.trim();
  if(!n){showModal('Ошибка','Введите ник');return;}
  const u=await readUserData(n); const rd=document.getElementById('friend-result');
  if(!u){rd.innerHTML='<div style="color:#f44">Не найден</div>';return;}
  rd.innerHTML='<div class="friend-item"><div class="nick">'+n+'</div><button onclick="sendFriendRequest(\''+n+'\')" style="background:#4caf50;border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer">Отправить</button></div>';
}
async function sendFriendRequest(n){
  const d=await readUserData(n); if(!d){showModal('Ошибка','Не найден');return;}
  let r=d.friendRequests||[]; if(r.includes(currentNickname)){showModal('Инфо','Уже отправлено');return;}
  r.push(currentNickname); await db.ref('users/'+n).update({friendRequests:r});
  showModal('Успех','Отправлено!');
}
async function loadFriendRequests(){
  const d=await readUserData(currentNickname); const r=(d&&d.friendRequests)||[];
  const c=document.getElementById('friend-requests'); c.innerHTML='';
  if(r.length===0){c.innerHTML='<div style="color:#aaa">Нет запросов</div>';return;}
  r.forEach(rq=>{
    const div=document.createElement('div'); div.className='friend-item';
    div.innerHTML='<div class="nick">'+rq+'</div><button onclick="acceptFriend(\''+rq+'\')" style="background:#4caf50;border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer">Принять</button>';
    c.appendChild(div);
  });
}
async function acceptFriend(n){
  const d=await readUserData(currentNickname); let f=d.friends||[]; if(!f.includes(n))f.push(n);
  await db.ref('users/'+currentNickname).update({friends:f});
  let r=d.friendRequests||[]; r=r.filter(x=>x!==n);
  await db.ref('users/'+currentNickname).update({friendRequests:r});
  await loadFriendRequests(); await loadFriends();
}
async function loadFriends(){
  const d=await readUserData(currentNickname); const f=(d&&d.friends)||[];
  const c=document.getElementById('friends-list'); c.innerHTML='';
  if(f.length===0){c.innerHTML='<div style="color:#aaa">Нет друзей</div>';return;}
  f.forEach(fr=>{
    const div=document.createElement('div'); div.className='friend-item';
    div.innerHTML='<div class="nick">'+fr+'</div><div><button onclick="showFriendProfile(\''+fr+'\')" style="background:#0f3460;border:none;color:#fff;padding:5px 10px;border-radius:6px;cursor:pointer">Профиль</button></div>';
    c.appendChild(div);
  });
}
async function showFriendProfile(f){showModal('Профиль друга',f);}
function closeFriends(){document.getElementById('friends-menu').style.display='none';showMainMenu();}
function openProfile(){
  document.getElementById('main-menu').style.display='none';
  document.getElementById('profile-menu').style.display='block';
  readUserData(currentNickname).then(d=>{
    if(d){
      document.getElementById('avatar-preview').style.backgroundImage=d.avatar?'url('+d.avatar+')':'none';
      document.getElementById('bg-preview').style.backgroundImage=d.background?'url('+d.background+')':'none';
    }
  });
}
document.getElementById('avatar-input').addEventListener('change',function(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=function(ev){
    document.getElementById('avatar-preview').style.backgroundImage='url('+ev.target.result+')';
    window._avatarData=ev.target.result;
  }; r.readAsDataURL(f);
});
document.getElementById('bg-input').addEventListener('change',function(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=function(ev){
    document.getElementById('bg-preview').style.backgroundImage='url('+ev.target.result+')';
    window._bgData=ev.target.result;
  }; r.readAsDataURL(f);
});
async function saveProfile(){
  let a=window._avatarData||''; let b=window._bgData||'';
  await db.ref('users/'+currentNickname).update({avatar:a,background:b});
  showModal('Успех','Профиль сохранён');
}
function closeProfile(){document.getElementById('profile-menu').style.display='none';showMainMenu();}

async function exitToMenu(){
  if(currentServerId&&currentNickname){try{await db.ref('servers/'+currentServerId+'/players/'+currentNickname).remove();}catch(e){}}
  conveyorBrainrots.forEach(b=>b.dom.remove());conveyorBrainrots=[];
  walkingBrainrots.forEach(w=>w.dom.remove());walkingBrainrots=[];
  for(const k in otherPlayers){otherPlayers[k].remove();}otherPlayers={};otherPlayersData={};
  document.getElementById('app').style.display='none';
  document.getElementById('exit-btn').style.display='none';
  document.getElementById('balance').style.display='none';
  document.getElementById('main-menu').style.display='flex';
}
window.addEventListener('load',()=>{resizeGame();});
</script>
